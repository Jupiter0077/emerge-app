    function performSearch(query) {
      if (!query.trim()) {
        searchResults.innerHTML = '';
        return;
      }

      const notes = loadNotes();
      const q = query.trim().toLowerCase();
      const todos = notes.filter(n =>
        n.type === 'todo' && n.text && n.text.toLowerCase().includes(q)
      );

      if (todos.length === 0) {
        searchResults.innerHTML = '<div class="search-empty">没有找到匹配的待办事项</div>';
        return;
      }

      searchResults.innerHTML = '';
      todos.slice(0, 50).forEach(todo => {
        const item = document.createElement('div');
        item.className = 'search-result-item';

        const projectColor = todo.projectId ? getProjectColor(todo.projectId) : '#c0c0c5';
        const dot = document.createElement('span');
        dot.className = 'search-result-dot';
        dot.style.backgroundColor = projectColor;
        item.appendChild(dot);

        const textEl = document.createElement('span');
        textEl.className = 'search-result-text';
        textEl.innerHTML = highlightMatch(todo.text, query.trim());
        if (todo.completed) textEl.style.textDecoration = 'line-through';
        item.appendChild(textEl);

        const meta = document.createElement('div');
        meta.className = 'search-result-meta';

        if (todo.scheduledDate) {
          const dateBadge = document.createElement('span');
          dateBadge.className = 'search-result-badge';
          dateBadge.textContent = formatDateBadge(todo.scheduledDate);
          meta.appendChild(dateBadge);
        }

        if (todo.projectId) {
          const projName = getProjectName(todo.projectId);
          if (projName) {
            const projBadge = document.createElement('span');
            projBadge.className = 'search-result-badge';
            projBadge.textContent = projName;
            meta.appendChild(projBadge);
          }
        } else if (todo.parentGoalId) {
          const goalName = getGoalName(todo.parentGoalId);
          if (goalName) {
            const goalBadge = document.createElement('span');
            goalBadge.className = 'search-result-badge';
            goalBadge.textContent = goalName;
            meta.appendChild(goalBadge);
          }
        }

        if (todo.completed) {
          const doneBadge = document.createElement('span');
          doneBadge.className = 'search-result-badge';
          doneBadge.textContent = '已完成';
          meta.appendChild(doneBadge);
        }

        item.appendChild(meta);

        item.addEventListener('click', () => {
          if (todo.projectId) {
            setFilter(todo.projectId);
          } else if (todo.scheduledDate) {
            setFilter('all');
          } else {
            setFilter('all');
          }

          if (todo.scheduledDate) {
            selectedDate = todo.scheduledDate;
            currentView = 'day';
            renderWeekView();
          }

          toggleSearch(false);
        });

        searchResults.appendChild(item);
      });
    }

    if (searchCloseBtn) {
      searchCloseBtn.addEventListener('click', () => toggleSearch(false));
    }

    if (searchInput) {
      let searchTimer = null;
      searchInput.addEventListener('input', () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => performSearch(searchInput.value), 150);
      });

      searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          toggleSearch(false);
        }
      });
    }

    document.addEventListener('click', (e) => {
      if (searchPanel.classList.contains('show') &&
          !searchPanel.contains(e.target)) {
        const btn = document.getElementById('sidebar-search-btn');
        if (!btn || !btn.contains(e.target)) {
          toggleSearch(false);
        }
      }
    });

    applyAppearanceSettings();
    applyBrightnessMode();

    if (window.matchMedia) {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
        if (getBrightnessMode() === 'system') {
          applyBrightnessMode();
        }
      });
    }

    if (activeFilter === ANCHOR_ID) {
      input.placeholder = t('记录到「时间块规划」');
    } else if (activeFilter === CHECKIN_ID) {
      input.placeholder = t('记录到「打卡」');
    } else if (activeFilter !== 'all') {
      input.placeholder = `${t('记录到「')}${getProjectName(activeFilter)}」`;
    }

    // 侧边栏拖拽调整宽度
    const sidebar = document.getElementById('sidebar');
    const sidebarResizer = document.getElementById('sidebar-resizer');
    const weekPanel = document.getElementById('week-panel');
    const weekPanelResizer = document.getElementById('week-panel-resizer');
    const mainEl = document.querySelector('.main');
    const MIN_WIDTH = 140;
    let sidebarDragging = false;
    let weekPanelDragging = false;
    let resizingTodo = null;
    let resizeStartY = 0;
    let resizeStartDuration = 0;
    let resizeCurrentDuration = null;
    let resizeTodoId = null;
    let resizeMode = 'bottom'; // 'top' or 'bottom'
    let resizeStartScheduledTime = null; // 'HH:MM' for top resize
    let resizeCurrentScheduledTime = null;
    let resizeRafId = null;
    let dragStartX = 0;
    let dragStartWidth = 0;

    function getMaxSidebarWidth() {
      const mainRect = mainEl.getBoundingClientRect();
      const appLayoutRect = document.querySelector('.app-layout').getBoundingClientRect();
      // 考虑玻璃模式下边栏的左侧偏移
      const sidebarLeft = sidebar.offsetLeft;
      return Math.max(MIN_WIDTH, mainRect.left - appLayoutRect.left - sidebarLeft - 20);
    }

    function getMaxWeekPanelWidth() {
      const appLayoutRect = document.querySelector('.app-layout').getBoundingClientRect();
      const sidebarWidth = sidebar.classList.contains('collapsed') ? 0 : sidebar.offsetWidth;
      // 最大宽度 = 整个应用宽度 - 左侧边栏宽度 - 10px间距
      // 允许覆盖主页内容，方便用户查看完整日历视图
      return Math.max(MIN_WIDTH, appLayoutRect.width - sidebarWidth - 10);
    }

    // 双击 resizer 恢复默认宽度
    sidebarResizer.addEventListener('dblclick', (e) => {
      if (sidebar.classList.contains('collapsed')) return;
      e.preventDefault();
      sidebar.style.width = '';
      sidebarResizer.style.left = '';
      animateMainCenter();
    });

    weekPanelResizer.addEventListener('dblclick', (e) => {
      if (weekPanel.classList.contains('collapsed')) return;
      e.preventDefault();
      weekPanel.style.width = '';
      weekPanelResizer.style.right = '';
      animateMainCenter();
    });

    sidebarResizer.addEventListener('mousedown', (e) => {
      if (sidebar.classList.contains('collapsed')) return;
      sidebarDragging = true;
      dragStartX = e.clientX;
      dragStartWidth = sidebar.offsetWidth;
      sidebarResizer.classList.add('dragging');
      // 拖动时移除过渡动画，避免每帧重绘玻璃模糊导致卡顿
      sidebar.style.transition = 'none';
      sidebarResizer.style.transition = 'none';
      mainEl.style.transition = 'none';
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';
      e.preventDefault();
      e.stopPropagation();
    });

    weekPanelResizer.addEventListener('mousedown', (e) => {
      if (weekPanel.classList.contains('collapsed')) return;
      weekPanelDragging = true;
      dragStartX = e.clientX;
      dragStartWidth = weekPanel.offsetWidth;
      weekPanelResizer.classList.add('dragging');
      // 拖动时移除过渡动画，避免每帧重绘玻璃模糊导致卡顿
      weekPanel.style.transition = 'none';
      weekPanelResizer.style.transition = 'none';
      mainEl.style.transition = 'none';
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';
      e.preventDefault();
      e.stopPropagation();
    });

    let lastCompactState = null;
    let lastMovedTodoId = localStorage.getItem('zhixing-last-moved-todo') || null;

    function updateTimeBlockContent(el, isWeekView, height, padTotal, scheduledTime, duration) {
      const showThreshold = isWeekView ? Infinity : 36;
      const timeRangeH = isWeekView ? 11 : 13;
      const fontSize = isWeekView ? 11 : 13;
      const lineH = isWeekView ? 1.3 : 1.5;
      const shouldShow = height >= showThreshold;

      const textSelector = isWeekView ? '.week-time-cell-todo-text' : '.time-todo-text';
      const contentSelector = isWeekView ? '.week-time-cell-todo-content' : '.time-todo-content';
      const timeRangeSelector = isWeekView ? '.week-time-cell-todo-time-range' : '.time-todo-time-range';
      const timeRangeClass = isWeekView ? 'week-time-cell-todo-time-range' : 'time-todo-time-range';

      const textEl = el.querySelector(textSelector);
      if (textEl) {
        textEl.style.webkitLineClamp = Math.max(1, Math.floor((height - padTotal - (shouldShow ? timeRangeH : 0)) / (fontSize * lineH)));
      }

      const contentEl = el.querySelector(contentSelector);
      if (contentEl) {
        let timeRangeEl = el.querySelector(timeRangeSelector);
        if (shouldShow) {
          if (!timeRangeEl) {
            timeRangeEl = document.createElement('span');
            timeRangeEl.className = timeRangeClass;
            contentEl.appendChild(timeRangeEl);
          }
          if (scheduledTime) {
            timeRangeEl.textContent = formatTimeRange(scheduledTime, duration);
          }
        } else if (timeRangeEl) {
          timeRangeEl.remove();
        }
      }
    }

    document.addEventListener('mousemove', (e) => {
      if (sidebarDragging) {
        const deltaX = e.clientX - dragStartX;
        let newWidth = dragStartWidth + deltaX;
        newWidth = Math.max(MIN_WIDTH, Math.min(getMaxSidebarWidth(), newWidth));
        sidebar.style.width = newWidth + 'px';
        // 直接根据 sidebar 右边缘定位 resizer，兼容玻璃/纯色两种模式
        const sidebarRect = sidebar.getBoundingClientRect();
        const appLayoutRect = document.querySelector('.app-layout').getBoundingClientRect();
        sidebarResizer.style.left = (sidebarRect.right - appLayoutRect.left) + 'px';
      }
      if (weekPanelDragging) {
        const deltaX = e.clientX - dragStartX;
        let newWidth = dragStartWidth - deltaX;
        newWidth = Math.max(MIN_WIDTH, Math.min(getMaxWeekPanelWidth(), newWidth));
        weekPanel.style.width = newWidth + 'px';
        // 直接根据 week-panel 左边缘定位 resizer，兼容玻璃/纯色两种模式
        const weekPanelRect = weekPanel.getBoundingClientRect();
        const appLayoutRect = document.querySelector('.app-layout').getBoundingClientRect();
        weekPanelResizer.style.right = (appLayoutRect.right - weekPanelRect.left) + 'px';
        if (currentView === 'month') {
          const isCompact = newWidth < 320;
          if (lastCompactState === null) {
            lastCompactState = isCompact;
          } else if (lastCompactState !== isCompact) {
            lastCompactState = isCompact;
            // 拖动过程中不重建 DOM，只在松手后重渲染
          }
        }
      }
      if (resizingTodo && resizeTodoId !== null) {
        const deltaY = e.clientY - resizeStartY;
        const pxPerMin = 44 / 60;
        const deltaMinutes = deltaY / pxPerMin;
        const isWeekView = resizingTodo.classList.contains('week-time-cell-todo');
        const minBlockHeight = isWeekView ? 18 : 22;
        const padTotal = isWeekView ? 4 : 6;

        if (resizeMode === 'top') {
          const origH = parseInt(resizeStartScheduledTime.split(':')[0], 10);
          const origM = parseInt(resizeStartScheduledTime.split(':')[1], 10) || 0;
          const origTotalMin = origH * 60 + origM;
          const maxDelta = resizeStartDuration - 15;
          const clampedDelta = Math.max(-origTotalMin, Math.min(maxDelta, deltaMinutes));
          const snappedDelta = Math.round(clampedDelta / 15) * 15;
          const newTotalMin = origTotalMin + snappedDelta;
          const newDuration = resizeStartDuration - snappedDelta;
          const newH = Math.floor(newTotalMin / 60);
          const newM = newTotalMin % 60;
          resizeCurrentScheduledTime = String(newH).padStart(2, '0') + ':' + String(newM).padStart(2, '0');
          resizeCurrentDuration = newDuration;
          const rawHeight = Math.max(minBlockHeight, ((resizeStartDuration - clampedDelta) / 60) * 44);
          const origTopPx = parseFloat(resizingTodo._resizeOrigTop) || 0;
          const rawTop = (origTopPx + clampedDelta * pxPerMin) + 'px';
          if (resizeRafId) cancelAnimationFrame(resizeRafId);
          resizeRafId = requestAnimationFrame(() => {
            if (!resizingTodo) return;
            resizingTodo.style.top = rawTop;
            resizingTodo.style.height = rawHeight + 'px';
            resizingTodo.style.minHeight = rawHeight + 'px';
          });
        } else {
          const rawDuration = Math.max(15, Math.min(480, resizeStartDuration + deltaY / pxPerMin));
          const snappedDuration = Math.round(rawDuration / 15) * 15;
          resizeCurrentDuration = Math.max(15, Math.min(480, snappedDuration));
          const rawHeight = Math.max(minBlockHeight, (rawDuration / 60) * 44);
          if (resizeRafId) cancelAnimationFrame(resizeRafId);
          resizeRafId = requestAnimationFrame(() => {
            if (!resizingTodo) return;
            resizingTodo.style.height = rawHeight + 'px';
            resizingTodo.style.minHeight = rawHeight + 'px';
          });
        }
      }
    });

    document.addEventListener('mouseup', () => {
      if (sidebarDragging) {
        sidebarDragging = false;
        sidebarResizer.classList.remove('dragging');
        // 恢复过渡动画
        sidebar.style.transition = '';
        sidebarResizer.style.transition = '';
        mainEl.style.transition = '';
      }
      if (weekPanelDragging) {
        weekPanelDragging = false;
        weekPanelResizer.classList.remove('dragging');
        // 恢复过渡动画
        weekPanel.style.transition = '';
        weekPanelResizer.style.transition = '';
        mainEl.style.transition = '';
        if (currentView === 'month') {
          renderWeekView();
        }
      }
      if (resizingTodo && resizeTodoId !== null) {
        if (resizeRafId) { cancelAnimationFrame(resizeRafId); resizeRafId = null; }
        const notes = loadNotes();
        const note = notes.find(n => String(n.id) === String(resizeTodoId));
        if (note) {
          lastMovedTodoId = String(resizeTodoId);
          localStorage.setItem('zhixing-last-moved-todo', lastMovedTodoId);
          if (resizeMode === 'top' && resizeCurrentScheduledTime) {
            note.scheduledTime = resizeCurrentScheduledTime;
            note.duration = resizeCurrentDuration !== null ? resizeCurrentDuration : resizeStartDuration;
            saveNotes(notes);
            renderWeekView();
          } else {
            let newDuration = resizeCurrentDuration !== null ? resizeCurrentDuration : resizeStartDuration;
            newDuration = Math.max(15, Math.min(480, newDuration));
            note.duration = newDuration;
            saveNotes(notes);
            renderWeekView();
          }
        }
        // 清理
        if (resizingTodo) {
          resizingTodo.classList.remove('resizing');
          resizingTodo.style.willChange = '';
          delete resizingTodo._resizeOrigTop;
        }
        resizingTodo = null;
        resizeTodoId = null;
        resizeCurrentDuration = null;
        resizeCurrentScheduledTime = null;
        resizeStartScheduledTime = null;
        resizeMode = 'bottom';
      }
      if (!sidebarDragging && !weekPanelDragging && !resizingTodo) {
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
      }
      lastCompactState = null;
    });

    // 侧边栏折叠/展开
    const sidebarToggle = document.getElementById('sidebar-toggle');
    const weekPanelToggle = document.getElementById('week-panel-toggle');
    let autoCollapsedSidebar = false;

    function checkSidebarAutoCollapse() {
      if (!sidebar.classList.contains('collapsed')) {
        const sidebarRect = sidebar.getBoundingClientRect();
        const mainRect = mainEl.getBoundingClientRect();
        if (sidebarRect.right > mainRect.left + 56) {
          sidebar.classList.add('collapsed');
          sidebarResizer.classList.add('collapsed');
          sidebar.style.width = '';
          sidebar.style.transition = '';
          sidebarResizer.style.left = '';
          sidebarResizer.style.transition = '';
          autoCollapsedSidebar = true;
          const rightWidth = weekPanel.classList.contains('collapsed') ? 0 : weekPanel.offsetWidth;
          document.documentElement.style.setProperty('--main-shift', (0 - rightWidth) / 2 + 'px');
        }
      } else if (autoCollapsedSidebar) {
        const w = window.innerWidth;
        const sidebarW = Math.max(220, Math.min(340, w * 0.203));
        const weekPanelW = Math.max(260, Math.min(400, w * 0.24));
        const expandThreshold = sidebarW + weekPanelW + 720 + 20;
        if (w >= expandThreshold) {
          sidebar.classList.remove('collapsed');
          sidebarResizer.classList.remove('collapsed');
          sidebar.style.width = '';
          sidebar.style.transition = '';
          sidebarResizer.style.left = '';
          sidebarResizer.style.transition = '';
          autoCollapsedSidebar = false;
          animateMainCenter();
        }
      }
    }

    function toggleSidebar() {
      const collapsed = sidebar.classList.toggle('collapsed');
      sidebarResizer.classList.toggle('collapsed', collapsed);
      // 折叠和展开时都清除 inline style，恢复默认宽度
      sidebar.style.width = '';
      sidebar.style.transition = '';
      sidebarResizer.style.left = '';
      sidebarResizer.style.transition = '';
      localStorage.setItem(SIDEBAR_COLLAPSED_KEY, collapsed ? '1' : '');
      autoCollapsedSidebar = false;
      animateMainCenter();
    }

    function toggleWeekPanel() {
      const collapsed = weekPanel.classList.toggle('collapsed');
      weekPanelResizer.classList.toggle('collapsed', collapsed);
      // 折叠和展开时都清除 inline style，恢复默认宽度
      weekPanel.style.width = '';
      weekPanel.style.transition = '';
      weekPanelResizer.style.right = '';
      weekPanelResizer.style.transition = '';
      localStorage.setItem(WEEKPANEL_COLLAPSED_KEY, collapsed ? '1' : '');
      // 展开后确保右边日历有内容
      if (!collapsed) {
        try { renderWeekView(true); } catch (e) {}
      }
      animateMainCenter();
    }

    // 根据左右边栏实际宽度，动态计算主页内容的居中偏移
    function updateMainCenter() {
      const leftWidth = sidebar.classList.contains('collapsed') ? 0 : sidebar.offsetWidth;
      const rightWidth = weekPanel.classList.contains('collapsed') ? 0 : weekPanel.offsetWidth;
      const shift = (leftWidth - rightWidth) / 2;
      document.documentElement.style.setProperty('--main-shift', shift + 'px');
    }

    // 折叠/展开动画期间，用 RAF 逐帧读取边栏实际宽度来更新主页偏移，
    // 让主页内容完美跟随边栏的每一帧变化，实现无感过渡
    let _mainCenterRAF = null;
    let _mainCenterTimer = null;
    function animateMainCenter() {
      if (_mainCenterRAF) cancelAnimationFrame(_mainCenterRAF);
      if (_mainCenterTimer) clearTimeout(_mainCenterTimer);
      // 动画期间关闭 CSS transition，由 JS 逐帧驱动
      mainEl.style.transition = 'none';
      function tick() {
        updateMainCenter();
        _mainCenterRAF = requestAnimationFrame(tick);
      }
      tick();
      // 动画结束后恢复 CSS transition 并做最终校正
      _mainCenterTimer = setTimeout(() => {
        if (_mainCenterRAF) { cancelAnimationFrame(_mainCenterRAF); _mainCenterRAF = null; }
        mainEl.style.transition = '';
        updateMainCenter();
      }, 320);
    }

    window.addEventListener('resize', () => {
      updateMainCenter();
      checkSidebarAutoCollapse();
    });

    sidebarToggle.addEventListener('click', toggleSidebar);
    weekPanelToggle.addEventListener('click', toggleWeekPanel);

    sidebarToggle.addEventListener('mousedown', (e) => e.stopPropagation());
    weekPanelToggle.addEventListener('mousedown', (e) => e.stopPropagation());

    // 恢复折叠状态
    if (localStorage.getItem(SIDEBAR_COLLAPSED_KEY)) {
      sidebar.classList.add('collapsed');
      sidebarResizer.classList.add('collapsed');
    }
    // 右侧日历默认保持展开，避免某个浏览器里保存过折叠状态后误以为日历消失。
    localStorage.removeItem(WEEKPANEL_COLLAPSED_KEY);
    weekPanel.style.width = '';
    weekPanel.style.transition = '';
    weekPanelResizer.style.right = '';
    weekPanelResizer.style.transition = '';
    weekPanel.classList.remove('collapsed');
    weekPanelResizer.classList.remove('collapsed');
    updateMainCenter();
    checkSidebarAutoCollapse();

    // 初始化时间骨架模板
    skeletonTemplates = loadSkeletonTemplates();
    skeletonCategories = loadSkeletonCategories();

    function ensureWeekPanelReady() {
      // 数据修复后只保留轻量兜底：确保面板展开，内容为空时补渲染一次。
      try {
        localStorage.removeItem(WEEKPANEL_COLLAPSED_KEY);
        weekPanel.classList.remove('collapsed');
        weekPanelResizer.classList.remove('collapsed');

        const content = document.getElementById('week-panel-content');
        const isBlank = !content || content.children.length === 0 || content.textContent.trim().length === 0;
        if (isBlank) {
          renderWeekView(true);
        }
      } catch (err) {
        console.error('[week-panel] 首屏补渲染失败:', err);
      }
    }

    let stableWeekPanelRenderTimer = null;
    function scheduleStableWeekPanelRender() {
      // 不在 render() 正中间直接重建右侧日历，等当前 DOM 更新结束后轻量刷新一次。
      if (stableWeekPanelRenderTimer) {
        clearTimeout(stableWeekPanelRenderTimer);
      }
      stableWeekPanelRenderTimer = setTimeout(() => {
        stableWeekPanelRenderTimer = null;
        renderWeekView(true);
        ensureWeekPanelReady();
      }, 0);
    }

    // 全局监听：从下一步面板拖出的待办，只要不是放在下一步面板内就自动取消下一步
    document.addEventListener('drop', (e) => {
      if (!window._draggingFromNextAction) return;
      const noteId = window._draggingFromNextAction;
      window._draggingFromNextAction = null;
      // 检查 drop 是否发生在下一步面板内
      const nextPanel = e.target.closest('.next-action-panel');
      if (nextPanel) return; // 在下一步面板内放下，不处理
      // 在面板外放下 → 取消下一步标记
      setTimeout(() => {
        const allNotes = loadNotes();
        const n = allNotes.find(x => String(x.id) === String(noteId));
        if (n && n.isNextAction) {
          n.isNextAction = false;
          delete n.nextActionOrder;
          saveNotes(allNotes);
          render();
        }
      }, 0);
    }, true); // 捕获阶段，确保在其他 drop 监听器之前执行

    // 所有状态恢复和事件绑定完成后再渲染，避免 Safari 刷新时先恢复旧布局。
    render();
    renderProjects();
    renderSpecialProjects();
    scheduleStableWeekPanelRender();
    updateProBadge();
    setupProDebugToggle();
    _translateDOM(); // Translate initial HTML content

    // 诊断：打印 localStorage 数据大小
    (function diagLocalStorage() {
      let total = 0;
      const keys = [STORAGE_KEY, PROJECTS_KEY, MOOD_KEY, SKELETON_KEY, SKELETON_TEMPLATE_KEY, SKELETON_CATEGORIES_KEY];
      const sizes = {};
      keys.forEach(k => {
        const v = localStorage.getItem(k) || '';
        sizes[k.replace('zhixing-heyi-', '')] = Math.round(v.length / 1024) + 'KB';
        total += v.length;
      });
      console.log('[诊断] localStorage 总大小:', Math.round(total / 1024) + 'KB', sizes);
    })();

    // ========== 付费墙 Paywall 逻辑 ==========
    const FREE_PROJECT_LIMIT = 3;
    const FREE_TODOS_PER_PROJECT = 30; // 每个项目（含主页/未归类）最多 30 个待办
    let paywallProducts = [];
    let selectedProductId = null;
    let isPaywallLoading = false;

    // 检查是否可以创建待办
    // 返回 { canAdd: boolean, reason: string, projectId: string|null, count: number, limit: number }
    function canAddTodo(projectId) {
      const notes = loadNotes();
      // 统计所有待办（包括已完成和未完成）
      const todoNotes = notes.filter(n => n.type === 'todo');

      // 某个项目内的待办数（含主页/未归类 projectId = null）
      const projectTodos = todoNotes.filter(n => (n.projectId || null) === projectId);

      // 主页（未归类）限制 100，项目页限制 30
      const limit = projectId === null || projectId === 'all' || projectId === undefined

    function formatExpiryDate(timestamp) {
      if (!timestamp) return null;
      const d = new Date(timestamp * 1000);
      const y = d.getFullYear();
      const m = d.getMonth() + 1;
      const day = d.getDate();
      return `${y}年${m}月${day}日`;
    }

      if (productId.includes('lifetime') || !productId.includes('monthly') && !productId.includes('yearly')) return t('终身会员');
      return t('Pro 会员');

    async function fetchPaywallProducts() {
      var fallbackProducts = [
        { id: 'com.yangjiahui.zhixingheyi.monthly', title: '月度会员', description: '按月订阅，随时取消', price: '¥10', price_number: 10, is_trial_available: false, trial_period: '', period_unit: 'month' },
        { id: 'com.yangjiahui.zhixingheyi.yearly', title: '年度会员', description: '按年订阅，立省41%', price: '¥68', price_number: 68, is_trial_available: true, trial_period: '7天免费试用', period_unit: 'year' },
        { id: 'com.yangjiahui.zhixingheyi', title: '终身会员', description: '一次购买，永久使用', price: '¥98', price_number: 98, is_trial_available: false, trial_period: '', period_unit: 'lifetime' },
      ];
      try {
        if (window.__TAURI__) {
          const products = await window.__TAURI__.core.invoke('fetch_products');
          console.log('[Paywall] 后端返回产品数:', products ? products.length : 0);
          if (products) {
            products.forEach(function(p) { console.log('[Paywall] 后端产品:', p.id, p.title, p.price); });
          }
          if (products && products.length >= 3) {
            paywallProducts = products;
            return products;
          }
          if (products && products.length > 0 && products.length < 3) {
            console.log('[Paywall] 后端只返回了 ' + products.length + ' 个产品，使用 fallback 补全');
            var returnedIds = {};
            products.forEach(function(p) { returnedIds[p.id] = true; });
            var merged = products.slice();
            for (var i = 0; i < fallbackProducts.length; i++) {
              var fp = fallbackProducts[i];
              if (!returnedIds[fp.id]) {
                console.log('[Paywall] 补全产品:', fp.id);
                merged.push(fp);
              }
            }
            var orderMap = {};
            fallbackProducts.forEach(function(fp, idx) { orderMap[fp.id] = idx; });
            merged.sort(function(a, b) {
              return (orderMap[a.id] !== undefined ? orderMap[a.id] : 99) - (orderMap[b.id] !== undefined ? orderMap[b.id] : 99);
            });
            paywallProducts = merged;
            return merged;
          }
        }
      } catch (e) {
        console.warn('[Paywall] 获取产品列表失败:', e);
      }
      console.log('[Paywall] 使用 fallback 产品列表');
      paywallProducts = fallbackProducts;
      return paywallProducts;
    }

    (function() {

          minProjectsCreated: 3,
          minDaysUsed: 5,
          minSessions: 5,
          cooldownDays: 90,
          feedbackEmail: 'hey.emerge@outlook.com',
          debugMode: false,
        };

        function loadReviewData() {
          try {
            var raw = localStorage.getItem(REVIEW_KEY);
            if (raw) return JSON.parse(raw);
          } catch(e) {}
          return {
            firstUseDate: Date.now(),
            lastReviewDate: null,
            lastSessionDate: null,
            sessionCount: 0,
            projectsCreated: 0,
            hasReviewed: false,
            hasGivenFeedback: false,
            dismissedCount: 0,
          };
        }

        function saveReviewData(data) {
          try { localStorage.setItem(REVIEW_KEY, JSON.stringify(data)); } catch(e) {}
        }

        function getDaysUsed(data) {
          if (!data.firstUseDate) return 0;
          return Math.floor((Date.now() - data.firstUseDate) / (24 * 60 * 60 * 1000));
        }

        function recordReviewSession() {
          var data = loadReviewData();
          var today = new Date().setHours(0, 0, 0, 0);
          var lastSession = data.lastSessionDate ? new Date(data.lastSessionDate).setHours(0, 0, 0, 0) : null;
          if (lastSession !== today) {
            data.sessionCount += 1;
            data.lastSessionDate = Date.now();
          }
          if (!data.firstUseDate) data.firstUseDate = Date.now();
          saveReviewData(data);
        }

        function recordProjectCreated() {
          var data = loadReviewData();
          data.projectsCreated = (data.projectsCreated || 0) + 1;
          saveReviewData(data);
          maybeShowReviewPrompt();
        }

        function shouldShowReviewPrompt() {
          var data = loadReviewData();
          if (REVIEW_CONFIG.debugMode) return true;
          if (data.hasReviewed && data.lastReviewDate) {
            var days = Math.floor((Date.now() - data.lastReviewDate) / (24 * 60 * 60 * 1000));
            if (days < REVIEW_CONFIG.cooldownDays) return false;
          }
          if (data.hasGivenFeedback && data.lastReviewDate) {
            var days2 = Math.floor((Date.now() - data.lastReviewDate) / (24 * 60 * 60 * 1000));
            if (days2 < REVIEW_CONFIG.cooldownDays) return false;
          }
          if (data.projectsCreated < REVIEW_CONFIG.minProjectsCreated) return false;
          if (getDaysUsed(data) < REVIEW_CONFIG.minDaysUsed) return false;
          if (data.sessionCount < REVIEW_CONFIG.minSessions) return false;
          return true;
        }

          var desc = document.createElement('p');
          desc.style.cssText = 'margin:0 0 12px;color:var(--text-secondary);font-size:13px;';
          desc.textContent = t('你的反馈会帮助我们把 Emerge 做得更好。');
          var textarea = document.createElement('textarea');
          textarea.placeholder = t('你觉得哪里可以改进？有什么想法都可以写下来…');
          textarea.style.cssText = 'width:100%;min-height:100px;padding:10px 12px;border:1px solid var(--border-color);border-radius:8px;background:var(--bg-secondary);color:var(--text-primary);font-size:14px;resize:vertical;outline:none;font-family:inherit;box-sizing:border-box;';
          body.appendChild(desc);
          body.appendChild(textarea);
          var actions = document.createElement('div');
          actions.className = 'skeleton-modal-actions';

          function close() { overlay.remove(); }

          var cancelBtn = document.createElement('button');
          cancelBtn.className = 'skeleton-btn';
          cancelBtn.textContent = t('取消');
          cancelBtn.onclick = function(e) { e.stopPropagation(); close(); };

          var submitBtn = document.createElement('button');
          submitBtn.className = 'skeleton-btn primary';
          submitBtn.textContent = '发送反馈';
          submitBtn.onclick = function(e) {
            e.stopPropagation();
            var content = textarea.value.trim();
            if (!content) { alert('请填写反馈内容'); return; }
            submitFeedback(content);
            close();
          };

          actions.appendChild(cancelBtn);
          actions.appendChild(submitBtn);
          modal.appendChild(title);
          modal.appendChild(body);
          modal.appendChild(actions);
          overlay.appendChild(modal);
          document.body.appendChild(overlay);
          setTimeout(function(){ textarea.focus(); }, 100);
          overlay.addEventListener('mousedown', function(e) {
            if (e.target === overlay) close();
          });
        }

        function submitFeedback(content) {
          var data = loadReviewData();
          data.hasGivenFeedback = true;
          data.lastReviewDate = Date.now();
          saveReviewData(data);
          var subject = encodeURIComponent('Emerge 用户反馈');
          var body = encodeURIComponent(content + '\n\n---\n使用天数: ' + getDaysUsed(data) + ' 天\n项目数: ' + data.projectsCreated);
          var mailtoUrl = 'mailto:' + REVIEW_CONFIG.feedbackEmail + '?subject=' + subject + '&body=' + body;
          if (window.__TAURI__ && window.__TAURI__.core) {
            window.__TAURI__.core.invoke('open_url', { url: mailtoUrl }).catch(function(){});
          } else {
            window.location.href = mailtoUrl;
          }
          alert('感谢你的反馈！\n我们会认真阅读每一条建议。');
        }

        function initReviewManager() {
          recordReviewSession();
          setTimeout(maybeShowReviewPrompt, 3000);
        }

        // 暴露到全局
        window.__reviewManager = {
          loadReviewData: loadReviewData,
          saveReviewData: saveReviewData,
          shouldShowReviewPrompt: shouldShowReviewPrompt,
          showReviewPreAsk: showReviewPreAsk,
          showFeedbackForm: showFeedbackForm,
          recordProjectCreated: recordProjectCreated,
          initReviewManager: initReviewManager,
          config: REVIEW_CONFIG,
        };

        // 初始化
        initReviewManager();

      } catch(e) {
        console.warn('[Review] 评分模块初始化失败:', e);
        window.__reviewManager = {
          config: { debugMode: false },
          showReviewPreAsk: function() { alert('评分模块初始化失败: ' + e.message); },
          showFeedbackForm: function() { alert('评分模块初始化失败: ' + e.message); },
        };
      }
    })();

    // 评分调试：连续点击标题 5 次弹出评分预询问
    (function() {
      var titleClickCount = 0;
      var titleClickTimer = null;
      function setupTitleClick() {
        var title = document.getElementById('app-title');
        if (!title) {
          setTimeout(setupTitleClick, 500);
          return;
        }
        title.style.cursor = 'pointer';
        title.addEventListener('click', function() {
          titleClickCount++;
          if (titleClickTimer) clearTimeout(titleClickTimer);
          titleClickTimer = setTimeout(function() {
            titleClickCount = 0;
          }, 2000);
          if (titleClickCount >= 5) {
            titleClickCount = 0;
            try {
              if (window.__reviewManager && window.__reviewManager.showReviewPreAsk) {
                window.__reviewManager.showReviewPreAsk();
              } else {
                alert('评分模块未加载');
              }
            } catch(err) {
              alert('评分触发错误: ' + err.message);
            }
          }
        });
      }
      setupTitleClick();
    })();

    // 评分调试快捷键: Cmd+Shift+R
    document.addEventListener('keydown', function(e) {
      if ((e.metaKey || e.ctrlKey) && e.shiftKey && e.key === 'R') {
        e.preventDefault();
        try {
          if (window.__reviewManager && window.__reviewManager.showReviewPreAsk) {
            window.__reviewManager.showReviewPreAsk();
          } else {
            alert('评分模块未加载');
          }
        } catch(err) {
          alert('评分快捷键错误: ' + err.message);
        }
      }
    });

    // ==================== 匿名使用统计（PostHog） ====================
    // 只收集两类匿名事件：app_open（启动）、daily_usage（每日使用时长）。
    // 匿名 UUID 存本地，不收集任何笔记内容、不上传用户数据。
    const Analytics = (() => {
      const PH_KEY = 'PH_PROJECT_API_KEY'; // TODO: 替换为 PostHog 项目 API Key（public）
      const PH_HOST = 'https://us.i.posthog.com';
      const ID_KEY = 'emerge_analytics_id';
      const INSTALL_KEY = 'emerge_install_date';
      const USAGE_KEY = 'emerge_usage_seconds';
      const FALLBACK_VERSION = '1.1.3';

      let appVersion = FALLBACK_VERSION;
      let usage = null;

      function enabled() {
        return PH_KEY && PH_KEY.indexOf('PH_') !== 0;
      }
      function distinctId() {
        let id = localStorage.getItem(ID_KEY);
        if (!id) {
          id = (window.crypto && crypto.randomUUID)
            ? crypto.randomUUID()
            : 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
          localStorage.setItem(ID_KEY, id);
        }
        return id;
      }
      function installDate() {
        let d = localStorage.getItem(INSTALL_KEY);
        if (!d) {
          d = toDateKey(new Date());
          localStorage.setItem(INSTALL_KEY, d);
        }
        return d;
      }
      function daysSince(dateKey) {
        return Math.max(0, Math.round(
          (new Date(toDateKey(new Date()) + 'T00:00:00') - new Date(dateKey + 'T00:00:00')) / 86400000
        ));
      }
      function baseProps() {
        return {
          platform: 'macos',
          version: appVersion,
          days_since_install: daysSince(installDate())
        };
      }
      // 发送事件；onSuccess 可选（用于确认后清理本地数据）
      function capture(event, props, onSuccess) {
        if (!enabled()) { if (onSuccess) onSuccess(); return; }
        fetch(PH_HOST + '/capture/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            api_key: PH_KEY,
            event: event,
            distinct_id: distinctId(),
            properties: Object.assign(baseProps(), props || {})
          }),
          keepalive: true
        }).then(() => { if (onSuccess) onSuccess(); })
          .catch(() => { /* 离线静默失败，数据保留下次再发 */ });
      }
      // 关闭时用 sendBeacon 兜底发送
      function captureBeacon(event, props) {
        if (!enabled() || !navigator.sendBeacon) return;
        try {
          navigator.sendBeacon(
            PH_HOST + '/capture/',
            new Blob([JSON.stringify({
              api_key: PH_KEY,
              event: event,
              distinct_id: distinctId(),
              properties: Object.assign(baseProps(), props || {})
            })], { type: 'application/json' })
          );
        } catch (e) {}
      }

      function loadUsage() {
        try { return JSON.parse(localStorage.getItem(USAGE_KEY)) || {}; } catch (e) { return {}; }
      }
      function saveUsage() {
        localStorage.setItem(USAGE_KEY, JSON.stringify(usage));
      }
      // 每分钟心跳：窗口可见时累计当日使用时长
      function tick() {
        if (document.visibilityState !== 'visible') return;
        const key = toDateKey(new Date());
        usage[key] = (usage[key] || 0) + 60;
        saveUsage();
      }
      // 启动时补发「今天之前」每天的完整时长，确认发送成功后清除
      function flushPastDays() {
        const today = toDateKey(new Date());
        Object.keys(usage).sort().forEach(day => {
          if (day >= today) return;
          const seconds = usage[day];
          if (!(seconds > 0)) { delete usage[day]; saveUsage(); return; }
          capture('daily_usage', { date: day, seconds: seconds }, () => {
            delete usage[day];
            saveUsage();
          });
        });
      }
      // 关闭/隐藏时发送当天部分时长（仅供参考，分析以 daily_usage 次日结算为准）
      function flushOnLeave() {
        const today = toDateKey(new Date());
        const seconds = usage[today] || 0;
        if (seconds > 0) {
          captureBeacon('app_close', { today_seconds: seconds });
        }
      }

      function detectVersion() {
        try {
          if (window.__TAURI__ && window.__TAURI__.app && window.__TAURI__.app.getVersion) {
            window.__TAURI__.app.getVersion().then(v => { if (v) appVersion = v; }).catch(() => {});
          }
        } catch (e) {}
      }

      function init() {
        if (!enabled()) return; // 未配置 Key 时完全静默，零开销
        usage = loadUsage();
        installDate();
        detectVersion();
        capture('app_open', {});
        flushPastDays();
        setInterval(tick, 60000);
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'hidden') flushOnLeave();
        });
        window.addEventListener('beforeunload', flushOnLeave);
      }

      return { init };
    })();
    Analytics.init();
  </script>
</body>
</html>
