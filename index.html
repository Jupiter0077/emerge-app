          li.appendChild(topResizeHandle);

          li.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            e.stopPropagation();
            showNoteContextMenu(todo.id, e.clientX, e.clientY);
          });

          li.addEventListener('mousedown', (e) => {
            if (e.button !== 0) return;
            if (e.target.closest('.week-time-cell-checkbox') ||
                e.target.closest('.week-time-cell-resize-handle')) return;
            const grid = dayCol.closest('.week-time-grid');
            const allDayCols = grid
              ? Array.from(grid.querySelectorAll('.week-time-col.day-col'))
              : [dayCol];
            let _wd = new Date(); if (selectedDate) { const [_y,_m,_d] = selectedDate.split('-').map(Number); _wd = new Date(_y, _m - 1, _d); }
            const wDates = getWeekDates(_wd);
            const allHours = [...awakeHours, ...sleepHours];
            const columns = allDayCols.map((col, idx) => {
              const r = col.getBoundingClientRect();
              return { element: col, rect: r, dateKey: wDates[idx] };
            });
            startCalendarTodoDrag(e, li, todo, columns, allHours, dateKey);
          });

          sleepTodosLayer.appendChild(li);
        });

        daySleepBodyInner.appendChild(sleepTodosLayer);
        daySleepBody.appendChild(daySleepBodyInner);
        daySleepSection.appendChild(daySleepBody);
        dayCol.appendChild(daySleepSection);

        bodyRow.appendChild(dayCol);
      });

      // 当前时间指示线 — 药丸挂在红线左侧，位置和日视图一致
      const now = new Date();
      const currentHour = now.getHours();
      const currentMinute = now.getMinutes();
      const hourIndex = awakeHours.indexOf(currentHour);
      if (hourIndex !== -1) {
        const top = hourIndex * 44 + (currentMinute / 60) * 44;

        // 红线放在 bodyRow 层级，从 timeCol 右边缘横跨所有日期列
        const indicator = document.createElement('div');
        indicator.className = 'week-now-indicator';

        const pill = document.createElement('span');
        pill.className = 'week-now-indicator-time';
        pill.textContent = pad(currentHour) + ':' + pad(currentMinute);
        indicator.appendChild(pill);

        bodyRow.appendChild(indicator);
      }

      grid.appendChild(bodyRow);
      weekView.appendChild(grid);
      weekPanelContent.appendChild(weekView);

    function isMonthViewCompact() {
      const panelWidth = weekPanelEl.offsetWidth;
      return panelWidth < 320;
    }

    function renderMonthView(todos, todayKey, weekdays) {
      // 月视图以记录已完成事项为主：不显示未完成重复提醒的预排实例
      todos = todos.filter(t => !t.recurrenceInstance);
      const weekPanelContent = document.getElementById('week-panel-content');
      const year = currentMonthDate.getFullYear();
      const month = currentMonthDate.getMonth();
      const monthDates = getMonthDates(year, month);
      const compact = isMonthViewCompact();

      const monthView = document.createElement('div');
      monthView.className = 'month-view' + (compact ? ' compact' : '');

      const header = document.createElement('div');
      header.className = 'month-header';

      const prevBtn = document.createElement('button');
      prevBtn.className = 'month-nav-btn';
      prevBtn.textContent = '‹';
      prevBtn.addEventListener('click', () => {
        currentMonthDate = new Date(year, month - 1, 1);
        renderWeekView();
      });

      const title = document.createElement('span');
      title.className = 'month-title';
      title.textContent = year + '年' + (month + 1) + '月';

      const nextBtn = document.createElement('button');
      nextBtn.className = 'month-nav-btn';
      nextBtn.textContent = '›';
      nextBtn.addEventListener('click', () => {
        currentMonthDate = new Date(year, month + 1, 1);
        renderWeekView();
      });

      header.appendChild(prevBtn);
      header.appendChild(title);
      header.appendChild(nextBtn);
      monthView.appendChild(header);

      const grid = document.createElement('div');
      grid.className = 'month-grid';

      const moods = loadMoods(); // 预加载一次，供月视图循环使用

      const weekHeaders = ['一', '二', '三', '四', '五', '六', '日'];
      weekHeaders.forEach(w => {
        const wd = document.createElement('div');
        wd.className = 'month-weekday';
        wd.textContent = w;
        grid.appendChild(wd);
      });

      monthDates.forEach(dateKey => {
        const [y, m, d] = dateKey.split('-').map(Number);
        const dayEl = document.createElement('div');
        dayEl.className = 'month-day';
        dayEl.dataset.dateKey = dateKey;

        if (m - 1 !== month) dayEl.classList.add('other-month');
        if (dateKey === todayKey) dayEl.classList.add('is-today');
        if (dateKey === selectedDate) dayEl.classList.add('selected');

        const dayTodos = todos.filter(t => t.scheduledDate === dateKey);
        if (dayTodos.length > 0) dayEl.classList.add('has-todos');

        const dayNum = document.createElement('span');
        dayNum.className = 'month-day-num';
        dayNum.textContent = d;
        dayEl.appendChild(dayNum);

        // 心境标记（使用预加载的 moods，避免循环内重复读取 localStorage）
        const dayMood = moods[dateKey];
        if (dayMood) {
          const moodIndicator = document.createElement('span');
          moodIndicator.className = 'mood-indicator';
          moodIndicator.textContent = dayMood.emoji;
          moodIndicator.title = dayMood.label + (dayMood.text ? '：' + dayMood.text : '');
          dayEl.appendChild(moodIndicator);
        }

        if (!compact && dayTodos.length > 0) {
          const todosList = document.createElement('ul');
          todosList.className = 'month-day-todos';

          const sortedDayTodos = [...dayTodos].sort((a, b) => {
            const aHasTime = a.scheduledTime ? 1 : 0;
            const bHasTime = b.scheduledTime ? 1 : 0;
            if (aHasTime !== bHasTime) return aHasTime - bHasTime;
            if (a.scheduledTime && b.scheduledTime) {
              if (a.scheduledTime !== b.scheduledTime) return a.scheduledTime < b.scheduledTime ? -1 : 1;
            }
            const aOrder = a.order != null ? a.order : (a.timestamp || 0);
            const bOrder = b.order != null ? b.order : (b.timestamp || 0);
            return aOrder - bOrder;
          });

          sortedDayTodos.slice(0, 3).forEach(todo => {
            const li = document.createElement('li');
            li.className = 'month-day-todo';
            li.draggable = true;
            li.dataset.noteId = todo.id;
            if (todo.completed) li.classList.add('completed');
            if (todo.inProgress && !todo.completed) li.classList.add('in-progress');
            attachCalTooltip(li, todo);

            const projectColor = getProjectColor(todo.projectId);
            li.style.borderLeftColor = projectColor;
            li.style.backgroundColor = projectColor + '99';
            li.style.setProperty('--todo-accent-color', projectColor);

            const checkbox = document.createElement('div');
            checkbox.className = 'month-day-checkbox';
            checkbox.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
            if (!todo.inProgress || todo.completed) if (!todo.inProgress || todo.completed) checkbox.style.backgroundColor = projectColor;
            checkbox.addEventListener('mousedown', (e) => {
              e.stopPropagation();
            });
            checkbox.addEventListener('click', (e) => {
              e.stopPropagation();
              toggleTodoComplete(todo.id, e.clientX, e.clientY);
            });

            const text = document.createElement('span');
            text.className = 'month-day-todo-text';
            text.textContent = todo.text.length > 8 ? todo.text.slice(0, 8) + '...' : todo.text;

            li.appendChild(checkbox);
            li.appendChild(text);

            li.addEventListener('dragstart', (e) => {
              e.dataTransfer.setData('text/x-note-id', String(todo.id));
              e.dataTransfer.setData('text/plain', String(todo.id));
              li.classList.add('dragging');
            });
            li.addEventListener('dragend', () => {
              li.classList.remove('dragging');
            });

            li.addEventListener('contextmenu', (e) => {
              e.preventDefault();
              e.stopPropagation();
              showNoteContextMenu(todo.id, e.clientX, e.clientY);
            });

            todosList.appendChild(li);
          });

          if (dayTodos.length > 3) {
            const more = document.createElement('li');
            more.className = 'month-day-todo more';
            more.textContent = '+' + (dayTodos.length - 3);
            todosList.appendChild(more);
          }

          dayEl.appendChild(todosList);
        }

        dayEl.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          e.stopPropagation();
          showCalendarContextMenu(dateKey, e.clientX, e.clientY);
        });

        dayEl.addEventListener('click', () => {
          selectedDate = dateKey;
          currentView = 'day';
          renderWeekView();
        });

        dayEl.addEventListener('dragover', (e) => {
          e.preventDefault();
          dayEl.classList.add('drag-over');
        });

        dayEl.addEventListener('dragleave', () => {
          dayEl.classList.remove('drag-over');
        });

        dayEl.addEventListener('drop', (e) => {
          e.preventDefault();
          dayEl.classList.remove('drag-over');
          const noteId = e.dataTransfer.getData('text/x-note-id') || e.dataTransfer.getData('text/plain');
          if (noteId) {
            const notes = loadNotes();
            const note = notes.find(n => String(n.id) === String(noteId));
            if (note) {
              note.scheduledDate = dateKey;
              if (!note.scheduledTime) note.scheduledTime = '09:00';
              // 如果来自时间骨架或打卡，安排后自动移除
              if (note.projectId === ANCHOR_ID || note.projectId === CHECKIN_ID) {
                note.projectId = null;
              }
              saveNotes(notes);
              render();
            }
          }
        });

        grid.appendChild(dayEl);
      });

      monthView.appendChild(grid);
      weekPanelContent.appendChild(monthView);
    }

    // 时间骨架编辑器渲染函数
    // 模板说明区：与当前模板关联，显示在时间表下方（备忘录式编辑）
    function buildTemplateDescription(template) {
      const section = document.createElement('div');
      section.className = 'skeleton-desc-section';
      const titleEl = document.createElement('div');
      titleEl.className = 'skeleton-desc-title';
      titleEl.textContent = template.name || t('模板');
      section.appendChild(titleEl);

      const bodyEl = document.createElement('div');
      bodyEl.className = 'skeleton-desc-body';
      const desc = (template.description || '').trim();
      if (desc) {
        bodyEl.textContent = desc;
        bodyEl.title = t('双击编辑');
        bodyEl.addEventListener('dblclick', () => startEditTemplateDescription(template, bodyEl));
      } else {
        bodyEl.classList.add('empty');
        bodyEl.textContent = t('写这个模板的具体描述与实施细节…');
        bodyEl.addEventListener('click', () => startEditTemplateDescription(template, bodyEl));
      }
      section.appendChild(bodyEl);
      return section;
    }

    function startEditTemplateDescription(template, bodyEl) {
      const ta = document.createElement('textarea');
      ta.className = 'skeleton-desc-edit';
      ta.value = template.description || '';
      ta.rows = Math.max(3, ta.value.split('\n').length);
      bodyEl.replaceWith(ta);
      ta.focus();
      ta.setSelectionRange(ta.value.length, ta.value.length);
      ta.addEventListener('input', () => {
        ta.rows = Math.max(3, ta.value.split('\n').length);
      });
      let done = false;
      const finish = (save) => {
        if (done) return;
        done = true;
        if (save) {
          const target = skeletonTemplates.find(x => x.id === currentSkeletonTemplate);
          if (target) {
            const v = ta.value.trim();
            if (v) target.description = v;
            else delete target.description;
            saveSkeletonTemplates(skeletonTemplates);
          }
        }
        refreshTemplateDescription();
      };
      ta.addEventListener('keydown', (e) => {
        e.stopPropagation();
        if (e.key === 'Escape') { e.preventDefault(); finish(false); }
        else if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); finish(true); }
      });
      ta.addEventListener('blur', () => finish(true));
    }

    function refreshTemplateDescription() {
      const old = document.querySelector('.skeleton-desc-section');
      if (!old) return;
      const template = skeletonTemplates.find(x => x.id === currentSkeletonTemplate);
      if (template) old.replaceWith(buildTemplateDescription(template));
      else old.remove();
    }

      templateSelect.appendChild(addTemplateBtn);

      const deleteTemplateBtn = document.createElement('button');
      deleteTemplateBtn.className = 'skeleton-btn';
      deleteTemplateBtn.textContent = t('删除模板');
      if (currentSkeletonTemplate === 'workday') {
        deleteTemplateBtn.style.opacity = '0.5';
        deleteTemplateBtn.style.cursor = 'not-allowed';
      } else {
        deleteTemplateBtn.addEventListener('click', () => {
          skeletonTemplates = skeletonTemplates.filter(t => t.id !== currentSkeletonTemplate);
          saveSkeletonTemplates(skeletonTemplates);
          currentSkeletonTemplate = 'workday';
          rememberUndoSnapshot();
          localStorage.setItem(SKELETON_TEMPLATE_KEY, currentSkeletonTemplate);
          renderSkeletonEditor();
          renderWeekView(true);
        });
      }
      templateSelect.appendChild(deleteTemplateBtn);

      header.appendChild(title);
      header.appendChild(templateSelect);
      editor.appendChild(header);

      // 分类栏（简化为分类预览 + 管理按钮）
      const categoryBar = document.createElement('div');
      categoryBar.className = 'skeleton-category-bar';
      skeletonCategories.forEach(cat => {
        const chip = document.createElement('div');
        chip.className = 'skeleton-category-chip';
        chip.style.cursor = 'default';
        const dot = document.createElement('span');
        dot.className = 'skeleton-category-dot';
        dot.style.background = cat.color;
        chip.appendChild(dot);
        const name = document.createElement('span');
        name.textContent = cat.name;
        chip.appendChild(name);
        categoryBar.appendChild(chip);
      });
      const manageCatBtn = document.createElement('div');
      manageCatBtn.className = 'skeleton-category-add';
      manageCatBtn.textContent = '⚙';
      manageCatBtn.title = t('分类管理');
      manageCatBtn.style.fontSize = '12px';
      manageCatBtn.addEventListener('click', () => {
        showSkeletonCategoryListModal();
      });
      categoryBar.appendChild(manageCatBtn);
      editor.appendChild(categoryBar);

      // 周网格
      const grid = document.createElement('div');
      grid.className = 'skeleton-week-grid';

      // 时间列（左侧）
      const timeCol = document.createElement('div');
      timeCol.className = 'skeleton-time-col';

      // 标题行占位
      const headerSpacer = document.createElement('div');
      headerSpacer.style.height = '40px';
      headerSpacer.style.borderBottom = '1px solid var(--skeleton-header-border, #f0f0f0)';
      timeCol.appendChild(headerSpacer);

      // 每小时一行，时间标签绝对定位在行顶部
      for (let hour = 7; hour < 22; hour++) {
        const row = document.createElement('div');
        row.className = 'skeleton-hour-row';

        const label = document.createElement('div');
        label.className = 'skeleton-time-label';
        label.textContent = pad(hour) + ':00';
        row.appendChild(label);

        timeCol.appendChild(row);
      }
      grid.appendChild(timeCol);

      // 每天一列
      const currentTemplate = skeletonTemplates.find(t => t.id === currentSkeletonTemplate);
      for (let day = 1; day <= 7; day++) {
        const dayCol = document.createElement('div');
        dayCol.className = 'skeleton-day-col';

        // 标题
        const dayHeader = document.createElement('div');
        dayHeader.className = 'skeleton-day-header';
        if (day >= 6) dayHeader.classList.add('weekend');
        dayHeader.textContent = SKELETON_WEEKDAYS[day - 1];
        dayCol.appendChild(dayHeader);

        // 每小时一行，每行含两个半小时槽
        for (let hour = 7; hour < 22; hour++) {
          const row = document.createElement('div');
          row.className = 'skeleton-hour-row';

          for (let half = 0; half < 2; half++) {
            const slot = document.createElement('div');
            slot.className = 'skeleton-slot';
            slot.dataset.day = day;
            slot.dataset.hour = hour;
            slot.dataset.half = half;

            const addBtn = document.createElement('div');
            addBtn.className = 'skeleton-add-btn';
            addBtn.textContent = '+';
            slot.appendChild(addBtn);

            row.appendChild(slot);
          }

          dayCol.appendChild(row);
        }

        // 渲染已有时间块
        const dayBlocks = (currentTemplate ? currentTemplate.blocks : []).filter(b => b.day === day || (b.days && b.days.includes(day)));
        dayBlocks.forEach(block => {
          renderSkeletonBlock(block, dayCol, day);
        });

        grid.appendChild(dayCol);
      }

      // 事件委托：点击添加按钮
      grid.addEventListener('click', (e) => {
        const addBtn = e.target.closest('.skeleton-add-btn');
        if (!addBtn) return;
        e.stopPropagation();
        const slot = addBtn.closest('.skeleton-slot');
        if (!slot) return;
        showAddBlockModal(
          parseInt(slot.dataset.day, 10),
          parseInt(slot.dataset.hour, 10),
          parseInt(slot.dataset.half, 10)
        );
      });

      editor.appendChild(grid);

      // 时间表下方的模板说明（与当前模板关联）
      if (currentTemplate) editor.appendChild(buildTemplateDescription(currentTemplate));

      container.appendChild(editor);
    }

    function renderSkeletonBlock(block, dayCol, day) {
      const blockEl = document.createElement('div');
      blockEl.className = 'skeleton-block';
      blockEl.dataset.blockId = block.id;

      const startHour = parseInt(block.startTime.split(':')[0], 10);
      const startHalf = parseInt(block.startTime.split(':')[1], 10) >= 30 ? 1 : 0;
      const endHour = parseInt(block.endTime.split(':')[0], 10);
      const endHalf = parseInt(block.endTime.split(':')[1], 10) >= 30 ? 1 : 0;

      // 计算位置和高度（标题行40px，每小时44px，半小时22px）
      const startSlotIndex = (startHour - 7) * 2 + startHalf; // 半小时槽索引（不含标题行）
      const endSlotIndex = (endHour - 7) * 2 + endHalf;
      const top = 40 + startSlotIndex * 22; // 40px标题行 + 每半小时22px
      const height = (endSlotIndex - startSlotIndex) * 22;

      blockEl.style.top = top + 'px';
      blockEl.style.height = height + 'px';

      // 分类颜色条
      if (block.categoryId) {
        const cat = getSkeletonCategoryById(block.categoryId);
        if (cat) {
          const catBar = document.createElement('div');
          catBar.className = 'skeleton-block-category-bar';
          catBar.style.background = cat.color;
          blockEl.appendChild(catBar);
          blockEl.style.setProperty('--skeleton-cat-color', cat.color);
        }
      }

      const titleEl = document.createElement('div');
      titleEl.className = 'skeleton-block-title';
      titleEl.textContent = block.title;
      blockEl.appendChild(titleEl);

      const timeEl = document.createElement('div');
      timeEl.className = 'skeleton-block-time';
      timeEl.textContent = `${block.startTime} - ${block.endTime}`;
      blockEl.appendChild(timeEl);

      const deleteBtn = document.createElement('div');
      deleteBtn.className = 'skeleton-block-delete';
      deleteBtn.textContent = '×';
      deleteBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        showDeleteBlockModal(block.id);
      });
      blockEl.appendChild(deleteBtn);

      // 备注：小标记提示有备注，悬浮在 tooltip 中显示完整内容
      if (block.remark) {
        const flag = document.createElement('div');
        flag.className = 'skeleton-block-remark-flag';
        flag.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>';
        blockEl.appendChild(flag);
      }

      // 右键菜单 — 编辑/删除
      blockEl.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        e.stopPropagation();
        showSkeletonBlockContextMenu(block, e.clientX, e.clientY);
      });

      // 单击（未拖动）— 打开编辑弹窗
      blockEl.addEventListener('click', (e) => {
        if (e.target === deleteBtn || e.target.closest('.skeleton-block-resize-handle')) return;
        if (Date.now() - skeletonLastDragEnd < 250) return; // 拖动刚结束的click不触发
        e.stopPropagation();
        const dayVal = block.day || (block.days ? block.days[0] : day);
        const h = parseInt(block.startTime.split(':')[0], 10);
        const m = parseInt(block.startTime.split(':')[1], 10);
        showAddBlockModal(dayVal, h, m >= 30 ? 1 : 0, block);
      });

      // 底部 resize 手柄 — 调整时长
      const resizeHandle = document.createElement('div');
      resizeHandle.className = 'skeleton-block-resize-handle';
      resizeHandle.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        e.stopPropagation();
        e.preventDefault();
        skeletonDraggingBlock = blockEl;
        skeletonDragMode = 'resize';
        skeletonDragStartY = e.clientY;
        skeletonDragStartBlock = block;
        blockEl.classList.add('dragging');
        document.body.style.cursor = 'ns-resize';
        document.body.style.userSelect = 'none';
      });
      blockEl.appendChild(resizeHandle);

      // 拖拽移动位置 — mousedown仅记录起点，4px阈值后才创建ghost
      blockEl.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        if (e.target === deleteBtn || e.target === resizeHandle) return;
        e.preventDefault();
        const grid = dayCol.closest('.skeleton-week-grid');
        skeletonGridRect = grid ? grid.getBoundingClientRect() : null;
        skeletonDayRects = grid
          ? Array.from(grid.querySelectorAll('.skeleton-day-col')).map(el => el.getBoundingClientRect())
          : [];
        skeletonDraggingBlock = blockEl;
        skeletonDragMode = 'move';
        skeletonDragStartX = e.clientX;
        skeletonDragStartY = e.clientY;
        skeletonDragStartBlock = block;
        skeletonDragStarted = false;
        const startH = parseInt(block.startTime.split(':')[0], 10);
        const startM = parseInt(block.startTime.split(':')[1], 10);
        const endH = parseInt(block.endTime.split(':')[0], 10);
        const endM = parseInt(block.endTime.split(':')[1], 10);
        skeletonDragOrigStartTime = block.startTime;
        skeletonDragOrigEndTime = block.endTime;
        skeletonDragDuration = (endH * 60 + endM) - (startH * 60 + startM);
        skeletonDragOrigDay = block.day || (block.days ? block.days[0] : 1);
        const rect = blockEl.getBoundingClientRect();
        skeletonDragOffsetY = e.clientY - rect.top;
        skeletonDragOffsetX = e.clientX - rect.left;
      });

      // 悬停显示完整标题+时间段
      blockEl.addEventListener('mouseenter', (e) => {
        showSkeletonBlockTooltip(block, blockEl);
      });
      blockEl.addEventListener('mouseleave', () => {
        hideSkeletonBlockTooltip();
      });

      dayCol.appendChild(blockEl);
    }

    let skeletonTooltipEl = null;

    function showSkeletonBlockTooltip(block, blockEl) {
      hideSkeletonBlockTooltip();
      const tooltip = document.createElement('div');
      tooltip.className = 'skeleton-block-tooltip';

      const titleDiv = document.createElement('div');
      titleDiv.className = 'skeleton-block-tooltip-title';
      titleDiv.textContent = block.title;
      tooltip.appendChild(titleDiv);

      const timeDiv = document.createElement('div');
      timeDiv.className = 'skeleton-block-tooltip-time';
      timeDiv.textContent = block.startTime + ' - ' + block.endTime;
      tooltip.appendChild(timeDiv);

      if (block.remark) {
        const remarkDiv = document.createElement('div');
        remarkDiv.className = 'skeleton-block-tooltip-remark';
        remarkDiv.textContent = block.remark;
        tooltip.appendChild(remarkDiv);
      }

      document.body.appendChild(tooltip);

      const rect = blockEl.getBoundingClientRect();
      const tooltipRect = tooltip.getBoundingClientRect();
      let left = rect.right + 8;
      let top = rect.top;
      if (left + tooltipRect.width > window.innerWidth) {
        left = rect.left - tooltipRect.width - 8;
      }
      if (top + tooltipRect.height > window.innerHeight) {
        top = window.innerHeight - tooltipRect.height - 8;
      }
      tooltip.style.left = left + 'px';
      tooltip.style.top = top + 'px';

      skeletonTooltipEl = tooltip;
    }

    function hideSkeletonBlockTooltip() {
      if (skeletonTooltipEl) {
        skeletonTooltipEl.remove();
        skeletonTooltipEl = null;
      }
    }

    function showAddBlockModal(day, hour, half, existingBlock) {
      const overlay = document.createElement('div');
      overlay.className = 'skeleton-modal-overlay';

      const isEdit = !!existingBlock;

      const startH = isEdit ? parseInt(existingBlock.startTime.split(':')[0], 10) : hour;
      const startM = isEdit ? parseInt(existingBlock.startTime.split(':')[1], 10) : (half === 0 ? 0 : 30);
      const endH = isEdit ? parseInt(existingBlock.endTime.split(':')[0], 10) : hour + 1;
      const endM = isEdit ? parseInt(existingBlock.endTime.split(':')[1], 10) : 0;

      const selectedDays = isEdit ? (existingBlock.days || [existingBlock.day]) : [day];

      const dayCheckboxes = SKELETON_WEEKDAYS.map((name, idx) => {
        const d = idx + 1;
        const checked = selectedDays.includes(d) ? 'checked' : '';
        return `<div class="skeleton-modal-day-checkbox ${checked}" data-day="${d}">${name}</div>`;
      }).join('');

      const modal = document.createElement('div');
      modal.className = 'skeleton-modal';
      modal.innerHTML = `
        <div class="skeleton-modal-title">${isEdit ? t('编辑时间块') : t('添加时间块')}</div>
        <div class="skeleton-modal-row">
          <label class="skeleton-modal-label">${t('事项名称')}</label>
          <input type="text" class="skeleton-modal-input" id="block-title-input" placeholder="${t('例如：晨间冥想')}" value="${isEdit ? existingBlock.title : ''}">
        </div>
        <div class="skeleton-modal-row">
          <label class="skeleton-modal-label">${t('开始时间')}</label>
          <div class="skeleton-modal-time-row">
            <select id="block-start-hour">${generateHourOptions(startH)}</select>
            <select id="block-start-minute">${generateMinuteOptions(startM)}</select>
          </div>
        </div>
        <div class="skeleton-modal-row">
          <label class="skeleton-modal-label">${t('结束时间')}</label>
          <div class="skeleton-modal-time-row">
            <select id="block-end-hour">${generateHourOptions(endH)}</select>
            <select id="block-end-minute">${generateMinuteOptions(endM)}</select>
          </div>
        </div>
        <div class="skeleton-modal-row">
          <label class="skeleton-modal-label">${t('重复天数')}</label>
          <div class="skeleton-modal-day-selector" id="day-selector">${dayCheckboxes}</div>
          <div class="skeleton-modal-day-quick">
            <button type="button" data-quick="workday">${t('工作日')}</button>
            <button type="button" data-quick="weekend">${t('周末')}</button>
            <button type="button" data-quick="all">${t('每天')}</button>
          </div>
        </div>
        <div class="skeleton-modal-row">
          <label class="skeleton-modal-label">${t('分类')}</label>
          <div class="skeleton-modal-category-selector" id="cat-selector">
            ${skeletonCategories.map(c =>
              `<div class="skeleton-modal-category-option" data-cat-id="${c.id}"><span class="skeleton-category-dot" style="background:${c.color}"></span>${c.name}</div>`
            ).join('')}
          </div>
        </div>
        <div class="skeleton-modal-row">
          <label class="skeleton-modal-label">${t('生效日期')}</label>
          <div class="skeleton-modal-date-range-selector" id="date-range-selector">
            <div class="skeleton-modal-date-option ${isEdit && !existingBlock.startDate ? 'selected' : (!isEdit ? 'selected' : '')}" data-range="always">${t('始终应用')}</div>
            <div class="skeleton-modal-date-option ${isEdit && existingBlock.startDate === toDateKey(new Date()) ? 'selected' : ''}" data-range="today">${t('从今天开始')}</div>
            <div class="skeleton-modal-date-option ${isEdit && existingBlock.startDate && existingBlock.startDate !== toDateKey(new Date()) ? 'selected' : ''}" data-range="custom">${t('选择日期')}</div>
          </div>
          <div id="block-date-inputs" style="display:${(isEdit && existingBlock.startDate && existingBlock.startDate !== toDateKey(new Date())) ? 'block' : 'none'};margin-top:8px;gap:8px;">
            <input type="date" class="skeleton-modal-input skeleton-modal-date-input" id="block-start-date" value="${isEdit && existingBlock.startDate ? existingBlock.startDate : toDateKey(new Date())}">
            <input type="date" class="skeleton-modal-input skeleton-modal-date-input" id="block-end-date" placeholder="${t('结束日期（可选）')}" value="${isEdit && existingBlock.endDate ? existingBlock.endDate : ''}">
          </div>
          <div id="block-end-date-only" style="display:${(isEdit && existingBlock.startDate === toDateKey(new Date())) ? 'block' : 'none'};margin-top:8px;">
            <input type="date" class="skeleton-modal-input skeleton-modal-date-input" id="block-end-date-today" placeholder="${t('结束日期（可选）')}" value="${isEdit && existingBlock.endDate ? existingBlock.endDate : ''}">
          </div>
        </div>
        <div class="skeleton-modal-actions">
          <button class="skeleton-btn" id="block-cancel-btn">${t('取消')}</button>
          <button class="skeleton-btn primary" id="block-save-btn">${isEdit ? t('保存') : t('添加')}</button>
        </div>
      `;

      overlay.appendChild(modal);
      document.body.appendChild(overlay);

      const daySelector = modal.querySelector('#day-selector');
      daySelector.querySelectorAll('.skeleton-modal-day-checkbox').forEach(cb => {
        cb.addEventListener('click', () => {
          cb.classList.toggle('checked');
        });
      });

      modal.querySelectorAll('.skeleton-modal-day-quick button').forEach(btn => {
        btn.addEventListener('click', () => {
          const quick = btn.dataset.quick;
          let days = [];
          if (quick === 'workday') days = [1,2,3,4,5];
          else if (quick === 'weekend') days = [6,7];
          else if (quick === 'all') days = [1,2,3,4,5,6,7];
          daySelector.querySelectorAll('.skeleton-modal-day-checkbox').forEach(cb => {
            const d = parseInt(cb.dataset.day, 10);
            if (days.includes(d)) cb.classList.add('checked');
            else cb.classList.remove('checked');
          });
        });
      });

      let selectedCategoryId = isEdit ? (existingBlock.categoryId || (skeletonCategories.length > 0 ? skeletonCategories[0].id : null)) : (skeletonCategories.length > 0 ? skeletonCategories[0].id : null);
      const catSelector = modal.querySelector('#cat-selector');
      if (catSelector && skeletonCategories.length > 0) {
        if (isEdit && existingBlock.categoryId) {
          catSelector.querySelectorAll('.skeleton-modal-category-option').forEach(opt => {
            if (opt.dataset.catId === existingBlock.categoryId) opt.classList.add('selected');
          });
        } else {
          catSelector.children[0].classList.add('selected');
        }
        catSelector.querySelectorAll('.skeleton-modal-category-option').forEach(opt => {
          opt.addEventListener('click', () => {
            catSelector.querySelectorAll('.skeleton-modal-category-option').forEach(o => o.classList.remove('selected'));
            opt.classList.add('selected');
            selectedCategoryId = opt.dataset.catId;
          });
        });
      }

      let selectedDateRange = 'always';
      if (isEdit && existingBlock.startDate) {
        if (existingBlock.startDate === toDateKey(new Date())) selectedDateRange = 'today';
        else selectedDateRange = 'custom';
      }
      const dateRangeSelector = modal.querySelector('#date-range-selector');
      const dateInputsContainer = modal.querySelector('#block-date-inputs');
      const endDateOnlyContainer = modal.querySelector('#block-end-date-only');
      dateRangeSelector.querySelectorAll('.skeleton-modal-date-option').forEach(opt => {
        opt.addEventListener('click', () => {
          dateRangeSelector.querySelectorAll('.skeleton-modal-date-option').forEach(o => o.classList.remove('selected'));
          opt.classList.add('selected');
          selectedDateRange = opt.dataset.range;
          dateInputsContainer.style.display = selectedDateRange === 'custom' ? 'block' : 'none';
          endDateOnlyContainer.style.display = selectedDateRange === 'today' ? 'block' : 'none';
        });
      });

      modal.querySelector('#block-cancel-btn').addEventListener('click', () => {
        overlay.remove();
      });

      modal.querySelector('#block-save-btn').addEventListener('click', () => {
        const titleInput = modal.querySelector('#block-title-input');
        const title = titleInput.value.trim();
        if (!title) {
          titleInput.focus();
          return;
        }

        const sH = modal.querySelector('#block-start-hour').value;
        const sM = modal.querySelector('#block-start-minute').value;
        const eH = modal.querySelector('#block-end-hour').value;
        const eM = modal.querySelector('#block-end-minute').value;

        const checkedDays = Array.from(daySelector.querySelectorAll('.skeleton-modal-day-checkbox.checked'))
          .map(cb => parseInt(cb.dataset.day, 10))
          .sort((a, b) => a - b);

        if (checkedDays.length === 0) {
          daySelector.style.outline = '2px solid #e85d75';
          setTimeout(() => daySelector.style.outline = '', 1000);
          return;
        }

        const blockData = {
          title: title,
          startTime: pad(parseInt(sH, 10)) + ':' + pad(parseInt(sM, 10)),
          endTime: pad(parseInt(eH, 10)) + ':' + pad(parseInt(eM, 10)),
          categoryId: selectedCategoryId
        };

        // 备注改由右键菜单单独编辑，此处保留已有备注
        if (isEdit && existingBlock.remark) blockData.remark = existingBlock.remark;

        if (selectedDateRange === 'today') {
          blockData.startDate = toDateKey(new Date());
          const endDateInput = modal.querySelector('#block-end-date-today');
          if (endDateInput && endDateInput.value) blockData.endDate = endDateInput.value;
        } else if (selectedDateRange === 'custom') {
          const startDateInput = modal.querySelector('#block-start-date');
          const endDateInput = modal.querySelector('#block-end-date');
          if (startDateInput.value) blockData.startDate = startDateInput.value;
          if (endDateInput && endDateInput.value) blockData.endDate = endDateInput.value;
        }

        if (checkedDays.length === 1) {
          blockData.day = checkedDays[0];
        } else {
          blockData.days = checkedDays;
        }

        const template = skeletonTemplates.find(t => t.id === currentSkeletonTemplate);
        if (template) {
          if (isEdit) {
            const idx = template.blocks.findIndex(b => b.id === existingBlock.id);
            if (idx !== -1) {
              blockData.id = existingBlock.id;
              template.blocks[idx] = blockData;
            }
          } else {
            blockData.id = generateId();
            template.blocks.push(blockData);
          }
          saveSkeletonTemplates(skeletonTemplates);
        }

        overlay.remove();
        renderSkeletonEditor();
        renderWeekView(true);
      });

      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) overlay.remove();
      });

      modal.querySelector('#block-title-input').focus();
    }

    function generateHourOptions(defaultHour) {
      let options = '';
      for (let h = 7; h <= 22; h++) {
        options += `<option value="${h}" ${h === defaultHour ? 'selected' : ''}>${pad(h)}</option>`;
      }
      return options;
    }

    function generateMinuteOptions(defaultMinute) {
      let options = '';
      [0, 30].forEach(m => {
        options += `<option value="${m}" ${m === defaultMinute ? 'selected' : ''}>${pad(m)}</option>`;
      });
      return options;
    }

    function deleteSkeletonBlock(blockId) {
      const template = skeletonTemplates.find(t => t.id === currentSkeletonTemplate);
      if (template) {
        template.blocks = template.blocks.filter(b => b.id !== blockId);
        saveSkeletonTemplates(skeletonTemplates);
        renderSkeletonEditor();
        renderWeekView(true);
      }
    }

    function showBlockRemarkModal(block) {
      document.querySelectorAll('.skeleton-context-menu').forEach(m => m.remove());

      const overlay = document.createElement('div');
      overlay.className = 'skeleton-modal-overlay';

      const modal = document.createElement('div');
      modal.className = 'skeleton-modal';
      modal.innerHTML = `
        <div class="skeleton-modal-title">${t('时间块备注')}</div>
        <textarea id="block-remark-input" class="skeleton-modal-input" rows="4" placeholder="${t('输入备注…')}"></textarea>
        <div class="skeleton-modal-actions">
          <button class="skeleton-btn" id="remark-cancel">${t('取消')}</button>
          <button class="skeleton-btn primary" id="remark-confirm">${t('确定')}</button>
        </div>
      `;
      overlay.appendChild(modal);
      document.body.appendChild(overlay);

      const input = modal.querySelector('#block-remark-input');
      input.value = block.remark || '';
      setTimeout(() => input.focus(), 0);

      const finish = (save) => {
        if (save) {
          const template = skeletonTemplates.find(t => t.id === currentSkeletonTemplate);
          const blockData = template ? template.blocks.find(b => b.id === block.id) : null;
          if (blockData) {
            const v = input.value.trim();
            if (v) blockData.remark = v;
            else delete blockData.remark;
            saveSkeletonTemplates(skeletonTemplates);
            renderSkeletonEditor();
          }
        }
        overlay.remove();
      };

      modal.querySelector('#remark-confirm').addEventListener('click', () => finish(true));
      modal.querySelector('#remark-cancel').addEventListener('click', () => finish(false));
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') { e.preventDefault(); finish(false); }
        else if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); finish(true); }
      });
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) finish(false);
      });
    }

    function showSkeletonBlockContextMenu(block, x, y) {
      document.querySelectorAll('.skeleton-context-menu').forEach(m => m.remove());

      const menu = document.createElement('div');
      menu.className = 'skeleton-context-menu';
      menu.innerHTML = `
        <button class="skeleton-context-menu-item" data-action="edit">${t('编辑')}</button>
        <button class="skeleton-context-menu-item" data-action="remark">${t('备注')}</button>
        <button class="skeleton-context-menu-item danger" data-action="delete">${t('删除')}</button>
      `;

      document.body.appendChild(menu);

      const rect = menu.getBoundingClientRect();
      const viewportWidth = window.innerWidth;
      const viewportHeight = window.innerHeight;

      let left = x;
      let top = y;

      if (left + rect.width > viewportWidth - 10) {
        left = viewportWidth - rect.width - 10;
      }
      if (top + rect.height > viewportHeight - 10) {
        top = viewportHeight - rect.height - 10;
      }

      menu.style.left = left + 'px';
      menu.style.top = top + 'px';

      menu.querySelectorAll('.skeleton-context-menu-item').forEach(item => {
        item.addEventListener('click', (e) => {
          e.stopPropagation();
          const action = item.dataset.action;
          if (action === 'remark') {
            showBlockRemarkModal(block);
          } else if (action === 'edit') {
            const template = skeletonTemplates.find(t => t.id === currentSkeletonTemplate);
            if (template) {
              const blockData = template.blocks.find(b => b.id === block.id);
              if (blockData) {
                const day = blockData.days ? blockData.days[0] : blockData.day;
                showAddBlockModal(day, 8, 0, blockData);
              }
            }
          } else if (action === 'delete') {
            showDeleteBlockModal(block.id);
          }
          hideSkeletonBlockContextMenu();
        });
      });

      setTimeout(() => {
        document.addEventListener('click', hideSkeletonBlockContextMenu);
        document.addEventListener('contextmenu', onSkeletonContextMenuOutside);
      }, 0);
    }

    function hideSkeletonBlockContextMenu() {
      const menu = document.querySelector('.skeleton-context-menu');
      if (menu) {
        if (menu.classList.contains('hiding')) return;
        menu.classList.add('hiding');
        setTimeout(() => menu.remove(), 120);
      }
      document.removeEventListener('click', hideSkeletonBlockContextMenu);
      document.removeEventListener('contextmenu', onSkeletonContextMenuOutside);
    }

    function onSkeletonContextMenuOutside(e) {
      const menu = document.querySelector('.skeleton-context-menu');
      if (menu && !menu.contains(e.target)) {
        hideSkeletonBlockContextMenu();
      }
    }

    // 处理时间块拖拽
    document.addEventListener('mousemove', (e) => {
      if (!skeletonDraggingBlock) return;

      const block = skeletonDragStartBlock;
      const template = skeletonTemplates.find(t => t.id === currentSkeletonTemplate);
      if (!template) return;

      const blockData = template.blocks.find(b => b.id === block.id);
      if (!blockData) return;

      if (skeletonDragMode === 'resize') {
        const deltaY = e.clientY - skeletonDragStartY;
        const deltaSlots = Math.round(deltaY / 22);
        if (deltaSlots === 0) return;

        const endHour = parseInt(blockData.endTime.split(':')[0], 10);
        const endMinute = parseInt(blockData.endTime.split(':')[1], 10);
        const newEndMinutes = endHour * 60 + endMinute + deltaSlots * 30;

        const startMin = parseInt(blockData.startTime.split(':')[0], 10) * 60 + parseInt(blockData.startTime.split(':')[1], 10);
        if (newEndMinutes <= startMin) return;
        if (newEndMinutes > 22 * 60) return;

        blockData.endTime = pad(Math.floor(newEndMinutes / 60)) + ':' + pad(newEndMinutes % 60);
        skeletonDragStartY = e.clientY;

        const newEndStr = blockData.endTime;
        if (skeletonResizeRaf) cancelAnimationFrame(skeletonResizeRaf);
        skeletonResizeRaf = requestAnimationFrame(() => {
          const el = skeletonDraggingBlock;
          if (!el) return;
          const endH = parseInt(newEndStr.split(':')[0], 10);
          const endHalf = parseInt(newEndStr.split(':')[1], 10) >= 30 ? 1 : 0;
          const endSlotIndex = (endH - 7) * 2 + endHalf;
          const startH = parseInt(blockData.startTime.split(':')[0], 10);
          const startHalf = parseInt(blockData.startTime.split(':')[1], 10) >= 30 ? 1 : 0;
          const startSlotIndex = (startH - 7) * 2 + startHalf;
          const newHeight = (endSlotIndex - startSlotIndex) * 22;
          el.style.height = newHeight + 'px';
        });
      } else if (skeletonDragMode === 'move') {
        // 4px 阈值后才启动 ghost
        if (!skeletonDragStarted) {
          const dx = e.clientX - skeletonDragStartX;
          const dy = e.clientY - skeletonDragStartY;
          if (Math.abs(dx) < 4 && Math.abs(dy) < 4) return;
          skeletonDragStarted = true;

          // 创建 ghost
          const rect = skeletonDraggingBlock.getBoundingClientRect();
          skeletonDragGhost = document.createElement('div');
          skeletonDragGhost.className = 'skeleton-drag-ghost';
          skeletonDragGhost.style.width = rect.width + 'px';
          skeletonDragGhost.style.height = rect.height + 'px';
          skeletonDragGhost.style.left = rect.left + 'px';
          skeletonDragGhost.style.top = rect.top + 'px';
          skeletonDragGhost.textContent = blockData.title;
          if (blockData.categoryId) {
            const cat = getSkeletonCategoryById(blockData.categoryId);
            if (cat) {
              skeletonDragGhost.style.setProperty('--skeleton-cat-color', cat.color);
            }
          }
          document.body.appendChild(skeletonDragGhost);
          skeletonDraggingBlock.style.opacity = '0.25';
          document.body.style.cursor = 'grabbing';
          document.body.style.userSelect = 'none';
          hideSkeletonBlockTooltip();
        }

        // ghost 实时吸附到网格（使用 day-col rect 精确对齐）
        if (skeletonDragGhost && skeletonDayRects.length > 0) {
          const SLOT_PX = 22;
          const headerHeight = 40;

          const rawX = e.clientX - skeletonDragOffsetX;
          const rawY = e.clientY - skeletonDragOffsetY;

          // 用 day-col rect 找目标列（右边界用 < 避免相邻列共享边界时匹配到左列）
          let targetDayIdx = 0;
          for (let i = 0; i < skeletonDayRects.length; i++) {
            if (rawX >= skeletonDayRects[i].left && rawX < skeletonDayRects[i].right) {
              targetDayIdx = i;
              break;
            }
            if (rawX >= skeletonDayRects[i].right) {
              targetDayIdx = i + 1;
            }
          }
          targetDayIdx = Math.max(0, Math.min(skeletonDayRects.length - 1, targetDayIdx));
          const dayRect = skeletonDayRects[targetDayIdx];

          // Y吸附到30分钟槽（用 dayRect.top 对齐标题行下方）
          const relY = rawY - dayRect.top - headerHeight;
          let targetSlot = Math.round(relY / SLOT_PX);
          const blockSlots = Math.ceil(skeletonDragDuration / 30);
          const maxSlot = 14 * 2 - blockSlots;
          targetSlot = Math.max(0, Math.min(maxSlot, targetSlot));
          const snappedY = dayRect.top + headerHeight + targetSlot * SLOT_PX;

          const gLeft = dayRect.left + 'px';
          const gTop = snappedY + 'px';
          const gWidth = dayRect.width + 'px';
          if (skeletonResizeRaf) cancelAnimationFrame(skeletonResizeRaf);
          skeletonResizeRaf = requestAnimationFrame(() => {
            if (!skeletonDragGhost) return;
            skeletonDragGhost.style.left = gLeft;
            skeletonDragGhost.style.top = gTop;
            skeletonDragGhost.style.width = gWidth;
          });
        }
      }
    });

    document.addEventListener('mouseup', (e) => {
      if (skeletonDraggingBlock) {
        if (skeletonResizeRaf) { cancelAnimationFrame(skeletonResizeRaf); skeletonResizeRaf = null; }
        const hadMoved = skeletonDragMode === 'move' && skeletonDragStarted;

        if (skeletonDragMode === 'move' && skeletonDragStarted) {
          // 计算最终落点
          const block = skeletonDragStartBlock;
          const template = skeletonTemplates.find(t => t.id === currentSkeletonTemplate);
          const blockData = template && template.blocks.find(b => b.id === block.id);

          if (blockData && skeletonDayRects.length > 0 && skeletonDragGhost) {
            const ghostRect = skeletonDragGhost.getBoundingClientRect();
            const headerHeight = 40;
            const SLOT_PX = 22;

            // 用 day-col rect 匹配目标列（找最近的列，避免边界容差导致匹配到相邻列）
            let targetDay = 1;
            let dayRect = skeletonDayRects[0];
            let minDist = Infinity;
            for (let i = 0; i < skeletonDayRects.length; i++) {
              const r = skeletonDayRects[i];
              const dist = Math.abs(ghostRect.left - r.left);
              if (dist < minDist) {
                minDist = dist;
                targetDay = i + 1;
                dayRect = r;
              }
            }

            // 计算目标时间（30分钟对齐，用 dayRect.top 对齐）
            const relY = ghostRect.top - dayRect.top - headerHeight;
            let targetSlot = Math.round(relY / SLOT_PX);
            const targetStartMin = 7 * 60 + targetSlot * 30;
            const duration = skeletonDragDuration;
            const targetEndMin = targetStartMin + duration;

            if (targetStartMin >= 7 * 60 && targetEndMin <= 22 * 60) {
              blockData.startTime = pad(Math.floor(targetStartMin / 60)) + ':' + pad(targetStartMin % 60);
              blockData.endTime = pad(Math.floor(targetEndMin / 60)) + ':' + pad(targetEndMin % 60);

              if (blockData.days) {
                const origFirstDay = blockData.days[0];
                const delta = targetDay - origFirstDay;
                const newDays = blockData.days.map(d => d + delta).filter(d => d >= 1 && d <= 7);
                if (newDays.length > 0) {
                  if (newDays.length === 1) {
                    delete blockData.days;
                    blockData.day = newDays[0];
                  } else {
                    blockData.days = [...new Set(newDays)].sort((a, b) => a - b);
                  }
                }
              } else {
                blockData.day = targetDay;
              }
            }
          }

          // 先保存数据到 localStorage
          try {
            saveSkeletonTemplates(skeletonTemplates);
          } catch (e) {
            console.error('[skeleton drag] mouseup 保存失败:', e);
          }

          // 清理 ghost
          if (skeletonDragGhost) {
            skeletonDragGhost.remove();
            skeletonDragGhost = null;
          }
          skeletonDraggingBlock.style.opacity = '';
          skeletonDragStarted = false;

          // 重新渲染骨架编辑器
          renderSkeletonEditor();

          // 立即渲染周视图
          renderWeekView(true);

          // 用 rAF 再刷一次，确保浏览器已完成布局更新
          requestAnimationFrame(() => {
            renderWeekView(true);
          });

          // 最终兜底：延迟再刷一次
          setTimeout(() => {
            renderWeekView(true);
          }, 50);
        }

        if (hadMoved) skeletonLastDragEnd = Date.now();
        skeletonDraggingBlock.classList.remove('dragging');
        skeletonDraggingBlock = null;
        skeletonDragStartBlock = null;
        skeletonDragMode = 'resize';
        skeletonGridRect = null;
        skeletonDayRects = [];
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
        try {
          saveSkeletonTemplates(skeletonTemplates);
        } catch (e) {
          console.error('[skeleton drag] mouseup 保存失败:', e);
        }
        renderSkeletonEditor();
        renderWeekView(true);
      }
    });

    function renderIdeaPanel(ideas) {
      const appLayout = document.querySelector('.app-layout');
      let panel = document.getElementById('idea-panel');
      let toggleBtn = document.getElementById('idea-fab');

      // 如果 ideas 为 null，表示隐藏面板
      if (ideas === null) {
        if (panel) panel.remove();
        if (toggleBtn) toggleBtn.remove();
        ideaPanelVisible = false;
        return;
      }

      const projects = loadProjects();

      // 创建浮动按钮
      if (!toggleBtn) {
        toggleBtn = document.createElement('button');
        toggleBtn.id = 'idea-fab';
        toggleBtn.className = 'idea-fab';
        toggleBtn.innerHTML = '💡';
        toggleBtn.title = t('想法');
        toggleBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          if (toggleBtn.dataset.justDragged === '1') return;
          ideaPanelVisible = !ideaPanelVisible;
          const panel = document.getElementById('idea-panel');
          const btn = document.getElementById('idea-fab');
          if (panel) {
            panel.classList.toggle('show', ideaPanelVisible);
            btn.classList.toggle('show', ideaPanelVisible);
          }
        });
        appLayout.appendChild(toggleBtn);
      }
      enableIdeaFabDrag(toggleBtn);
      requestAnimationFrame(() => applyIdeaFabPosition(toggleBtn));

      // 创建或更新浮动面板
      if (!panel) {
        panel = document.createElement('div');
        panel.id = 'idea-panel';
        panel.className = 'idea-float-panel';
        panel.addEventListener('click', (e) => {
          e.stopPropagation();
        });
        // 拖拽放置：从待办拖来的备注想法移回抽屉
        panel.addEventListener('dragover', (e) => {
          if (e.dataTransfer.types.includes('text/x-attached-idea')) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            panel.style.boxShadow = '0 0 0 2px #2563EB, 0 8px 24px rgba(0,0,0,0.12)';
          }
        });
        panel.addEventListener('dragleave', () => {
          panel.style.boxShadow = '';
        });
        panel.addEventListener('drop', (e) => {
          e.preventDefault();
          e.stopPropagation();
          panel.style.boxShadow = '';
          var data = e.dataTransfer.getData('text/x-attached-idea');
          if (!data) data = e.dataTransfer.getData('text/plain');
          try {
            var parsed = JSON.parse(data);
            if (parsed.type === 'attachedIdea') {
              removeAttachedIdea(parsed.noteId, parsed.ideaId);
            }
          } catch(_) {}
        });
        appLayout.appendChild(panel);
      }

      // 根据状态更新显示
      if (ideaPanelVisible) {
        panel.classList.add('show');
        toggleBtn.classList.add('show');
      } else {
        panel.classList.remove('show');
        toggleBtn.classList.remove('show');
      }

      // 渲染内容
      panel.innerHTML = '';

      const title = document.createElement('div');
      title.className = 'idea-panel-title';
      title.innerHTML = `${t('想法')} <span class="idea-count">${ideas.length}</span>`;
      panel.appendChild(title);

      const sortedIdeas = [...ideas].sort((a, b) =>
        Number(b.timestamp || b.id || 0) - Number(a.timestamp || a.id || 0)
      );

      if (sortedIdeas.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'idea-panel-empty';
        empty.textContent = t('还没有想法');
        panel.appendChild(empty);
      } else {
        const list = document.createElement('ul');
        list.className = 'note-list';
        list.style.listStyle = 'none';
        list.style.padding = 0;
        list.style.margin = 0;

        sortedIdeas.forEach(note => {
          try {
            const item = createNoteItem(note, projects, true);
            list.appendChild(item);
          } catch (err) {
            console.warn('[想法面板] 渲染 note 出错，已跳过:', note, err);
          }
        });

        panel.appendChild(list);

        const hint = document.createElement('div');
        hint.className = 'idea-drop-hint';
        hint.textContent = t('拖拽想法到待办或里程碑中');
        panel.appendChild(hint);
      }
    }

    // 里程碑接收待办后的闪烁反馈
    function _flashMilestoneReceived(goalId) {

        const sec = document.querySelector(`.goal-section[data-goal-id="${goalId}"]`);
