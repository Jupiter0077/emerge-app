        item.addEventListener('click', (e) => {
          e.stopPropagation();
          const action = item.dataset.action;
          if (action === 'mood') {
            showMoodDialog(dateKey, x, y);
          }
          hideCalendarContextMenu();
        });
      });

      setTimeout(() => {
        document.addEventListener('click', hideCalendarContextMenu);
        document.addEventListener('contextmenu', onCalendarContextMenuOutside);
      }, 0);
    }

    function hideCalendarContextMenu() {
      document.querySelectorAll('.calendar-context-menu').forEach(m => {
        if (m.classList.contains('hiding')) return;
        m.classList.add('hiding');
        setTimeout(() => m.remove(), 120);
      });
      document.removeEventListener('click', hideCalendarContextMenu);
      document.removeEventListener('contextmenu', onCalendarContextMenuOutside);
    }

    function onCalendarContextMenuOutside(e) {
      if (!e.target.closest('.calendar-context-menu') && !e.target.closest('.mood-dialog')) {
        hideCalendarContextMenu();
      }
    }

    function showMoodDialog(dateKey, x, y) {
      // 移除已有的弹窗
      const existing = document.getElementById('mood-dialog');
      if (existing) existing.remove();

      const moods = loadMoods();
      const currentMood = moods[dateKey] || null;

      const dialog = document.createElement('div');
      dialog.id = 'mood-dialog';
      dialog.className = 'mood-dialog';
      dialog.innerHTML = `
        <div class="mood-dialog-title">记录心境</div>
        <div class="mood-emoji-list">
          ${MOOD_OPTIONS.map(m => `
            <button class="mood-emoji-btn ${currentMood?.emoji === m.emoji ? 'active' : ''}" data-emoji="${m.emoji}" data-label="${m.label}" data-color="${m.color}">
              <span class="mood-emoji">${m.emoji}</span>
              <span class="mood-label">${m.label}</span>
            </button>
          `).join('')}
        </div>
        <textarea class="mood-textarea" placeholder="今天的感受...（可选）">${currentMood?.text || ''}</textarea>
        <div class="mood-dialog-actions">
          ${currentMood ? '<button class="mood-delete-btn">删除</button>' : ''}
          <button class="mood-cancel-btn">取消</button>
          <button class="mood-save-btn">保存</button>
        </div>
      `;

      document.body.appendChild(dialog);

      // 定位
      const rect = dialog.getBoundingClientRect();
      let left = x - rect.width / 2;
      let top = y - rect.height - 10;

      // 边界检测
      if (left < 10) left = 10;
      if (left + rect.width > window.innerWidth - 10) left = window.innerWidth - rect.width - 10;
      if (top < 10) top = y + 10;

      dialog.style.left = left + 'px';
      dialog.style.top = top + 'px';

      let selectedMood = currentMood ? MOOD_OPTIONS.find(m => m.emoji === currentMood.emoji) : null;

      // 选择心情
      dialog.querySelectorAll('.mood-emoji-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          dialog.querySelectorAll('.mood-emoji-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          selectedMood = {
            emoji: btn.dataset.emoji,
            label: btn.dataset.label,
            color: btn.dataset.color
          };
        });
      });

      // 保存
      dialog.querySelector('.mood-save-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        const text = dialog.querySelector('.mood-textarea').value.trim();
        if (selectedMood) {
          saveMood(dateKey, {
            ...selectedMood,
            text: text,
            timestamp: Date.now()
          });
        }
        dialog.remove();
        renderWeekView();
      });

      // 取消
      dialog.querySelector('.mood-cancel-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        dialog.remove();
      });

      // 删除
      const deleteBtn = dialog.querySelector('.mood-delete-btn');
      if (deleteBtn) {
        deleteBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          saveMood(dateKey, null);
          dialog.remove();
          renderWeekView();
        });
      }

      // 点击外部关闭
      setTimeout(() => {
        document.addEventListener('click', function closeDialog(e) {
          if (!dialog.contains(e.target)) {
            dialog.remove();
            document.removeEventListener('click', closeDialog);
          }
        });
      }, 10);
    }

    function showNoteContextMenu(noteId, x, y) {
      document.querySelectorAll('.note-context-menu').forEach(m => m.remove());

      const notes = loadNotes();
      const note = notes.find(n => String(n.id) === String(noteId));
      if (!note) return;

      const menu = document.createElement('div');
      menu.className = 'note-context-menu';
      menu.dataset.noteId = noteId;

      // 编辑按钮
      const editBtn = document.createElement('button');
      editBtn.className = 'note-context-menu-item';
      editBtn.textContent = t('编辑');
      editBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        hideNoteContextMenu();
        showNoteEditModal(note);
      });
      menu.appendChild(editBtn);

      // 显示详细信息
      const detailBtn = document.createElement('button');
      detailBtn.className = 'note-context-menu-item';
      detailBtn.textContent = t('显示详细信息');
      detailBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        hideNoteContextMenu();
        showNoteDetailPopup(note, x, y);
      });
      menu.appendChild(detailBtn);

      // 管理备注想法
      if (note.attachedIdeas && note.attachedIdeas.length > 0) {
        const manageIdeasBtn = document.createElement('button');
        manageIdeasBtn.className = 'note-context-menu-item';
        manageIdeasBtn.textContent = t('管理备注想法');
        manageIdeasBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          hideNoteContextMenu();
          showManageIdeasModal(note.id);
        });
        menu.appendChild(manageIdeasBtn);
      }

      // 归类到项目（仅待办和想法）
      if (note.type === 'todo' || note.type === 'idea') {
        const projectSection = document.createElement('div');
        projectSection.style.cssText = 'padding:6px 0;';

        const projectTitle = document.createElement('div');
        projectTitle.style.cssText = 'font-size:11px;color:#86868b;padding:4px 14px 2px;text-transform:uppercase;letter-spacing:0.3px;';
        projectTitle.textContent = t('归类到项目');
        projectSection.appendChild(projectTitle);

        const projects = loadProjects();
        const visibleProjects = getAssignableProjects(projects);
        visibleProjects.forEach(project => {
          const projectBtn = document.createElement('button');
          projectBtn.className = 'note-context-menu-item';
          projectBtn.style.cssText = 'display:flex;align-items:center;gap:8px;';
          const isActive = String(note.projectId) === String(project.id);

          const dot = document.createElement('span');
          dot.style.cssText = 'width:8px;height:8px;border-radius:50%;background:' + (project.color || '#64748B') + ';flex-shrink:0;';
          projectBtn.appendChild(dot);

          const name = document.createElement('span');
          name.style.cssText = 'flex:1;text-align:left;';
          name.textContent = project.name;
          projectBtn.appendChild(name);

          if (isActive) {
            const check = document.createElement('span');
            check.textContent = '✓';
            check.style.cssText = 'color:' + (project.color || '#64748B') + ';font-size:12px;';
            projectBtn.appendChild(check);
          }

          projectBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            setNoteProject(noteId, project.id);
            hideNoteContextMenu();
          });
          projectSection.appendChild(projectBtn);
        });

        if (note.projectId) {
          const clearBtn = document.createElement('button');
          clearBtn.className = 'note-context-menu-item';
          clearBtn.style.cssText = 'color:#86868b;font-size:13px;';
          clearBtn.textContent = t('取消归类');
          clearBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            setNoteProject(noteId, null);
            hideNoteContextMenu();
          });
          projectSection.appendChild(clearBtn);
        }

        menu.appendChild(projectSection);
      }

      // 分隔线
      const divider2 = document.createElement('div');
      divider2.className = 'menu-divider';
      menu.appendChild(divider2);

      // 删除按钮（日历语义：执行记录只删当天；循环待办只移出今天；其他正常删除）
      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'note-context-menu-item danger';
      const _isLog = note.type === 'todo-log';
      const _isRecurring = !!(note.recurrence && note.recurrence.type);
      deleteBtn.textContent = _isLog ? t('删除此次记录') : (_isRecurring ? t('移出今天') : t('删除'));
      deleteBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        deleteFromCalendar(note);
        hideNoteContextMenu();
      });
      menu.appendChild(deleteBtn);

      document.body.appendChild(menu);

      const rect = menu.getBoundingClientRect();
      const viewportWidth = window.innerWidth;
      const viewportHeight = window.innerHeight;

      let left = x;
      let top = y;

      if (left + rect.width > viewportWidth - 10) {
        left = viewportWidth - rect.width - 10;
      }
      if (top + rect.height > viewportHeight - 10) {
        top = viewportHeight - rect.height - 10;
      }

      menu.style.left = left + 'px';
      menu.style.top = top + 'px';

      setTimeout(() => {
        document.addEventListener('mousedown', onNoteContextMenuOutside);
      }, 0);
    }

    function showManageIdeasModal(noteId) {
      const notes = loadNotes();
      const note = notes.find(n => String(n.id) === String(noteId));
      if (!note || !note.attachedIdeas || note.attachedIdeas.length === 0) return;

      const overlay = document.createElement('div');
      overlay.className = 'skeleton-modal-overlay';

      const modal = document.createElement('div');
      modal.className = 'skeleton-modal';
      modal.style.cssText = 'max-width:480px;';

      const title = document.createElement('div');
      title.className = 'skeleton-modal-title';
      title.textContent = t('管理备注想法');
      modal.appendChild(title);

      const list = document.createElement('div');
      list.style.cssText = 'margin-bottom:16px;max-height:400px;overflow-y:auto;';

      function renderIdeaList() {
        list.innerHTML = '';
        const currentNotes = loadNotes();
        const currentNote = currentNotes.find(n => String(n.id) === String(noteId));
        if (!currentNote || !currentNote.attachedIdeas || currentNote.attachedIdeas.length === 0) {
          overlay.remove();
          return;
        }
        currentNote.attachedIdeas.forEach(idea => {
          const item = document.createElement('div');
          item.style.cssText = 'display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid #f0f0f0;border-radius:8px;margin-bottom:8px;flex-wrap:wrap;';

          const icon = document.createElement('span');
          icon.textContent = '💡';
          icon.style.flexShrink = '0';
          item.appendChild(icon);

          const text = document.createElement('span');
          text.textContent = idea.text;
          text.style.cssText = 'flex:1;word-break:break-word;font-size:14px;line-height:1.5;min-width:0;';
          item.appendChild(text);

          const btnGroup = document.createElement('div');
          btnGroup.style.cssText = 'display:flex;gap:6px;flex-shrink:0;';

          // 移回想法抽屉
          const detachBtn = document.createElement('button');
          detachBtn.className = 'skeleton-btn';
detachBtn.textContent = t('移回抽屉');
          detachBtn.style.cssText = 'flex-shrink:0;background:rgba(37,99,235,0.1);color:#2563EB;font-size:12px;padding:4px 10px;border-radius:6px;border:none;cursor:pointer;';
          detachBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            e.preventDefault();
            console.log('[modal] 移回抽屉点击, noteId:', noteId, 'ideaId:', idea.id);
            removeAttachedIdea(noteId, idea.id);
            renderIdeaList();
          });
          btnGroup.appendChild(detachBtn);

          // 移动到其他待办
          const moveBtn = document.createElement('button');
          moveBtn.className = 'skeleton-btn';
          moveBtn.textContent = t('移动到待办');
          moveBtn.style.cssText = 'flex-shrink:0;background:rgba(37,99,235,0.1);color:#2563EB;font-size:12px;padding:4px 10px;border-radius:6px;border:none;cursor:pointer;';
          moveBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            e.preventDefault();
            // 关闭已有的选择器
            const existing = item.querySelector('.move-target-picker');
            if (existing) { existing.remove(); return; }
            const picker = document.createElement('div');
            picker.className = 'move-target-picker';
            picker.style.cssText = 'width:100%;margin-top:6px;padding:8px;border:1px solid #e5e5ea;border-radius:6px;max-height:180px;overflow-y:auto;';
            const allNotes = loadNotes();
            const candidates = allNotes.filter(n =>
              (n.type === 'todo' || n.type === 'milestone') &&
              String(n.id) !== String(noteId)
            );
            if (candidates.length === 0) {
              picker.innerHTML = '<div style="font-size:12px;color:#999;text-align:center;padding:8px">暂无其他待办</div>';
            } else {
              candidates.forEach(c => {
                const opt = document.createElement('div');
                opt.style.cssText = 'padding:6px 10px;font-size:13px;cursor:pointer;border-radius:4px;word-break:break-word;';
                opt.textContent = (c.type === 'milestone' ? '🎯 ' : '') + (c.text || '(无标题)');
                opt.addEventListener('mouseenter', () => { opt.style.background = 'rgba(37,99,235,0.08)'; });
                opt.addEventListener('mouseleave', () => { opt.style.background = ''; });
                opt.addEventListener('click', function(ev) {
                  ev.stopPropagation();
                  ev.preventDefault();
                  moveAttachedIdea(noteId, idea.id, c.id);
                  picker.remove();
                  renderIdeaList();
                });
                picker.appendChild(opt);
              });
            }
            item.appendChild(picker);
          });
          btnGroup.appendChild(moveBtn);

          item.appendChild(btnGroup);
          list.appendChild(item);
        });
      }

      renderIdeaList();

      modal.appendChild(list);

      const actions = document.createElement('div');
      actions.className = 'skeleton-modal-actions';
      const closeBtn = document.createElement('button');
      closeBtn.className = 'skeleton-btn primary';
      closeBtn.textContent = '关闭';
      closeBtn.addEventListener('click', () => {
        overlay.remove();
      });
      actions.appendChild(closeBtn);
      modal.appendChild(actions);

      overlay.appendChild(modal);
      document.body.appendChild(overlay);
      overlay.addEventListener('mousedown', e => {
        if (e.target === overlay) overlay.remove();
      });
    }

    function showNoteEditModal(note) {
      const overlay = document.createElement('div');
      overlay.className = 'skeleton-modal-overlay';

      const modal = document.createElement('div');
      modal.className = 'skeleton-modal';

      const recurrence = note.recurrence || {};
      const hasRecurrence = !!recurrence.type;
      const recType = recurrence.type || 'count';
      const recCount = recurrence.count || 10;
      const recInterval = recurrence.dailyInterval || 1;
      const recEndDate = recurrence.endDate || '';
      const recCompleted = recurrence.completedCount || 0;

      modal.innerHTML = `
        <div class="skeleton-modal-title">编辑待办</div>
        <div class="skeleton-modal-row">
          <label class="skeleton-modal-label">待办内容</label>
          <input type="text" class="skeleton-modal-input" id="note-edit-text-input" value="${(note.text || '').replace(/"/g, '&quot;')}">
        </div>
        <div class="skeleton-modal-row recurrence-row">
          <label class="skeleton-modal-label">重复</label>
          <label class="recurrence-switch">
            <input type="checkbox" id="recurrence-enabled" ${hasRecurrence ? 'checked' : ''}>
            <span class="recurrence-switch-slider"></span>
          </label>
        </div>
        <div class="recurrence-settings" id="recurrence-settings" style="${hasRecurrence ? '' : 'display:none'}">
          <div class="skeleton-modal-row">
            <label class="skeleton-modal-label">重复方式</label>
            <div class="recurrence-type-tabs">
              <button type="button" class="recurrence-type-btn ${recType === 'count' ? 'active' : ''}" data-type="count">按次数</button>
              <button type="button" class="recurrence-type-btn ${recType === 'daily' ? 'active' : ''}" data-type="daily">按天</button>
            </div>
          </div>
          <div class="skeleton-modal-row recurrence-count-row" style="${recType === 'count' ? '' : 'display:none'}">
            <label class="skeleton-modal-label">总次数</label>
            <input type="number" class="skeleton-modal-input recurrence-count-input" id="recurrence-count" min="1" value="${recCount}">
          </div>
          <div class="skeleton-modal-row recurrence-daily-row" style="${recType === 'daily' ? '' : 'display:none'}">
            <label class="skeleton-modal-label">每</label>
            <input type="number" class="skeleton-modal-input recurrence-daily-input" id="recurrence-interval" min="1" value="${recInterval}" style="width:80px">
            <span style="margin:0 6px;color:var(--text-secondary)">天</span>
          </div>
          <div class="skeleton-modal-row recurrence-end-row" style="${recType === 'daily' ? '' : 'display:none'}">
            <label class="skeleton-modal-label">结束日期</label>
            <input type="date" class="skeleton-modal-input recurrence-end-input" id="recurrence-end-date" value="${recEndDate}">
          </div>
          ${hasRecurrence ? `<div class="recurrence-completed-info">已完成 <strong>${recCompleted}</strong> 次${recType === 'count' ? ' / 共 ' + recCount + ' 次' : ' / 自添加以来应完成 ' + getTodoTotalCount(note) + ' 次'}</div>` : ''}
        </div>
        <div class="skeleton-modal-actions">
          <button class="skeleton-btn" id="note-edit-cancel-btn">取消</button>
          <button class="skeleton-btn primary" id="note-edit-save-btn">保存</button>
        </div>
      `;
      overlay.appendChild(modal);
      document.body.appendChild(overlay);

      const input = modal.querySelector('#note-edit-text-input');
      input.focus();
      const len = input.value.length;
      input.setSelectionRange(len, len);

      // 循环设置交互
      const enabledCheckbox = modal.querySelector('#recurrence-enabled');
      const settingsBox = modal.querySelector('#recurrence-settings');
      const typeBtns = modal.querySelectorAll('.recurrence-type-btn');
      const countRow = modal.querySelector('.recurrence-count-row');
      const dailyRow = modal.querySelector('.recurrence-daily-row');
      const endRow = modal.querySelector('.recurrence-end-row');
      let currentType = recType;

      enabledCheckbox.addEventListener('change', () => {
        settingsBox.style.display = enabledCheckbox.checked ? '' : 'none';
      });

      typeBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          typeBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentType = btn.dataset.type;
          if (currentType === 'count') {
            countRow.style.display = '';
            dailyRow.style.display = 'none';
            endRow.style.display = 'none';
          } else {
            countRow.style.display = 'none';
            dailyRow.style.display = '';
            endRow.style.display = '';
          }
        });
      });

      function closeEditModal() {
        overlay.remove();
      }

      function saveEdit() {
        const val = input.value;
        const trimmed = val.trim();
        if (!trimmed) {
          closeEditModal();
          return;
        }
        const notes = loadNotes();
        const idx = notes.findIndex(n => String(n.id) === String(note.id));
        if (idx !== -1) {
          notes[idx].text = trimmed;
          // 循环设置
          if (enabledCheckbox.checked) {
            const existing = notes[idx].recurrence || {};
            const completedCount = existing.completedCount || 0;
            if (currentType === 'count') {
              const countVal = parseInt(modal.querySelector('#recurrence-count').value, 10);
              const count = isNaN(countVal) || countVal < 1 ? 1 : countVal;
              notes[idx].recurrence = {
                type: 'count',
                count: count,
                completedCount: completedCount,
                lastCompletedDate: existing.lastCompletedDate || null
              };
            } else {
              const intervalVal = parseInt(modal.querySelector('#recurrence-interval').value, 10);
              const interval = isNaN(intervalVal) || intervalVal < 1 ? 1 : intervalVal;
              const endDate = modal.querySelector('#recurrence-end-date').value || null;
              notes[idx].recurrence = {
                type: 'daily',
                dailyInterval: interval,
                endDate: endDate,
                startDate: (existing.type === 'daily' && existing.startDate) ? existing.startDate : toDateKey(new Date()),
                completedCount: completedCount,
                lastCompletedDate: existing.lastCompletedDate || null
              };
            }
          } else {
            // 关闭循环
            if (notes[idx].recurrence) {
              delete notes[idx].recurrence;
            }
          }
          saveNotes(notes);
          render();
        }
        closeEditModal();
      }

      modal.querySelector('#note-edit-cancel-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        closeEditModal();
      });
      modal.querySelector('#note-edit-save-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        saveEdit();
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          saveEdit();
        } else if (e.key === 'Escape') {
          e.preventDefault();
          closeEditModal();
        }
      });
      overlay.addEventListener('mousedown', (e) => {
        if (e.target === overlay) closeEditModal();
      });
    }

    function showNoteDetailPopup(note, x, y) {
      hideNoteDetailPopup();

      const popup = document.createElement('div');
      popup.className = 'calendar-tooltip';
      popup.style.display = 'block';
      popup.style.zIndex = '10000';

      // 触发 reflow 再加 show class，确保动画生效
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          popup.classList.add('show');
        });
      });

      const title = document.createElement('div');
      title.className = 'cal-tooltip-title';
      title.textContent = note.text;
      popup.appendChild(title);

      const metaParts = [];
      if (note.scheduledTime) {
        const t = document.createElement('span');
        t.textContent = note.scheduledTime;
        metaParts.push(t);
      }
      if (note.duration) {
        const d = document.createElement('span');
        d.textContent = formatDuration(note.duration);
        metaParts.push(d);
      }
      const pn = getProjectName(note.projectId);
      if (pn) {
        const proj = document.createElement('span');
        proj.className = 'cal-tooltip-project';
        const dot = document.createElement('span');
        dot.className = 'cal-tooltip-dot';
        dot.style.background = getProjectColor(note.projectId);
        proj.appendChild(dot);
        proj.appendChild(document.createTextNode(pn));
        metaParts.push(proj);
      }
      if (metaParts.length > 0) {
        const meta = document.createElement('div');
        meta.className = 'cal-tooltip-meta';
        metaParts.forEach((p, i) => {
          if (i > 0) {
            const sep = document.createElement('span');
            sep.className = 'cal-tooltip-sep';
            sep.textContent = '·';
            meta.appendChild(sep);
          }
          meta.appendChild(p);
        });
        popup.appendChild(meta);
      }

      if (note.subTodos && note.subTodos.length > 0) {
        const subWrap = document.createElement('div');
        subWrap.className = 'cal-tooltip-subtodos';
        const prog = getSubTodoProgress(note);
        if (prog) {
          const pEl = document.createElement('div');
          pEl.className = 'cal-tooltip-progress';
          pEl.textContent = prog.completed + '/' + prog.total + ' 已完成';
          subWrap.appendChild(pEl);
        }
        note.subTodos.forEach(sub => {
          const si = document.createElement('div');
          si.className = 'cal-tooltip-subtodo' + (sub.completed ? ' completed' : '');
          const chk = document.createElement('span');
          chk.className = 'cal-tooltip-sub-check';
          chk.textContent = sub.completed ? '✓' : '○';
          const st = document.createElement('span');
          st.className = 'cal-tooltip-sub-text';
          st.textContent = sub.text;
          si.appendChild(chk);
          si.appendChild(st);
          subWrap.appendChild(si);
        });
        popup.appendChild(subWrap);
      }

      document.body.appendChild(popup);

      const tipRect = popup.getBoundingClientRect();
      let left = x;
      let top = y;
      if (left + tipRect.width > window.innerWidth - 8) left = window.innerWidth - tipRect.width - 8;
      if (left < 8) left = 8;
      if (top + tipRect.height > window.innerHeight - 8) top = window.innerHeight - tipRect.height - 8;
      if (top < 8) top = 8;
      popup.style.left = left + 'px';
      popup.style.top = top + 'px';

      setTimeout(() => {
        document.addEventListener('mousedown', onNoteDetailOutside);
      }, 0);
    }

    function toggleProjectStatus(projectId) {
      const projects = loadProjects();
      const project = projects.find(p => p.id === projectId);
      if (project) {
        const statusOrder = ['in_progress', 'ongoing', 'upcoming', 'completed'];
        const currentIndex = statusOrder.indexOf(project.status);
        const nextIndex = (currentIndex + 1) % statusOrder.length;
        project.status = statusOrder[nextIndex];
        const maxOrder = Math.max(0, ...projects.filter(p => p.status === project.status).map(p => p.order || 0));
        project.order = maxOrder + 1;
        saveProjects(projects);
        renderProjects();
        render();
      }
    }

    function toggleProjectPriority(projectId) {
      const projects = loadProjects();
      const project = projects.find(p => p.id === projectId);
      if (project) {
        project.priority = project.priority > 0 ? 0 : 1;
        saveProjects(projects);
        renderProjects();
      }
    }

    function reorderProjects(sourceId, targetId, position) {
      const projects = loadProjects();
      const source = projects.find(p => p.id === sourceId);
      const target = projects.find(p => p.id === targetId);
      if (!source || !target || sourceId === targetId) return;

      const targetStatus = target.status;
      const status = targetStatus;

      // 先改变源项目的状态（如果跨分组）
      source.status = targetStatus;

      const groupProjects = projects
        .filter(p => p.status === status)
        .sort((a, b) => {
          if (b.priority !== a.priority) return b.priority - a.priority;
          return (a.order || 0) - (b.order || 0);
        });

      const sourceIdx = groupProjects.findIndex(p => p.id === sourceId);
      const [sourceItem] = groupProjects.splice(sourceIdx, 1);

      let targetIdx = groupProjects.findIndex(p => p.id === targetId);
      if (position === 'after') targetIdx++;

      groupProjects.splice(targetIdx, 0, sourceItem);

      groupProjects.forEach((p, i) => {
        p.order = i;
      });

      saveProjects(projects);
      renderProjects();
    }

    function updateProject(id, name) {
      const trimmed = name.trim();
      if (!trimmed) return;
      const projects = loadProjects();
      const project = projects.find(p => p.id === id);
      if (project) {
        project.name = trimmed;
        saveProjects(projects);
        renderProjects();
        render();
      }
    }

    function moveProjectToCategory(projectId, categoryId) {
      const projects = loadProjects();
      const project = projects.find(p => p.id === projectId);
      if (project && project.category !== categoryId) {
        project.category = categoryId;
        saveProjects(projects);
        renderProjects();
        render();
      }
    }

    const CATEGORY_COLLAPSE_KEY = 'zhixing-heyi-category-collapse';

    function loadCategoryCollapsedState() {
      try {
        const raw = localStorage.getItem(CATEGORY_COLLAPSE_KEY);
        const state = raw ? JSON.parse(raw) : {};
        if (state.completed === undefined) state.completed = true;
        return state;
      } catch {
        return { completed: true };
      }
    }

    function toggleCategoryCollapse(categoryKey) {
      const state = loadCategoryCollapsedState();
      state[categoryKey] = !state[categoryKey];
      localStorage.setItem(CATEGORY_COLLAPSE_KEY, JSON.stringify(state));

      // 直接操作DOM触发展开/收起动画，而不是重新渲染
      const catGroup = document.querySelector('.' + categoryKey + '-projects');
      const catTitle = document.querySelector(`.project-category-title[data-category="${categoryKey}"]`);
      const catArrow = catTitle?.querySelector('.category-arrow');
      
      if (catGroup) {
        if (state[categoryKey]) {
          // 收起：先将max-height设为当前高度，然后下一帧设为0
          catGroup.style.maxHeight = catGroup.scrollHeight + 'px';
          // 强制浏览器重排
          catGroup.offsetHeight;
          requestAnimationFrame(() => {
            catGroup.style.maxHeight = '0px';
          });
          // 动画结束后设置collapsed状态
          const onTransitionEnd = (e) => {
            if (e.propertyName === 'max-height') {
              catGroup.classList.remove('expanded');
              catGroup.classList.add('collapsed');
              catGroup.style.maxHeight = '';
              catGroup.removeEventListener('transitionend', onTransitionEnd);
            }
          };
          catGroup.addEventListener('transitionend', onTransitionEnd);
        } else {
          // 展开：先设为0，然后下一帧设为scrollHeight
          catGroup.style.maxHeight = '0px';
          catGroup.classList.remove('collapsed');
          catGroup.classList.add('expanded');
          // 强制浏览器重排
          catGroup.offsetHeight;
          requestAnimationFrame(() => {
            catGroup.style.maxHeight = catGroup.scrollHeight + 'px';
          });
          // 动画结束后清除max-height，让内容自适应
          const onTransitionEnd = (e) => {
            if (e.propertyName === 'max-height') {
              catGroup.style.maxHeight = '';
              catGroup.removeEventListener('transitionend', onTransitionEnd);
            }
          };
          catGroup.addEventListener('transitionend', onTransitionEnd);
        }
      }
      
      // 更新箭头状态
      if (catArrow) {
        if (state[categoryKey]) {
          catArrow.classList.remove('expanded');
        } else {
          catArrow.classList.add('expanded');
        }
      }
    }

    function changeProjectStatus(projectId, status) {
      const projects = loadProjects();
      const project = projects.find(p => p.id == projectId);
      if (!project || project.status === status) return;
      project.status = status;
      const maxOrder = Math.max(0, ...projects.filter(p => p.status === status).map(p => p.order || 0));
      project.order = maxOrder + 1;
      saveProjects(projects);
      renderProjects();
    }

    function startProjectEdit(projectId, li) {
      const projects = loadProjects();
      const project = projects.find(p => p.id === projectId);
      if (!project) return;

      li.classList.add('is-editing');
      const nameSpan = li.querySelector('.project-name');
      nameSpan.innerHTML = '';

      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'project-edit-input';
      input.value = project.name;

      nameSpan.appendChild(input);
      input.focus();
      input.select();

      let done = false;
      const finish = (save) => {
        if (done) return;
        done = true;
        if (save && input.value.trim()) {
          updateProject(projectId, input.value);
        } else {
          renderProjects();
        }
      };

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          finish(true);
        } else if (e.key === 'Escape') {
          e.preventDefault();
          finish(false);
        }
      });
      input.addEventListener('blur', () => finish(true));
    }

    function createNoteItem(note, projects, hideTime) {

      item.title = titleText;
      const isEditing = editingNoteId === note.id;
      if (isEditing) item.classList.add('is-editing');

      if (note.type === 'goal') item.classList.add('type-goal');
      if (note.type === 'todo') item.classList.add('type-todo');
      if (note.type === 'todo' && note.completed) item.classList.add('completed');
      if (note.type === 'todo' && note.inProgress && !note.completed) item.classList.add('in-progress');
      if (note.type === 'todo' && note.isNextAction) item.classList.add('manual-next-action');
      if (note.type === 'goal' && note.isCurrentGoal) item.classList.add('current-goal-note');
      if (note.type === 'todo') {
        item.addEventListener('click', (e) => {
          if (e.target.closest('.todo-checkbox')) return;
          if (e.target.closest('.note-action')) return;
          if (e.target.closest('.note-menu')) return;
          if (e.target.closest('.sub-todo-item')) return;
          if (e.target.closest('.sub-todo-list')) return;
          if (e.target.closest('.note-edit-input')) return;
          selectedTodoIdForSubTodo = String(note.id);
        });
      }

      const noteType = note.type || null;

      // 第一行容器：时间、复选框、文字、动作按钮都在这里面，不换行
      const mainRow = document.createElement('div');
      mainRow.className = 'note-main-row';

      const time = document.createElement('span');
      time.className = 'note-time';
      time.textContent = note.time;

      if (isEditing) {
        const editInput = document.createElement('input');
        editInput.type = 'text';
        editInput.className = 'note-edit-input';
        editInput.value = note.text;
        editInput.dataset.editId = note.id;
        editInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            // 待办类型：Enter 保存并继续添加下一个（与子待办一致）
            updateNote(note.id, editInput.value, note.type === 'todo');
          } else if (e.key === 'Escape') {
            e.preventDefault();
            // 空内容待办删除（与子待办一致）
            if (note.type === 'todo' && !editInput.value.trim()) {
              const notes = loadNotes();
              saveNotes(notes.filter(n => String(n.id) !== String(note.id)));
            }
            editingNoteId = null;
            todoAddingMode = false;
            render();
          }
        });
        // 待办失焦保存（或删除空待办），与子待办一致
        editInput.addEventListener('blur', () => {
          if (_undoTriggering) return;
          if (note.type === 'todo' && editingNoteId === note.id) {
            updateNote(note.id, editInput.value, false);
          }
        });
        mainRow.appendChild(time);
        mainRow.appendChild(editInput);
        // 编辑时也显示待办复选框（与子待办一致）
        if (note.type === 'todo') {
          const checkbox = document.createElement('div');
          checkbox.className = 'todo-checkbox';
          checkbox.innerHTML = `<svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg><svg class="dash-icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="4" stroke-linecap="round"><line x1="6" y1="12" x2="18" y2="12"></line></svg>`;
          checkbox.addEventListener('mousedown', (e) => {
            e.stopPropagation();
          });
          checkbox.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleTodoComplete(note.id, e.clientX, e.clientY);
          });
          mainRow.appendChild(checkbox);
        }
      } else {
        const text = document.createElement('span');
        text.className = 'note-text';
        text.textContent = note.text;

        mainRow.appendChild(time);

        mainRow.appendChild(text);

        if (note.type === 'goal' && note.isCurrentGoal && !isEditing) {
          const currentBadge = document.createElement('span');
          currentBadge.className = 'current-goal-badge';
          currentBadge.textContent = t('当前');
          mainRow.appendChild(currentBadge);
        }

        // 子待办进度
        if (note.type === 'todo' && note.subTodos && note.subTodos.length > 0) {
          const progress = getSubTodoProgress(note);
          const progressEl = document.createElement('span');
          progressEl.className = 'sub-todo-progress';
          progressEl.textContent = progress.completed + '/' + progress.total;
          if (progress.completed === progress.total) {
            progressEl.classList.add('all-done');
          }
          mainRow.appendChild(progressEl);
        }

        // 重复标记和完成次数（线性进度条 + 已完成/应完成）
        if (note.type === 'todo' && note.recurrence && note.recurrence.type) {
          const recEl = document.createElement('span');
          recEl.className = 'todo-recurrence-badge';
          const r = note.recurrence;
          const total = getTodoTotalCount(note);
          const count = Math.min(r.completedCount || 0, total);
          const pct = Math.min(count / total, 1);
          recEl.innerHTML = '<span class="rec-bar"><span class="rec-bar-fill" style="width:' + (pct * 100).toFixed(0) + '%"></span></span>'
            + '<span class="rec-num">' + count + '/' + total + '</span>';
          recEl.title = r.type === 'count'
            ? `重复：共 ${total} 次，已完成 ${count} 次`
            : `重复：每 ${r.dailyInterval} 天${r.endDate ? '，至 ' + r.endDate : ''}，自添加以来已完成 ${count}/${total} 次`;
          if (isRecurrenceEnded(note)) {
            recEl.classList.add('recurrence-ended');
          }
          mainRow.appendChild(recEl);
        }

        // 备注（附加想法）徽章
        if (note.attachedIdeas && note.attachedIdeas.length > 0 && !isEditing) {
          item.style.position = 'relative';
          const ideaBadge = document.createElement('div');
          ideaBadge.className = 'note-idea-badge';
          ideaBadge.innerHTML = `💡 <span class="idea-count">${note.attachedIdeas.length}</span>`;

          // tooltip
          const tooltip = document.createElement('div');
          tooltip.className = 'idea-tooltip';
          tooltip.style.display = 'none';

          const tooltipTitle = document.createElement('div');
          tooltipTitle.className = 'tooltip-title';
          tooltipTitle.textContent = t('备注想法');
          tooltip.appendChild(tooltipTitle);

          const ideasContainer = document.createElement('div');
          ideasContainer.className = 'tooltip-ideas';
          note.attachedIdeas.forEach(idea => {
            const ideaItem = document.createElement('div');
            ideaItem.className = 'tooltip-idea-item';

            // 悬浮显示创建时间
            if (idea.timestamp) {
              var d = new Date(idea.timestamp);
              ideaItem.title = d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' + formatTime(d);
            }

            const ideaText = document.createElement('span');
            ideaText.className = 'idea-text';
            ideaText.textContent = idea.text;
            ideaItem.appendChild(ideaText);

            // 双击编辑（原位置内联编辑，与普通想法一致）
            ideaItem.addEventListener('dblclick', function(e) {
              if (e.target.closest('.idea-close-btn')) return;
              e.preventDefault();
              e.stopPropagation();

              var input = document.createElement('input');
              input.type = 'text';
              input.className = 'note-edit-input';
              input.value = idea.text;
              input.style.cssText = 'font-size:12px;flex:1;word-break:break-word;line-height:1.5;';
              ideaItem.replaceChild(input, ideaText);
              input.focus();
              input.select();

              var saved = false;
              function saveInline() {
                if (saved) return;
                saved = true;
                var newText = input.value.trim();
                if (newText && newText !== idea.text) {
                  // 直接写 localStorage，不触发 render（tooltip 保持不动）
                  var raw = localStorage.getItem(STORAGE_KEY);
                  if (raw) {
                    try {
                      var notes = JSON.parse(raw);
                      var target = notes.find(function(n) { return String(n.id) === String(note.id); });
                      if (target && target.attachedIdeas) {
                        var ideaObj = target.attachedIdeas.find(function(i) { return String(i.id) === String(idea.id); });
                        if (ideaObj) {
                          ideaObj.text = newText;
                          localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
                          _notesCache = null;
                          _notesCacheRaw = null;
                          idea.text = newText;
                          ideaText.textContent = newText;
                        }
                      }
                    } catch(_) {}
                  }
                }
                if (input.parentElement) ideaItem.replaceChild(ideaText, input);
              }
              function cancelInline() {
                if (saved) return;
                saved = true;
                if (input.parentElement) ideaItem.replaceChild(ideaText, input);
              }

              input.addEventListener('keydown', function(ev) {
                if (ev.key === 'Enter') { ev.preventDefault(); saveInline(); }
                else if (ev.key === 'Escape') { ev.preventDefault(); cancelInline(); }
              });
              input.addEventListener('blur', saveInline);
            });

            // × 删除按钮

            closeBtn.className = 'idea-close-btn';
            closeBtn.innerHTML = '×';
            closeBtn.title = '删除此备注';
            closeBtn.addEventListener('click', async function(e) {
              e.stopPropagation();

              deleteAttachedIdea(note.id, idea.id);

            ideaItem.appendChild(closeBtn);

            // 右键菜单
            ideaItem.addEventListener('contextmenu', function(e) {
              e.preventDefault();
              e.stopPropagation();
              showAttachedIdeaContextMenu(note.id, idea.id, idea.text, e.clientX, e.clientY);

            // 拖拽支持（拖到想法抽屉或其他待办）

            ideaItem.addEventListener('dragstart', function(e) {

                noteId: note.id,

              e.dataTransfer.setData('text/x-attached-idea', data);
              e.dataTransfer.effectAllowed = 'move';
            });

            ideasContainer.appendChild(ideaItem);
          });
          tooltip.appendChild(ideasContainer);

          let tooltipPinned = false;

          function positionTooltip() {
            const badgeRect = ideaBadge.getBoundingClientRect();
            const tooltipRect = tooltip.getBoundingClientRect();
            let left = badgeRect.left;
            let top = badgeRect.bottom + 4;
            if (left + tooltipRect.width > window.innerWidth - 8) {
              left = window.innerWidth - tooltipRect.width - 8;
            }
            if (left < 8) left = 8;
            if (top + tooltipRect.height > window.innerHeight - 8) {
              top = badgeRect.top - tooltipRect.height - 4;
            }
            if (top < 8) top = 8;
            tooltip.style.left = left + 'px';
            tooltip.style.top = top + 'px';
          }

          function showTooltipPinned() {
            tooltip.style.display = 'block';
            if (!tooltip.parentElement) document.body.appendChild(tooltip);
            positionTooltip();
            tooltipPinned = true;
            setTimeout(() => {
              document.addEventListener('mousedown', onPinnedTooltipOutside);
            }, 0);
          }

          function hideTooltipPinned() {
            tooltip.style.display = 'none';
            tooltipPinned = false;
            document.removeEventListener('mousedown', onPinnedTooltipOutside);
          }

          function onPinnedTooltipOutside(e) {

              hideTooltipPinned();
            }
          }

          ideaBadge.addEventListener('click', (e) => {
            e.stopPropagation();
            e.preventDefault();
            if (tooltipPinned) {
              hideTooltipPinned();
            } else {
              showTooltipPinned();
            }
          });

          ideaBadge.style.cursor = 'pointer';
          ideaBadge.addEventListener('mousedown', (e) => {
            e.stopPropagation();
          });

          tooltip.addEventListener('mousedown', (e) => {
            e.stopPropagation();
          });
          tooltip.addEventListener('click', (e) => {

          });

        // 待办复选框

          checkbox.innerHTML = `<svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg><svg class="dash-icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="4" stroke-linecap="round"><line x1="6" y1="12" x2="18" y2="12"></line></svg>`;
          checkbox.addEventListener('mousedown', (e) => {
            e.stopPropagation();
          });
          checkbox.addEventListener('click', (e) => {

        // 待办/里程碑可作为备注接收目标（支持拖放想法）

          item.addEventListener('dragover', (e) => {

            // 待办拖到另一个待办文字上（将成为子待办，使用全局变量，dragover期间可靠）
            if (note.type === 'todo' && _draggedNoteType === 'todo' && _draggedNoteId && String(_draggedNoteId) !== String(note.id) && e.target.closest('.note-text')) {
              if (!_draggedNoteHasSubTodos) {
                e.preventDefault();
                e.stopPropagation();
                item.classList.add('sub-todo-receiving');

              }
            }
            // 想法拖到待办/里程碑上

              e.preventDefault();
              item.classList.add('idea-drop-target');
              return;
            }
            // 待办拖到里程碑上
            if (note.type === 'goal' && _draggedNoteType === 'todo' && _draggedNoteId && String(_draggedNoteId) !== String(note.id)) {
              e.preventDefault();
              item.classList.add('todo-drop-target');
              return;
            }
            // 草稿拖入（部分浏览器在dragover期间可用getData）
            const draftId = e.dataTransfer.getData('text/x-pending-draft-id');
            if (draftId) {
              e.preventDefault();
              item.classList.add('idea-drop-target');
            }
            // 备注想法拖到待办/里程碑上
            if (e.dataTransfer.types.includes('text/x-attached-idea')) {
              e.preventDefault();
              item.classList.add('idea-drop-target');
            }
          });
          item.addEventListener('dragleave', (e) => {

            var attachedIdeaData = e.dataTransfer.getData('text/x-attached-idea');
            if (attachedIdeaData) {
              e.preventDefault();
              e.stopPropagation();
              try {
                var parsed = JSON.parse(attachedIdeaData);
                if (parsed.type === 'attachedIdea' && String(parsed.noteId) !== String(note.id)) {
                  moveAttachedIdea(parsed.noteId, parsed.ideaId, note.id);
                  return;
                }
              } catch(_) {}
            }
            const droppingOnTodoText = !!e.target.closest('.note-text');
            const draggedTodoId = e.dataTransfer.getData('text/x-note-id') || e.dataTransfer.getData('text/plain');
            const draggedSubTodoId = e.dataTransfer.getData('text/x-sub-todo-id');
            const isTodoOrSubTodoDrop = (draggedTodoId || draggedSubTodoId) && (note.type === 'todo' || note.type === 'goal');
            if (note.type === 'todo' && isTodoOrSubTodoDrop && !droppingOnTodoText && _draggedNoteType !== 'idea') {
              return;
            }
            e.preventDefault();
            e.stopPropagation();
            const draftId = e.dataTransfer.getData('text/x-pending-draft-id');
            if (draftId) {
              attachPendingDraftToNote(draftId, note.id);
              return;
            }
            if (note.type === 'todo') {
              const subTodoId = e.dataTransfer.getData('text/x-sub-todo-id');
              const subParentId = e.dataTransfer.getData('text/x-sub-parent-id');
              if (subTodoId && subParentId) {
                moveSubTodoToTodo(subParentId, subTodoId, note.id);
                return;
              }
            }
            if (note.type === 'goal') {
              const subTodoId = e.dataTransfer.getData('text/x-sub-todo-id');
              const subParentId = e.dataTransfer.getData('text/x-sub-parent-id');
              if (subTodoId && subParentId) {
                promoteSubTodoToTodo(subParentId, subTodoId, note.projectId, note.id);
                return;
              }
            }
            const ideaId = draggedTodoId;
            if (ideaId && String(ideaId) !== String(note.id)) {
              const notes = loadNotes();
              const idea = notes.find(n => String(n.id) === String(ideaId));
              if (idea && idea.type === 'idea') {
                attachIdeaAsNote(note.id, ideaId);
                render();
              } else if (note.type === 'goal' && idea && idea.type === 'todo') {
                idea.parentGoalId = note.id;
                if (note.projectId) idea.projectId = note.projectId;
                saveNotes(notes);
                render();
              } else if (note.type === 'todo' && idea && idea.type === 'todo') {
                moveTodoToSubTodo(ideaId, note.id);
              }
            }
          });
        }

        // 所有记录都可拖拽（用于拖到左侧项目归类 / 拖到周视图日期）

        item.addEventListener('dragstart', (e) => {

        const menu = document.createElement('div');

        typeSection.appendChild(typeTitle);
        const typeOptions = document.createElement('div');
        typeOptions.className = 'menu-options';

          typeOptions.appendChild(goalBtn);
        }

        const ideaBtn = document.createElement('button');
        ideaBtn.className = `menu-type-btn idea ${noteType === 'idea' ? 'active' : ''}`;
        ideaBtn.textContent = t('想法');
        ideaBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          setNoteType(note.id, 'idea');
        });

        const todoBtn = document.createElement('button');
        todoBtn.className = `menu-type-btn todo ${noteType === 'todo' ? 'active' : ''}`;
        todoBtn.textContent = t('待办');
        todoBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          setNoteType(note.id, 'todo');
        });

        typeOptions.appendChild(ideaBtn);
        typeOptions.appendChild(todoBtn);
        typeSection.appendChild(typeOptions);

        if (noteType) {

            e.stopPropagation();
            toggleNextAction(note.id);
          });
          menu.appendChild(nextBtn);

          // 重复设置（打开编辑弹窗，含文字编辑 + 重复配置）

          recurrenceBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            menu.classList.remove('show');
            item.classList.remove('menu-open');
            setTimeout(() => { if (menu.parentElement === document.body) menu.remove(); }, 150);

          });
          menu.appendChild(recurrenceBtn);
        }

        if (noteType === 'goal') {
          const currentBtn = document.createElement('button');
          currentBtn.className = 'menu-project-item';
          currentBtn.textContent = note.isCurrentGoal ? t('取消当前里程碑') : t('标为当前里程碑');

        const divider = document.createElement('div');
        divider.className = 'menu-divider';

        const projectTitle = document.createElement('div');

        projectTitle.style.padding = '0 8px';

        const dragHint = document.createElement('div');

        dragHint.textContent = t('建议直接拖到左侧项目、里程碑或右侧时间轴。');

        const visibleProjects = getAssignableProjects(projects);

          const projectBtn = document.createElement('button');
          projectBtn.className = 'menu-project-item' + (String(note.projectId) === String(project.id) ? ' active' : '');

          const dot = document.createElement('span');
          dot.className = 'menu-project-dot';
          dot.style.backgroundColor = project.color || '#64748B';

          const name = document.createElement('span');
          name.textContent = project.name;

          projectBtn.addEventListener('click', (e) => {

        // 将菜单移到 body，避免被里程碑的 backdrop-filter 创建的包含块和 overflow:hidden 裁切
        function _relocateMenuToBody() {
          document.querySelectorAll('body > .note-menu').forEach(m => {
            if (m !== menu) {
              m.classList.remove('show');
              setTimeout(() => {
                if (!m.classList.contains('show') && m.parentElement === document.body) {
                  m.remove();
                }
              }, 150);
            }
          });
          if (menu.parentElement !== document.body) {
            document.body.appendChild(menu);
          }
        }

        menuBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          const isOpen = menu.classList.contains('show');
          document.querySelectorAll('.note-menu.show').forEach(m => m.classList.remove('show'));
          document.querySelectorAll('.note-item.menu-open').forEach(m => m.classList.remove('menu-open'));
          if (!isOpen) {
            _relocateMenuToBody();
            menu.classList.add('show');
            item.classList.add('menu-open');
            const btnRect = menuBtn.getBoundingClientRect();
            const menuRect = menu.getBoundingClientRect();
            let top = btnRect.top + btnRect.height / 2 - menuRect.height / 2;
            let left = btnRect.right + 4;
            if (left + menuRect.width > window.innerWidth - 10) {
              left = btnRect.left - menuRect.width - 4;
            }
            if (left < 10) left = 10;
            if (top < 10) top = 10;
            if (top + menuRect.height > window.innerHeight - 10) {
              top = window.innerHeight - menuRect.height - 10;
            }
            menu.style.top = top + 'px';
            menu.style.left = left + 'px';
          }
        });

        menu.addEventListener('mouseleave', closeMenu);

        // 右键也显示菜单
        item.addEventListener('contextmenu', (e) => {
          if (e.target.closest('.sub-todo-item') || e.target.closest('.sub-todo-list')) return;
          e.preventDefault();
          e.stopPropagation();
          document.querySelectorAll('.note-menu.show').forEach(m => m.classList.remove('show'));
          document.querySelectorAll('.note-item.menu-open').forEach(m => m.classList.remove('menu-open'));
          _relocateMenuToBody();
          menu.classList.add('show');
          item.classList.add('menu-open');
          const menuRect = menu.getBoundingClientRect();
          let top = e.clientY;
          let left = e.clientX + 4;
          if (left + menuRect.width > window.innerWidth - 10) {
            left = window.innerWidth - menuRect.width - 10;
          }
          if (left < 10) left = 10;
          if (top + menuRect.height > window.innerHeight - 10) {
            top = window.innerHeight - menuRect.height - 10;
          }
          if (top < 10) top = 10;
          menu.style.top = top + 'px';
          menu.style.left = left + 'px';
        });

        actions.appendChild(menuBtn);
        // 所有类型：三点菜单放在文字流里，紧跟文字末尾
        text.appendChild(actions);
      }

      // 把第一行容器加入 item
      item.appendChild(mainRow);

      item.addEventListener('dblclick', (e) => {

        if (e.target.closest('.sub-todo-item')) return;
        if (e.target.closest('.sub-todo-list')) return;
        e.preventDefault();
        e.stopPropagation();
        window.getSelection().removeAllRanges();
        startEdit(note.id);
      });

      // 子待办展开/收起状态
      const hasSubTodos = note.type === 'todo' && note.subTodos && note.subTodos.length > 0;
      const isAddingSubTodo = subTodoAddingParentId === String(note.id);
      const showSubTodos = hasSubTodos || isAddingSubTodo;
      const subTodosExpandedKey = 'subtodo-expanded-' + note.id;
      let subTodosExpanded = localStorage.getItem(subTodosExpandedKey);
      if (subTodosExpanded === null) subTodosExpanded = '1';
      subTodosExpanded = subTodosExpanded === '1';

      // 如果正在添加子待办，自动展开
      if (isAddingSubTodo && !subTodosExpanded) {
        subTodosExpanded = true;
        localStorage.setItem(subTodosExpandedKey, '1');
      }

      // 点击父待办展开/收起子待办（有子待办或正在添加时）
      if (note.type === 'todo' && (hasSubTodos || isAddingSubTodo) && !isEditing) {

          if (e.target.closest('.todo-checkbox')) return;
          if (e.target.closest('.note-action')) return;
          if (e.target.closest('.note-menu')) return;
          if (e.target.closest('.sub-todo-item')) return;
          if (e.target.closest('.sub-todo-list')) return;
          if (e.target.closest('.note-edit-input')) return;
          
          const newExpanded = !subTodosExpanded;
          localStorage.setItem(subTodosExpandedKey, newExpanded ? '1' : '0');
          render();
        });
      }

      // 子待办列表
      if (note.type === 'todo' && showSubTodos && subTodosExpanded) {
        const subTodoList = document.createElement('div');
        subTodoList.className = 'sub-todo-list';

        const displaySubTodos = note.subTodos || [];
        displaySubTodos.forEach(subTodo => {
          const subItem = document.createElement('div');
          subItem.className = 'sub-todo-item';
          if (subTodo.completed) subItem.classList.add('completed');
          subItem.dataset.subTodoId = subTodo.id;
          subItem.dataset.parentTodoId = note.id;

          const isEditingSub = editingSubTodoId === subTodo.id && String(editingSubTodoParentId) === String(note.id);

          // 编辑模式下禁用拖拽，以便鼠标拖选复制文本
          subItem.draggable = !isEditingSub;
          subItem.addEventListener('dragstart', (e) => {

            e.dataTransfer.setData('text/x-sub-parent-id', String(note.id));
            e.dataTransfer.setData('text/plain', String(subTodo.id));
            subItem.classList.add('dragging');
            _draggedNoteType = 'sub-todo';
          });
          subItem.addEventListener('dragend', () => {

            draggingSubTodoId = null;

                exitSubTodoEdit();

            }
          });
          subMenu.addEventListener('mouseleave', closeSubMenu);
          if (subText) {
            subText.appendChild(subMenuBtn);
          }
          subItem.appendChild(subMenu);

          // 右键也显示子待办菜单
          subItem.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            e.stopPropagation();
            document.querySelectorAll('.note-menu.show').forEach(m => {
              m.classList.remove('show');
              if (m.classList.contains('sub-todo-menu') && m.parentElement === document.body) {
                m.remove();
              }
            });
            document.body.appendChild(subMenu);
            subMenu.dataset.originalParent = subTodo.id;
            subMenu.classList.add('show');
            subMenu.style.top = e.clientY + 'px';
            subMenu.style.left = (e.clientX + 4) + 'px';
          });

          subTodoList.appendChild(subItem);
        });

        // 子待办列表内部拖拽排序 + 跨父待办拖入显示占位符
        subTodoList.addEventListener('dragover', (e) => {
          const subParentId = draggingSubTodoParentId || e.dataTransfer.getData('text/x-sub-parent-id');
          if (subParentId && String(subParentId) === String(note.id)) {
            // 同一个父待办下的子待办重排序
            e.preventDefault();
            e.stopPropagation();
            _removeMilestonePlaceholder(true);
            const draggingItem = subTodoList.querySelector('.sub-todo-item.dragging');
            if (!draggingItem) return;
            const afterElement = getDragAfterElement(subTodoList, e.clientY, '.sub-todo-item:not(.dragging)');
            if (afterElement == null) {
              subTodoList.appendChild(draggingItem);
            } else {
              subTodoList.insertBefore(draggingItem, afterElement);
            }
          } else if (_draggedNoteType === 'sub-todo') {
            // 跨父待办拖入：显示占位符
            e.preventDefault();
            e.stopPropagation();
            const afterElement = getDragAfterElement(subTodoList, e.clientY, '.sub-todo-item:not(.dragging)');
            _showMilestonePlaceholder(subTodoList, afterElement);
          }
        });

        subTodoList.addEventListener('drop', (e) => {
          _removeMilestonePlaceholder(true);
          const subTodoId = draggingSubTodoId || e.dataTransfer.getData('text/x-sub-todo-id');
          const subParentId = draggingSubTodoParentId || e.dataTransfer.getData('text/x-sub-parent-id');

          // 同一个父待办下的子待办重排序
          if (subTodoId && subParentId && String(subParentId) === String(note.id)) {
            e.preventDefault();
            e.stopPropagation();
            const items = Array.from(subTodoList.querySelectorAll('.sub-todo-item'));
            const newOrderIds = items.map(el => String(el.dataset.subTodoId));

            const notes = loadNotes();
            const parent = notes.find(n => String(n.id) === String(note.id));
            if (parent && parent.subTodos) {
              // 按照新顺序重新排列 subTodos 数组
              const newSubTodos = [];
              newOrderIds.forEach(id => {
                const sub = parent.subTodos.find(s => String(s.id) === String(id));
                if (sub) newSubTodos.push(sub);
              });
              // 确保没有遗漏（以防万一）
              parent.subTodos.forEach(sub => {
                if (!newSubTodos.find(s => String(s.id) === String(sub.id))) {
                  newSubTodos.push(sub);
                }
              });
              parent.subTodos = newSubTodos;
              saveNotes(notes);
              render();
            }
            return;
          }

          // 其他待办的子待办拖入 -> 移动到当前待办的子待办列表
          if (subTodoId && subParentId && String(subParentId) !== String(note.id)) {
            e.preventDefault();
            e.stopPropagation();
            moveSubTodoToTodo(subParentId, subTodoId, note.id);
            return;
          }

          // 独立待办拖入子待办列表 -> 转为子待办
          const noteId = e.dataTransfer.getData('text/x-note-id');
          if (noteId && !e.dataTransfer.types.includes('text/x-sub-todo-id') && !e.dataTransfer.types.includes('text/x-goal-id')) {
            e.preventDefault();
            e.stopPropagation();
            moveTodoToSubTodo(noteId, note.id);
            return;
          }
        });

        item.appendChild(subTodoList);
      }

      return item;
    }

    function getWeekDates(baseDate) {
      const base = baseDate ? new Date(baseDate) : new Date();
      const day = base.getDay();
      const mondayOffset = day === 0 ? -6 : 1 - day;
      const monday = new Date(base);
      monday.setDate(base.getDate() + mondayOffset);
      const dates = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(monday);
        d.setDate(monday.getDate() + i);
        dates.push(toDateKey(d));
      }
      return dates;
    }

    function getMonthDates(year, month) {
      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      const startWeekday = firstDay.getDay();
      const mondayOffset = startWeekday === 0 ? -6 : 1 - startWeekday;
      const startDate = new Date(year, month, 1 + mondayOffset);
      const dates = [];
      for (let i = 0; i < 42; i++) {
        const d = new Date(startDate);
        d.setDate(startDate.getDate() + i);
        dates.push(toDateKey(d));
      }
      return dates;
    }

    function buildSleepHours(start, end) {
      const hours = [];
      if (start > end) {
        for (let h = start; h < 24; h++) hours.push(h);
        for (let h = 0; h < end; h++) hours.push(h);
      } else {
        for (let h = start; h < end; h++) hours.push(h);
      }
      return hours;
    }

    // 右侧日历渲染（默认 rAF 节流，避免短时间内反复重建 DOM 导致卡顿）
    let _weekViewRafId = null;
    function renderWeekView(immediate) {
      if (immediate) {
        if (_weekViewRafId !== null) {
          cancelAnimationFrame(_weekViewRafId);
          _weekViewRafId = null;
        }
        _renderWeekViewImpl();
        return;
      }
      if (_weekViewRafId !== null) return;
      _weekViewRafId = requestAnimationFrame(() => {
        _weekViewRafId = null;
        _renderWeekViewImpl();
      });
    }

    function renderDayView(todos, todayKey, weekdays) {

      const dayTodos = todos.filter(t => t.scheduledDate === viewDate);
      const allDayTodos = dayTodos.filter(t => !t.scheduledTime).sort((a, b) => {
        const aOrder = a.order != null ? a.order : (a.timestamp || 0);

      const timedTodos = dayTodos.filter(t => t.scheduledTime);

      const allDaySection = document.createElement('div');

      allDayTodos.forEach(todo => {

        if (handleSubTodoCalendarDrop(e, viewDate, null, null)) return;

        if (noteId) {
          const notes = loadNotes();
          const note = notes.find(n => String(n.id) === String(noteId));
          if (note) {
            note.scheduledDate = viewDate;
            delete note.scheduledTime;
            // 如果来自时间骨架或打卡，安排后自动移除
            if (note.projectId === ANCHOR_ID || note.projectId === CHECKIN_ID) {

      const timeAxis = document.createElement('div');
      timeAxis.className = 'time-axis';

      const now = new Date();
      const currentHour = now.getHours();
      const currentMinute = now.getMinutes();

      function buildTimeSlot(hour) {
        const slot = document.createElement('div');
        slot.className = 'time-slot';
        if (isToday && hour === currentHour) {
          slot.classList.add('current-hour');
        }

        const label = document.createElement('span');
        label.className = 'time-label';
        label.textContent = pad(hour) + ':00';
        slot.appendChild(label);

        const content = document.createElement('div');
        content.className = 'time-slot-content';
        slot.appendChild(content);

        slot.addEventListener('contextmenu', (e) => {
          if (e.target.closest('.time-slot-todo')) return;
          e.preventDefault();
          e.stopPropagation();
          showCalendarContextMenu(viewDate, e.clientX, e.clientY);
        });

        slot.addEventListener('dragover', (e) => {
          e.preventDefault();
          content.classList.add('drag-over');
        });
        slot.addEventListener('dragleave', () => {
          content.classList.remove('drag-over');
        });
        slot.addEventListener('drop', (e) => {
          e.preventDefault();
          content.classList.remove('drag-over');
          const slotRect = slot.getBoundingClientRect();
          const y = e.clientY - slotRect.top;
          const totalHeight = slotRect.height;
          const minuteOffset = Math.round((y / totalHeight) * 60 / 15) * 15;
          const finalHour = Math.min(hour + Math.floor(minuteOffset / 60), 23);
          const finalMinute = minuteOffset % 60;
          const finalTime = pad(finalHour) + ':' + pad(finalMinute);
          if (handleSubTodoCalendarDrop(e, viewDate, finalTime, 30)) return;
          const noteId = e.dataTransfer.getData('text/x-note-id') || e.dataTransfer.getData('text/plain');

                note.projectId = null;
              }
              saveNotes(notes);
              render();
            }
          }
        });

        return slot;

      const sleepHours = buildSleepHours(sleepStartHour, sleepEndHour);
      const sleepTodosCount = dayTodos.filter(t => {
        if (!t.scheduledTime) return false;
        const h = parseInt(t.scheduledTime.split(':')[0], 10);
        return sleepHours.includes(h);

      const awakeHours = [];
      for (let h = 0; h < 24; h++) {

      awakeHours.forEach(hour => {

        const startHourIndex = awakeHours.indexOf(startHour);
        const endHourIndex = awakeHours.indexOf(endHour);
        if (startHourIndex === -1 || endHourIndex === -1) return;

        const top = startHourIndex * 44 + (startMinute / 60) * 44;
        const height = (endHourIndex - startHourIndex) * 44 + ((endMinute - startMinute) / 60) * 44;

        const bgBlock = document.createElement('div');
        bgBlock.className = 'skeleton-bg-block';
        bgBlock.style.top = top + 'px';
        bgBlock.style.height = height + 'px';

        if (block.categoryId) {

          }

        const textEl = document.createElement('span');
        textEl.className = 'skeleton-bg-block-text';
        textEl.textContent = block.title;
        bgBlock.appendChild(textEl);

        skeletonBgLayer.appendChild(bgBlock);
      });

      timeAxis.appendChild(skeletonBgLayer);
      }

      const todosLayer = document.createElement('div');
      todosLayer.className = 'day-todos-layer';

      // 按 duration 降序排序，长块先渲染在底层，短块后渲染在上层
      const sortedTimedTodos = [...timedTodos].sort((a, b) => (b.duration || 60) - (a.duration || 60));

      if (sortedTimedTodos.length > 1) {
        console.log('[时间块排序] sorted:', sortedTimedTodos.map(t => ({ id: t.id, text: t.text, duration: t.duration, time: t.scheduledTime })));

      sortedTimedTodos.forEach(todo => {
        const h = parseInt(todo.scheduledTime.split(':')[0], 10);
        const m = parseInt(todo.scheduledTime.split(':')[1], 10) || 0;
        const hourIndex = awakeHours.indexOf(h);
        if (hourIndex === -1) return;

        const li = document.createElement('div');
        li.className = 'time-todo-item';
        if (todo.completed) li.classList.add('completed');
        if (todo.inProgress && !todo.completed) li.classList.add('in-progress');
        li.style.position = 'absolute';
        li.style.left = '0.5px';
        li.style.right = '0.5px';
        li.style.marginBottom = '0';

        const projectColor = getProjectColor(todo.projectId);
        li.style.backgroundColor = projectColor + '99';
        li.style.borderLeftColor = projectColor;
        li.style.setProperty('--todo-accent-color', projectColor);

        const duration = todo.duration || 60;
        li.title = '';
        const top = hourIndex * 44 + (m / 60) * 44;
        const height = Math.max(22, (duration / 60) * 44);
        li.style.top = top + 'px';
        li.style.height = height + 'px';
        li.style.minHeight = height + 'px';
        // 短块 z-index 更高，确保不被长块覆盖
        li.style.zIndex = lastMovedTodoId && String(todo.id) === lastMovedTodoId ? '5'
          : todo.completed ? '0'
          : String(10 - Math.min(9, Math.floor(duration / 60)));
        console.log('[时间块z-index]', todo.text, 'duration:', duration, 'z:', li.style.zIndex, 'top:', top, 'height:', height);

    function startCalendarTodoDrag(e, li, todo, columns, awakeHours, originDateKey) {
      e.preventDefault();
      e.stopPropagation();

      const liRect = li.getBoundingClientRect();
      const offsetY = e.clientY - liRect.top;
      const _parent = columns[0].element.parentElement;
      const _slot = _parent.querySelector('.time-slot, .week-time-cell');
      const HOUR_PX = _slot ? _slot.offsetHeight : 44;
      const MIN_PER_PX = 60 / HOUR_PX;

      // ghost 本身就是落点指示：吸附到目标列的 15 分钟网格上，所见即所落
      const ghost = document.createElement('div');
      ghost.className = 'week-drag-ghost';
      ghost.style.height = liRect.height + 'px';
      const projectColor = li.style.borderLeftColor || '#2563EB';
      ghost.style.backgroundColor = projectColor + '55';
      ghost.style.borderLeft = '3px solid ' + projectColor;
      ghost.style.borderRadius = '8px';
      ghost.style.padding = '3px 8px';
      ghost.style.fontSize = '13px';
      ghost.style.color = '#fff';
      ghost.style.display = 'none';
      ghost.style.alignItems = 'center';
      ghost.style.overflow = 'hidden';
      ghost.style.whiteSpace = 'nowrap';
      ghost.style.textOverflow = 'ellipsis';
      ghost.style.flexDirection = 'column';
      ghost.style.alignItems = 'flex-start';
      ghost.style.gap = '1px';
      const ghostText = document.createElement('span');
      ghostText.textContent = todo.text;
      ghostText.style.whiteSpace = 'nowrap';
      ghostText.style.overflow = 'hidden';
      ghostText.style.textOverflow = 'ellipsis';
      ghostText.style.maxWidth = '100%';
      ghost.appendChild(ghostText);
      ghost.style.left = '-9999px';
      ghost.style.top = '-9999px';
      document.body.appendChild(ghost);

      const durationMin = Math.round(liRect.height / HOUR_PX * 60);

      li.classList.add('dragging');
      document.body.style.cursor = 'grabbing';
      document.body.style.userSelect = 'none';

      let dragStarted = false;
      let targetColumn = null;
      let targetHour = null;
      let targetMinute = null;
      let rafId = null;

      function findColumn(x) {
        for (const col of columns) {
          if (x >= col.rect.left && x <= col.rect.right) return col;
        }
        let nearest = null;
        let nearestDist = Infinity;
        for (const col of columns) {
          const cx = (col.rect.left + col.rect.right) / 2;
          const d = Math.abs(x - cx);
          if (d < nearestDist) { nearestDist = d; nearest = col; }
        }
        return nearest;
      }

      function onMove(ev) {
        const dx = ev.clientX - e.clientX;
        const dy = ev.clientY - e.clientY;
        if (!dragStarted && Math.hypot(dx, dy) < 4) return;
        dragStarted = true;

        const col = findColumn(ev.clientX);
        if (!col) return;
        targetColumn = col;

        const colRect = col.rect;
        let yInCol = ev.clientY - colRect.top - offsetY;

        const awakeHeight = awakeHours.length * HOUR_PX;
        const maxY = awakeHeight - liRect.height;
        yInCol = Math.max(0, Math.min(yInCol, maxY));

        const minutesFromTop = yInCol * MIN_PER_PX;
        let hourIndex = Math.floor(minutesFromTop / 60);
        let minuteInHour = minutesFromTop - hourIndex * 60;
        let snappedMinute = Math.round(minuteInHour / 15) * 15;
        if (snappedMinute >= 60) { hourIndex += 1; snappedMinute = 0; }
        if (hourIndex >= awakeHours.length) { hourIndex = awakeHours.length - 1; snappedMinute = 45; }
        if (hourIndex < 0) { hourIndex = 0; snappedMinute = 0; }

        targetHour = awakeHours[hourIndex];
        targetMinute = snappedMinute;

        const endTotalMin = targetHour * 60 + targetMinute + durationMin;
        const endH = Math.floor(endTotalMin / 60);
        const endM = endTotalMin % 60;

        const snappedTop = hourIndex * HOUR_PX + (snappedMinute / 60) * HOUR_PX;
        const newLeft = colRect.left + 'px';
        const newTop = (colRect.top + snappedTop) + 'px';
        const newWidth = colRect.width + 'px';

        if (rafId) cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(() => {
          ghost.style.left = newLeft;
          ghost.style.top = newTop;
          ghost.style.width = newWidth;
          ghost.style.display = 'flex';
        });
      }

      function onUp() {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        if (rafId) { cancelAnimationFrame(rafId); rafId = null; }

        ghost.remove();
        li.classList.remove('dragging');
        document.body.style.cursor = '';
        document.body.style.userSelect = '';

        if (dragStarted && targetColumn && targetHour !== null) {
          const newDateKey = targetColumn.dateKey;
          const newTime = pad(targetHour) + ':' + pad(targetMinute);
          if (newDateKey !== originDateKey || newTime !== todo.scheduledTime) {
            const notes = loadNotes();
            const note = notes.find(n => String(n.id) === String(todo.id));
            if (note) {
              note.scheduledDate = newDateKey;
              note.scheduledTime = newTime;
              if (note.projectId === ANCHOR_ID || note.projectId === CHECKIN_ID) {
                note.projectId = null;
              }
              saveNotes(notes);
              lastMovedTodoId = String(todo.id);
              localStorage.setItem('zhixing-last-moved-todo', lastMovedTodoId);
              render();
              renderWeekView(true);
            }
          }
        }
      }

      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    }

    function renderWeekTimeView(todos, todayKey, weekdays) {
      let baseDate = new Date();
      if (selectedDate) { const [y, m, d] = selectedDate.split('-').map(Number); baseDate = new Date(y, m - 1, d); }
      const weekDates = getWeekDates(baseDate);
      const sleepHours = buildSleepHours(sleepStartHour, sleepEndHour);
      const awakeHours = [];
      for (let h = 0; h < 24; h++) {
        if (!sleepHours.includes(h)) awakeHours.push(h);
      }
      awakeHours.sort((a, b) => a - b);

      const weekNav = document.createElement('div');
      weekNav.className = 'day-view-date';

      const prevWeekBtn = document.createElement('button');
      prevWeekBtn.className = 'date-nav-btn';
      prevWeekBtn.textContent = '‹';
      prevWeekBtn.title = t('上一周');
      prevWeekBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const prev = new Date(baseDate);
        prev.setDate(prev.getDate() - 7);
        selectedDate = toDateKey(prev);
        renderWeekView();
      });

      const nextWeekBtn = document.createElement('button');
      nextWeekBtn.className = 'date-nav-btn';
      nextWeekBtn.textContent = '›';
      nextWeekBtn.title = t('下一周');
      nextWeekBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const next = new Date(baseDate);
        next.setDate(next.getDate() + 7);
        selectedDate = toDateKey(next);
        renderWeekView();

          li.style.top = top + 'px';
          li.style.height = height + 'px';

          const topResizeHandle = document.createElement('div');

          li.appendChild(content);
