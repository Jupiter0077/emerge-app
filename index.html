    // 想法气泡输入（添加/编辑共用，微信/短信风格，定位到待办旁边）
    function showIdeaBubble(mode, parentId, ideaId, ideaText) {
      document.querySelectorAll('.idea-bubble').forEach(b => b.remove());

      var bubble = document.createElement('div');
      bubble.className = 'idea-bubble';

      var input = document.createElement('textarea');
      input.className = 'idea-bubble-textarea';
      input.placeholder = t('想法…');
      input.value = mode === 'edit' ? ideaText : '';
      input.rows = 1;
      bubble.appendChild(input);

      var sendBtn = document.createElement('button');
      sendBtn.className = 'idea-bubble-send';
      sendBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>';
      bubble.appendChild(sendBtn);

      document.body.appendChild(bubble);

      // 自动高度
      function autoResize() {
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 100) + 'px';
      }
      input.addEventListener('input', autoResize);

      // 定位到待办的 ⋯ 按钮处
      var todoEl = document.querySelector('.note-item[data-note-id="' + parentId + '"]');
      var anchorEl = todoEl ? todoEl.querySelector('.note-action.menu') : null;
      var bubbleRect = bubble.getBoundingClientRect();
      var left, top;

      if (anchorEl) {
        var rect = anchorEl.getBoundingClientRect();
        var bw = bubbleRect.width;
        var bh = bubbleRect.height;

        // 优先右侧
        if (rect.right + 14 + bw <= window.innerWidth - 10) {
          left = rect.right + 14;
          top = rect.top + rect.height / 2 - bh / 2;
          bubble.classList.add('tail-left');
        } else {
          // 下方
          left = rect.left;
          top = rect.bottom + 14;
          bubble.classList.add('tail-top');
        }

        // 视口修正
        if (left + bw > window.innerWidth - 10) left = window.innerWidth - bw - 10;
        if (top + bh > window.innerHeight - 10) top = Math.max(10, rect.top - bh - 14);
        if (left < 10) left = 10;
        if (top < 10) top = 10;
      } else {
        left = (window.innerWidth - bubbleRect.width) / 2;
        top = (window.innerHeight - bubbleRect.height) / 2;
      }

      bubble.style.left = left + 'px';
      bubble.style.top = top + 'px';

      input.focus();
      if (mode === 'edit') input.select();
      setTimeout(autoResize, 0);

      var submitted = false;
      function closeBubble() {
        bubble.classList.add('closing');
        setTimeout(function() { bubble.remove(); }, 300);
      }
      function submit() {
        if (submitted) return;
        submitted = true;
        var text = input.value.trim();
        closeBubble();
        if (text) {
          setTimeout(function() {
            if (mode === 'add') commitIdeaToTodo(parentId, text);
            else editAttachedIdea(parentId, ideaId, text);
          }, 300);
        }
      }
      function cancel() {
        if (submitted) return;
        submitted = true;
        closeBubble();
      }

      sendBtn.addEventListener('click', submit);
      input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); }
        else if (e.key === 'Escape') { e.preventDefault(); cancel(); }
      });

      setTimeout(function() {
        document.addEventListener('mousedown', function closeOnOutside(e) {
          if (!bubble.contains(e.target)) {
            cancel();
            document.removeEventListener('mousedown', closeOnOutside);
          }
        });
      }, 0);
    }

    // 判断循环待办是否已结束循环
    function isRecurrenceEnded(note) {
      if (!note.recurrence) return true;
      const r = note.recurrence;
      if (!r.type) return true;
      if (r.type === 'count') {
        return (r.completedCount || 0) >= (r.count || 0);
      }
      if (r.type === 'daily') {
        if (!r.endDate) return false;
        const today = toDateKey(new Date());
        return today > r.endDate;
      }
      return true;
    }

    // 判断里程碑下的待办是否全部完成（有未结束的循环待办时不算全部完成）
    function isGoalAllTodosCompleted(goalTodos) {
      if (goalTodos.length === 0) return false;
      const allDone = goalTodos.every(t => t.completed);
      if (!allDone) return false;
      // 检查是否有未结束的循环待办
      const hasActiveRecurrence = goalTodos.some(t => {
        if (!t.recurrence || !t.recurrence.type) return false;
        return !isRecurrenceEnded(t);
      });
      return !hasActiveRecurrence;
    }

    // 待办的进度总次数：普通待办为 1
    // 按次数循环：总次数固定为设定次数
    // 按天循环：算「近期完成率」，分母 = 自添加以来应执行的次数（有结束日期时封顶为计划次数）
    function getTodoTotalCount(todo) {
      const r = todo.recurrence;
      if (!r || !r.type) return 1;
      if (r.type === 'count') return Math.max(1, r.count || 1);
      if (r.type === 'daily') {
        const interval = Math.max(1, r.dailyInterval || 1);
        // 起始日：优先用重复设置的起始日，其次用待办创建日
        const startDay = r.startDate || toDateKey(new Date(todo.timestamp || Date.now()));
        const today = toDateKey(new Date());
        const elapsedDays = Math.max(0, Math.round((new Date(today) - new Date(startDay)) / 86400000));
        const elapsedCount = Math.floor(elapsedDays / interval) + 1;
        if (!r.endDate) return elapsedCount;
        const planDays = Math.max(0, Math.round((new Date(r.endDate) - new Date(startDay)) / 86400000));
        const planCount = Math.floor(planDays / interval) + 1;
        return Math.min(elapsedCount, planCount);
      }
      return 1;
    }

    // 待办的进度已完成次数：普通待办完成为 1，循环待办为已完成循环次数（封顶总次数）
    function getTodoDoneCount(todo) {
      if (todo.recurrence && todo.recurrence.type) {
        return Math.min(todo.recurrence.completedCount || 0, getTodoTotalCount(todo));
      }
      return todo.completed ? 1 : 0;
    }

    // 「按天重复」的待办在日历上预排：只生成「起始日 ~ 今天」的实例，作为全天条目显示。
    // 未来不预排；历史某天已执行过（有执行记录）则不显示，漏做的留在当天供回看
    function buildRecurrenceInstances(notes, todayKey) {
      const DAY = 86400000;
      const instances = [];
      // 已完成记录索引：sourceId|dateKey，用于判断历史某天是否已执行过
      const doneLogKeys = new Set();
      notes.forEach(n => {
        if (n.type === 'todo-log' && n.sourceId != null && n.scheduledDate) {
          doneLogKeys.add(String(n.sourceId) + '|' + n.scheduledDate);
        }
      });
      notes.forEach(note => {
        if (note.type !== 'todo' || note.completed) return;
        const r = note.recurrence;
        if (!r || r.type !== 'daily') return;
        const interval = Math.max(1, r.dailyInterval || 1);
        const startKey = r.startDate || toDateKey(new Date(note.timestamp || Date.now()));
        if (startKey > todayKey) return; // 起始日还没到，暂无提醒
        // 只生成「起始日 ~ 今天」的实例：未来不预排，历史漏做的留在当天供回看
        const cursor = new Date(startKey + 'T00:00:00');
        let guard = 0;
        while (toDateKey(cursor) <= todayKey && guard < 400) {
          const key = toDateKey(cursor);
          const doneToday = key === todayKey && r.lastCompletedDate === key;
          const doneOnThatDay = doneLogKeys.has(String(note.id) + '|' + key);
          if (!doneToday && !doneOnThatDay && note.scheduledDate !== key) {
            instances.push(Object.assign({}, note, {
              scheduledDate: key,
              scheduledTime: null,
              duration: null,
              inProgress: false,
              inProgressStartTime: null,
              recurrenceInstance: true
            }));
          }
          cursor.setDate(cursor.getDate() + interval);
          guard++;
        }
      });
      return instances;
    }

    function toggleTodoComplete(noteId, originX, originY) {
      const _t0 = performance.now();
      const notes = loadNotes();
      const index = notes.findIndex((note) => String(note.id) === String(noteId));
      if (index === -1) return;

      const note = notes[index];
      // 循环执行日志块不参与三态切换（仅作日历历史记录）
      if (note.type === 'todo-log') return;
      const wasCompleted = note.completed;
      const wasInProgress = note.inProgress;
      const hasRecurrence = !!(note.recurrence && note.recurrence.type);

      // 三态切换：未完成 → 进行中 → 完成 → 未完成
      if (!wasCompleted && !wasInProgress) {
        // 未完成 → 进行中
        note.inProgress = true;
        note.inProgressStartTime = Date.now();
        if (!isValidDateKey(note.scheduledDate)) {
          note.scheduledDate = toDateKey(new Date());
        }
        if (!note.scheduledTime) {
          const now = new Date();
          const startMinutes = now.getHours() * 60 + now.getMinutes();
          note.scheduledTime = `${String(Math.floor(startMinutes / 60)).padStart(2,'0')}:${String(startMinutes % 60).padStart(2,'0')}`;
        }
        note.duration = note.duration || 60;
      } else if (wasInProgress && !wasCompleted) {
        // 进行中 → 完成
        note.inProgress = false;
        note.completed = true;
        // 精确校准：用实际开始时间到完成时间，但不覆盖已有日程
        if (note.inProgressStartTime) {
          const startMs = note.inProgressStartTime;
          const endMs = Date.now();
          const actualDuration = Math.max(1, Math.round((endMs - startMs) / 60000));
          note.duration = actualDuration;
          if (!isValidDateKey(note.scheduledDate)) {
            const startDate = new Date(startMs);
            note.scheduledDate = toDateKey(startDate);
          }
          if (!note.scheduledTime) {
            const startDate = new Date(startMs);
            const startMinutes = startDate.getHours() * 60 + startDate.getMinutes();
            note.scheduledTime = `${String(Math.floor(startMinutes / 60)).padStart(2,'0')}:${String(startMinutes % 60).padStart(2,'0')}`;
          }
        }
        // 循环待办处理：计数 + 判断是否继续循环
        if (hasRecurrence && note.recurrence) {
          note.recurrence.completedCount = (note.recurrence.completedCount || 0) + 1;
          note.recurrence.lastCompletedDate = toDateKey(new Date());
          // 检查是否达到结束条件
          if (!isRecurrenceEnded(note)) {
            // 未结束：把本次执行记录为日历日志块（保留执行时段痕迹）
            if (isValidDateKey(note.scheduledDate) && isValidTimeKey(note.scheduledTime)) {
              notes.push({
                id: Date.now() + Math.random(),
                type: 'todo-log',
                text: note.text,
                projectId: note.projectId,
                parentGoalId: note.parentGoalId,
                completed: true,
                scheduledDate: note.scheduledDate,
                scheduledTime: note.scheduledTime,
                duration: note.duration || 60,
                timestamp: Date.now(),
                sourceId: note.id,
                recurrenceIndex: note.recurrence.completedCount
              });
            }
            // 重置为未完成，等待下一次
            note.completed = false;
            note.inProgress = false;
            note.inProgressStartTime = null;
            note.scheduledDate = null;
            note.scheduledTime = null;
            note.duration = null;
          }
        }
      } else if (wasCompleted) {
        // 完成 → 未完成
        note.completed = false;
        note.inProgress = false;
        note.inProgressStartTime = null;
        note.scheduledDate = null;
        note.scheduledTime = null;
        // 循环待办取消完成：如果已完成次数 > 0，回退一次
        if (hasRecurrence && note.recurrence && (note.recurrence.completedCount || 0) > 0) {
          note.recurrence.completedCount -= 1;
        }
      }

      const justCompleted = note.completed;

      // 取消完成时：如果原里程碑因"全部完成"被自动切换走了，恢复它为当前里程碑
      if (!justCompleted && wasCompleted && notes[index].parentGoalId) {
        const projectId = notes[index].projectId;
        const projectNotes = notes.filter(n => n.projectId === projectId);
        const parentGoal = projectNotes.find(n => n.type === 'goal' && String(n.id) === String(notes[index].parentGoalId));
        if (parentGoal) {
          const parentGoalTodos = projectNotes.filter(n => n.type === 'todo' && String(n.parentGoalId) === String(parentGoal.id));
          const hasUncompleted = parentGoalTodos.some(t => !t.completed);
          const currentGoals = projectNotes.filter(n => n.type === 'goal' && n.isCurrentGoal);
          // 原里程碑有未完成待办，但不是当前里程碑 → 恢复
          if (hasUncompleted && !parentGoal.isCurrentGoal) {
            currentGoals.forEach(g => { g.isCurrentGoal = false; });
            parentGoal.isCurrentGoal = true;
          }
        }
      }

      // 当前里程碑全部完成时，自动跳到下一个未完成的里程碑
      if (justCompleted && notes[index].parentGoalId) {
        const projectId = notes[index].projectId;
        const projectNotes = notes.filter(n => n.projectId === projectId);
        const currentGoal = projectNotes.find(n => n.type === 'goal' && n.isCurrentGoal);
        if (currentGoal && String(currentGoal.id) === String(notes[index].parentGoalId)) {
          const goalTodos = projectNotes.filter(n => n.type === 'todo' && String(n.parentGoalId) === String(currentGoal.id));
          const allCompleted = isGoalAllTodosCompleted(goalTodos);
          if (allCompleted) {
            // 找下一个未全部完成的里程碑（按项目页面显示顺序：order 降序，大的在上）
            const goals = projectNotes.filter(n => n.type === 'goal');
            goals.sort((a, b) => {
              if (a.order != null && b.order != null) return b.order - a.order;
              if (a.order != null) return -1;
              if (b.order != null) return 1;
              const aTime = a.timestamp || 0;
              const bTime = b.timestamp || 0;
              return aTime - bTime;
            });
            const currentIdx = goals.findIndex(g => String(g.id) === String(currentGoal.id));
            for (let i = currentIdx + 1; i < goals.length; i++) {
              const nextGoalTodos = projectNotes.filter(n => n.type === 'todo' && String(n.parentGoalId) === String(goals[i].id));
              const nextAllCompleted = isGoalAllTodosCompleted(nextGoalTodos);
              if (!nextAllCompleted) {
                const g = notes.find(n => String(n.id) === String(goals[i].id));

    // 庆祝动画：彩色粒子爆发 + 鼓励文字
    const celebrationMessages = ['棒！', '赞！', '搞定！', '哇哦！', '太棒了！', '完美！', '太棒了吧！', 'nice！'];
    const celebrationColors = ['#e85d75', '#2563EB', '#93C5FD', '#ffcc00', '#34c759', '#5ac8fa', '#ff9500'];

    function triggerCelebration(x, y) {
      let layer = document.querySelector('.celebration-layer');
      if (!layer) {
        layer = document.createElement('div');
        layer.className = 'celebration-layer';
        document.body.appendChild(layer);
      }

      // 彩色粒子爆发（更大、更夸张）
      const particleCount = 24;
      let maxDuration = 0;
      for (let i = 0; i < particleCount; i++) {
        const p = document.createElement('div');
        p.className = 'confetti';
        const color = celebrationColors[i % celebrationColors.length];
        p.style.background = color;
        p.style.left = x + 'px';
        p.style.top = y + 'px';
        p.style.width = (10 + Math.random() * 8) + 'px';
        p.style.height = (10 + Math.random() * 8) + 'px';
        p.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
        layer.appendChild(p);

        const angle = (Math.PI * 2 * i) / particleCount + (Math.random() - 0.5) * 0.3;
        const distance = 80 + Math.random() * 80;
        const dx = Math.cos(angle) * distance;
        const dy = Math.sin(angle) * distance - 50; // 略向上
        const rotate = Math.random() * 720;
        const duration = 1200 + Math.random() * 400;
        if (duration > maxDuration) maxDuration = duration;

        p.animate([
          { transform: 'translate(-50%, -50%) scale(1.3) rotate(0deg)', opacity: 1, offset: 0 },
          { transform: `translate(calc(-50% + ${dx * 0.6}px), calc(-50% + ${dy * 0.6}px)) scale(1.1) rotate(${rotate * 0.4}deg)`, opacity: 1, offset: 0.5 },
          { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy + 60}px)) scale(0.4) rotate(${rotate}deg)`, opacity: 0 }
        ], { duration: duration, easing: 'cubic-bezier(0.2, 0.6, 0.35, 1)' });

        setTimeout(() => p.remove(), duration);
      }

      // 鼓励文字（更大、更夸张）
      const msg = celebrationMessages[Math.floor(Math.random() * celebrationMessages.length)];
      const text = document.createElement('div');
      text.className = 'celebration-text';
      text.textContent = msg;
      text.style.color = celebrationColors[Math.floor(Math.random() * celebrationColors.length)];
      text.style.fontSize = '28px';
      text.style.left = x + 'px';
      text.style.top = (y - 12) + 'px';
      text.style.textShadow = '0 2px 12px rgba(0,0,0,0.15)';
      layer.appendChild(text);

      const textDuration = 2200;
      if (textDuration > maxDuration) maxDuration = textDuration;

      text.animate([
        { transform: 'translate(-50%, -50%) scale(0.4)', opacity: 0 },
        { transform: 'translate(-50%, -140%) scale(1.5)', opacity: 1, offset: 0.25 },
        { transform: 'translate(-50%, -200%) scale(1.35)', opacity: 1, offset: 0.6 },
        { transform: 'translate(-50%, -280%) scale(1.2)', opacity: 0 }
      ], { duration: textDuration, easing: 'cubic-bezier(0.2, 0.7, 0.3, 1)' });

      setTimeout(() => text.remove(), textDuration);

      // 所有动画结束后清理整个 layer，避免合成层残留导致闪现
      setTimeout(() => {
        if (layer && layer.parentElement && layer.children.length === 0) {
          layer.remove();
        }
      }, maxDuration + 50);
    }

    function addPendingDraft(text, type) {
      pendingDrafts.unshift({
        id: 'draft-' + Date.now(),
        text: text.trim(),
        type: type || 'idea',
        timestamp: Date.now()
      });
      render();
    }

    function removePendingDraft(draftId) {
      pendingDrafts = pendingDrafts.filter(d => String(d.id) !== String(draftId));
      render();
    }

    function getPendingDraft(draftId) {
      return pendingDrafts.find(d => String(d.id) === String(draftId));
    }

    function consumePendingDraft(draftId) {
      const draft = getPendingDraft(draftId);
      if (!draft) return null;
      pendingDrafts = pendingDrafts.filter(d => String(d.id) !== String(draftId));
      return draft;
    }

    function savePendingDraftToProject(draftId, projectId) {
      const draft = consumePendingDraft(draftId);
      if (!draft || !projectId) return;
      const now = new Date();
      const notes = loadNotes();
      notes.unshift({
        id: Date.now(),
        text: draft.text,
        type: draft.type || 'idea',
        completed: false,
        projectId: projectId,
        dateKey: toDateKey(now),
        time: formatTime(now),
        timestamp: now.getTime(),
        order: Date.now()
      });
      saveNotes(notes);
      render();
      renderProjects();
    }

      target.attachedIdeas.push({

    function isSpecialProjectId(projectId) {
      return projectId === ANCHOR_ID || projectId === CHECKIN_ID || projectId === ORPHAN_GOALS_ID;

    function getAssignableProjects(projects) {
      const statusRank = { in_progress: 0, ongoing: 1 };
      return projects
        .filter(p => p.status !== 'completed' && p.status !== 'upcoming')
        .slice()
        .sort((a, b) => {
          const aRank = statusRank[a.status] ?? 99;
          const bRank = statusRank[b.status] ?? 99;
          if (aRank !== bRank) return aRank - bRank;
          if ((b.priority || 0) !== (a.priority || 0)) return (b.priority || 0) - (a.priority || 0);
          return (a.order || 0) - (b.order || 0);
        });
    }

    function sortActionTodos(a, b) {
      if (!!a.isNextAction !== !!b.isNextAction) return a.isNextAction ? -1 : 1;
      if (!!a.scheduledDate !== !!b.scheduledDate) return a.scheduledDate ? -1 : 1;
      if (a.scheduledDate && b.scheduledDate && a.scheduledDate !== b.scheduledDate) {
        return a.scheduledDate.localeCompare(b.scheduledDate);
      }
      if (a.scheduledTime && b.scheduledTime && a.scheduledTime !== b.scheduledTime) {
        return a.scheduledTime.localeCompare(b.scheduledTime);
      }
      const aTime = a.order != null ? a.order : (a.timestamp || 0);
      const bTime = b.order != null ? b.order : (b.timestamp || 0);
      return aTime - bTime;
    }

    function sortTodosByCreatedAsc(a, b) {
      const aTime = a.order != null ? a.order : (a.timestamp || 0);
      const bTime = b.order != null ? b.order : (b.timestamp || 0);
      return aTime - bTime;
    }

    function sortCompletedTodosByScheduledTime(a, b) {
      const aDate = a.scheduledDate || '9999';
      const bDate = b.scheduledDate || '9999';
      if (aDate !== bDate) return aDate < bDate ? -1 : 1;
      const aTime = a.scheduledTime || '99:99';
      const bTime = b.scheduledTime || '99:99';
      if (aTime !== bTime) return aTime < bTime ? -1 : 1;
      const aOrder = a.order != null ? a.order : (a.timestamp || 0);
      const bOrder = b.order != null ? b.order : (b.timestamp || 0);
      return aOrder - bOrder;
    }

    function renderCompletedTodoGroup(todos, projects, key) {
      if (todos.length === 0) return null;
      const collapsed = getCompletedTodoCollapsed(key);

      header.addEventListener('click', () => {

      list.addEventListener('dragover', (e) => {

        const draggingItem = list.querySelector('.note-item.dragging');
        if (!draggingItem) return;
        const afterElement = getDragAfterElement(list, e.clientY);
        if (afterElement == null) {
          list.appendChild(draggingItem);
        } else {
          list.insertBefore(draggingItem, afterElement);
        }
      });

      list.addEventListener('drop', (e) => {
        e.preventDefault();
        e.stopPropagation();
        const draggingItem = list.querySelector('.note-item.dragging');
        if (!draggingItem) return;
        const draggedId = draggingItem.dataset.noteId;
        const items = Array.from(list.querySelectorAll('.note-item'));
        const newIndex = items.findIndex(el => el.dataset.noteId === draggedId);

        const notes = loadNotes();
        const todoIds = items.map(el => String(el.dataset.noteId));
        const baseOrder = Date.now();
        todoIds.forEach((id, idx) => {
          const n = notes.find(nn => String(nn.id) === String(id));
          if (n) {
            n.order = baseOrder + idx * 1000;
          }
        });
        saveNotes(notes);
        render();
      });

      todos.sort(sortCompletedTodosByScheduledTime).forEach(todo => {
        const item = createNoteItem(todo, projects, true);
        list.appendChild(item);
      });
      wrap.appendChild(list);
      return wrap;
    }

    function applyIdeaFabPosition(btn) {
      const pos = getSavedIdeaFabPosition();
      if (!pos || typeof pos.left !== 'number' || typeof pos.top !== 'number') return;
      const maxLeft = window.innerWidth - btn.offsetWidth - 8;
      const maxTop = window.innerHeight - btn.offsetHeight - 8;
      const left = Math.max(8, Math.min(maxLeft, pos.left));
      const top = Math.max(8, Math.min(maxTop, pos.top));
      btn.classList.add('custom-position');
      btn.style.left = left + 'px';
      btn.style.top = top + 'px';
      btn.style.right = 'auto';
      btn.style.bottom = 'auto';
    }

    function enableIdeaFabDrag(btn) {
      if (btn.dataset.dragReady === '1') return;
      btn.dataset.dragReady = '1';
      let dragging = false;
      let moved = false;
      let startX = 0;
      let startY = 0;
      let startLeft = 0;
      let startTop = 0;

      btn.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        dragging = true;
        moved = false;
        const rect = btn.getBoundingClientRect();
        startX = e.clientX;
        startY = e.clientY;
        startLeft = rect.left;
        startTop = rect.top;
        btn.classList.add('dragging');
        document.body.style.userSelect = 'none';
        e.preventDefault();
      });

      document.addEventListener('mousemove', (e) => {
        if (!dragging) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        if (Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
        const maxLeft = window.innerWidth - btn.offsetWidth - 8;
        const maxTop = window.innerHeight - btn.offsetHeight - 8;
        const left = Math.max(8, Math.min(maxLeft, startLeft + dx));
        const top = Math.max(8, Math.min(maxTop, startTop + dy));
        btn.classList.add('custom-position');
        btn.style.left = left + 'px';
        btn.style.top = top + 'px';
        btn.style.right = 'auto';
        btn.style.bottom = 'auto';
      });

      document.addEventListener('mouseup', () => {
        if (!dragging) return;
        dragging = false;
        btn.classList.remove('dragging');
        document.body.style.userSelect = '';
        if (moved) {
          const rect = btn.getBoundingClientRect();
          localStorage.setItem(IDEA_FAB_POSITION_KEY, JSON.stringify({ left: rect.left, top: rect.top }));
          btn.dataset.justDragged = '1';
          setTimeout(() => delete btn.dataset.justDragged, 0);
        }
      });
    }

    function getDefaultCurrentGoals(projectNotes) {
      // 1. 优先返回用户手动标注的当前里程碑
      const manual = projectNotes.filter(n => n.type === 'goal' && n.isCurrentGoal);
      if (manual.length > 0) return manual;

      // 2. 没有手动标注时，取第一个"未完成"的里程碑
      // 未完成 = 该里程碑下有待办且未全部完成
      const goals = projectNotes.filter(n => n.type === 'goal');
      goals.sort((a, b) => {
        if (a.order != null && b.order != null) return b.order - a.order;
        if (a.order != null) return -1;
        if (b.order != null) return 1;
        // 没有手动排序时，按添加时间从早到晚排
        const aTime = a.timestamp || 0;
        const bTime = b.timestamp || 0;
        return aTime - bTime;
      });
      for (const goal of goals) {
        const goalTodos = projectNotes.filter(n => n.type === 'todo' && String(n.parentGoalId) === String(goal.id));
        if (goalTodos.length === 0) continue;
        if (!isGoalAllTodosCompleted(goalTodos)) return [goal];
      }
      return [];
    }

    function getNextActionNotes(notes) {
      const actions = [];
      const added = new Set();
      const projects = loadProjects().filter(p => p.status !== 'completed');

      // 1. 所有手动标为下一步的待办（里程碑内外都要显示）
      notes
        .filter(n => n.type === 'todo' && !n.completed && n.isNextAction && !isSpecialProjectId(n.projectId))
        .sort(sortActionTodos)
        .forEach(n => {
          actions.push(n);
          added.add(String(n.id));
        });

      // 2. 每个项目非里程碑未完成的第一个
      projects.forEach(project => {
        const first = notes
          .filter(n => n.type === 'todo' && !n.completed && !n.parentGoalId && n.projectId === project.id && !n.isNextAction && !n.excludeFromNextAction && !isSpecialProjectId(n.projectId))
          .sort(sortActionTodos)[0];
        if (first && !added.has(String(first.id))) {
          actions.push(first);
          added.add(String(first.id));
        }
      });

      // 3. 每个当前里程碑未完成的第一个
      projects.forEach(project => {
        const projectNotes = notes.filter(n => n.projectId === project.id);
        const currentGoals = getDefaultCurrentGoals(projectNotes);
        currentGoals.forEach(goal => {
          const first = projectNotes
            .filter(n => n.type === 'todo' && !n.completed && String(n.parentGoalId) === String(goal.id) && !n.isNextAction && !n.excludeFromNextAction)
            .sort(sortActionTodos)[0];
          if (first && !added.has(String(first.id))) {
            actions.push(first);
            added.add(String(first.id));
          }
        });
      });

      // 项目排序映射（与左侧栏一致：正在进行→持续进行→即将开始，组内按优先级+order）
      const statusOrder = { in_progress: 0, ongoing: 1, upcoming: 2 };
      const projectOrderMap = {};
      [...projects].sort((a, b) => {
        const sa = statusOrder[a.status] ?? 9;
        const sb = statusOrder[b.status] ?? 9;
        if (sa !== sb) return sa - sb;
        if (b.priority !== a.priority) return b.priority - a.priority;
        return (a.order || 0) - (b.order || 0);
      }).forEach((p, idx) => { projectOrderMap[p.id] = idx; });

      return actions.sort((a, b) => {
        const hasA = a.nextActionOrder != null;
        const hasB = b.nextActionOrder != null;
        if (hasA && hasB) return a.nextActionOrder - b.nextActionOrder;
        if (hasA !== hasB) return hasA ? -1 : 1;
        const pa = projectOrderMap[a.projectId] ?? 999;
        const pb = projectOrderMap[b.projectId] ?? 999;
        if (pa !== pb) return pa - pb;
        const aTime = a.timestamp || 0;
        const bTime = b.timestamp || 0;
        return aTime - bTime;
      });
    }

    function toggleNextAction(noteId) {
      const notes = loadNotes();
      const note = notes.find(n => String(n.id) === String(noteId));
      if (!note || note.type !== 'todo') return;
      if (note.isNextAction) {
        note.isNextAction = false;
        delete note.nextActionOrder;
      } else {
        const nextActions = getNextActionNotes(notes);
        const isInPanel = nextActions.some(a => String(a.id) === String(noteId));
        if (isInPanel) {
          note.excludeFromNextAction = true;
        } else {
          note.isNextAction = true;
          delete note.excludeFromNextAction;
        }
      }
      saveNotes(notes);
      render();
    }

    function toggleCurrentGoal(noteId) {
      const notes = loadNotes();
      const note = notes.find(n => String(n.id) === String(noteId));
      if (!note || note.type !== 'goal') return;
      note.isCurrentGoal = !note.isCurrentGoal;
      saveNotes(notes);
      render();
    }

    function renderNextActionHome(notes, projects) {
      const container = document.getElementById('notes-container');
      const actions = getNextActionNotes(notes);
      const panel = document.createElement('section');
      panel.className = 'next-action-panel';

      // 标记：从下一步面板拖出的待办是否在面板内被处理过
      let dropHandledInsidePanel = false;

      // 插入位置指示线（外部拖入时显示）
      let dropIndicator = null;
      const showDropIndicator = (list, afterElement) => {
        if (!dropIndicator) {
          dropIndicator = document.createElement('div');
          dropIndicator.style.cssText = 'height:28px;background:rgba(37,99,235,0.06);border-radius:8px;box-shadow:inset 0 0 0 1.5px rgba(37,99,235,0.25);margin:3px 0;transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease, transform 0.15s ease;';
        }
        if (afterElement == null) {
          list.appendChild(dropIndicator);
        } else {
          list.insertBefore(dropIndicator, afterElement);
        }
      };
      const removeDropIndicator = () => {
        if (dropIndicator && dropIndicator.parentNode) {
          dropIndicator.parentNode.removeChild(dropIndicator);
        }
      };

      // 整个 panel 作为统一的拖放接收区域
      panel.addEventListener('dragover', (e) => {
        if (e.target.closest('.sub-todo-list')) return;
        if (e.dataTransfer.types.includes('text/x-sub-todo-id')) {
          e.preventDefault();
          return;
        }
        if (e.dataTransfer.types.includes('text/x-note-id')) {
          e.preventDefault();
          panel.classList.add('drag-over');
          const list = panel.querySelector('.next-action-list');
          const header = panel.querySelector('.next-action-header');
          if (!list) return;

          // 判断是否拖到了 header 区域
          const isOnHeader = header && header.contains(e.target);
          const listRect = list.getBoundingClientRect();
          const isAboveList = e.clientY < listRect.top;

          const draggingItem = list.querySelector('.note-item.dragging');
          if (draggingItem && !e.target.closest('.note-text')) {
            // 内部排序
            removeDropIndicator();
            if (isOnHeader || isAboveList) {
              // 拖到标题区域或列表上方 → 放到最前面
              list.insertBefore(draggingItem, list.firstChild);
            } else {
              const afterElement = getDragAfterElement(list, e.clientY, '.note-item:not(.dragging)');
              if (afterElement == null) {
                list.appendChild(draggingItem);
              } else {
                list.insertBefore(draggingItem, afterElement);
              }
            }
          } else if (!draggingItem && !e.target.closest('.note-text')) {
            // 外部拖入：显示插入位置指示线
            if (isOnHeader || isAboveList) {
              // 拖到标题区域或列表上方 → 显示在最前面
              showDropIndicator(list, list.firstChild);
            } else {
              const afterElement = getDragAfterElement(list, e.clientY, '.note-item');
              showDropIndicator(list, afterElement);
            }
          }
        }
      });
      panel.addEventListener('dragleave', (e) => {
        if (!panel.contains(e.relatedTarget)) {
          panel.classList.remove('drag-over');
          removeDropIndicator();
        }
      });
      panel.addEventListener('drop', (e) => {
        if (e.target.closest('.sub-todo-list')) return;
        e.preventDefault();
        e.stopPropagation();
        panel.classList.remove('drag-over');
        removeDropIndicator();
        dropHandledInsidePanel = true;

        var _attachedIdeaData = e.dataTransfer.getData('text/x-attached-idea');
        if (_attachedIdeaData) return;

        const subTodoId = e.dataTransfer.getData('text/x-sub-todo-id');
        const subParentId = e.dataTransfer.getData('text/x-sub-parent-id');
        if (subTodoId && subParentId) {
          if (e.target.closest('.note-text')) return;
          promoteSubTodoToNextAction(subParentId, subTodoId);
          return;
        }

        const noteId = e.dataTransfer.getData('text/x-note-id');
        if (!noteId) return;

        const list = panel.querySelector('.next-action-list');
        const header = panel.querySelector('.next-action-header');
        const hasDragging = list ? list.querySelector('.note-item.dragging') : null;

        // 判断是否拖到了 header 区域或列表上方
        const isOnHeader = header && header.contains(e.target);
        const listRect = list ? list.getBoundingClientRect() : null;
        const isAboveList = listRect && e.clientY < listRect.top;

        if (hasDragging && !e.target.closest('.note-text')) {
          // 内部排序：只更新 nextActionOrder，不改 isNextAction
          const items = list ? Array.from(list.querySelectorAll('.note-item')) : [];
          const ids = items.map(el => String(el.dataset.noteId)).filter(Boolean);
          const allNotes = loadNotes();
          ids.forEach((id, idx) => {
            const note = allNotes.find(n => String(n.id) === id);
            if (note && note.type === 'todo') {
              note.nextActionOrder = idx * 1000;
            }
          });
          saveNotes(allNotes);
          render();
        } else if (noteId && !hasDragging) {
          // 外部拖入：按位置插入
          const allNotes = loadNotes();
          const note = allNotes.find(n => String(n.id) === String(noteId));
          if (!note || note.type !== 'todo') return;
          note.isNextAction = true;

          // 计算插入位置
          if (list) {
            const items = Array.from(list.querySelectorAll('.note-item'));
            let insertIndex;

            if (isOnHeader || isAboveList) {
              // 拖到标题区域或列表上方 → 放到最前面
              insertIndex = 0;
            } else {
              const afterElement = getDragAfterElement(list, e.clientY, '.note-item');
              insertIndex = items.length; // 默认放到最后
              if (afterElement) {
                insertIndex = items.indexOf(afterElement);
              }
            }

            // 根据插入位置设置 nextActionOrder
            if (insertIndex === 0) {
              // 放到最前面
              const firstItem = items[0];
              if (firstItem) {
                const firstNote = allNotes.find(n => String(n.id) === String(firstItem.dataset.noteId));
                note.nextActionOrder = (firstNote && firstNote.nextActionOrder ? firstNote.nextActionOrder : 1000) - 500;
              } else {
                note.nextActionOrder = 1000;
              }
            } else if (insertIndex >= items.length) {
              // 放到最后面
              const lastItem = items[items.length - 1];
              if (lastItem) {
                const lastNote = allNotes.find(n => String(n.id) === String(lastItem.dataset.noteId));
                note.nextActionOrder = (lastNote && lastNote.nextActionOrder ? lastNote.nextActionOrder : 1000) + 1000;
              } else {
                note.nextActionOrder = 1000;
              }
            } else {
              // 放到中间
              const prevItem = items[insertIndex - 1];
              const nextItem = items[insertIndex];
              const prevNote = prevItem ? allNotes.find(n => String(n.id) === String(prevItem.dataset.noteId)) : null;
              const nextNote = nextItem ? allNotes.find(n => String(n.id) === String(nextItem.dataset.noteId)) : null;
              const prevOrder = prevNote && prevNote.nextActionOrder ? prevNote.nextActionOrder : 0;
              const nextOrder = nextNote && nextNote.nextActionOrder ? nextNote.nextActionOrder : (prevOrder + 2000);
              note.nextActionOrder = (prevOrder + nextOrder) / 2;
            }
          } else {
            note.nextActionOrder = 1000;
          }

          saveNotes(allNotes);
          render();
        }
      });

      const header = document.createElement('div');
      header.className = 'next-action-header';
      const title = document.createElement('div');
      title.className = 'next-action-title';
      title.textContent = t('下一步行动');
      const subtitle = document.createElement('div');
      subtitle.className = 'next-action-subtitle';
      subtitle.textContent = t('这里只显示现在可以直接做的事；项目和里程碑的完整结构仍在项目页里整理。');
      header.appendChild(title);
      header.appendChild(subtitle);
      // 右键标题弹出菜单：恢复自动排序
      header.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        e.stopPropagation();
        document.querySelectorAll('.next-action-context-menu').forEach(m => m.remove());
        const menu = document.createElement('div');
        menu.className = 'note-context-menu next-action-context-menu';
        const refreshItem = document.createElement('button');
        refreshItem.className = 'note-context-menu-item';
        refreshItem.textContent = t('恢复自动排序');
        refreshItem.addEventListener('click', () => {
          const allNotes = loadNotes();
          let changed = false;
          allNotes.forEach(n => {
            if (n.nextActionOrder != null) {
              delete n.nextActionOrder;
              changed = true;
            }
            if (n.isNextAction) {
              n.isNextAction = false;
              changed = true;
            }
            if (n.excludeFromNextAction) {
              delete n.excludeFromNextAction;
              changed = true;
            }
          });
          if (changed) {
            saveNotes(allNotes);
            render();
          }
          menu.classList.add('hiding');
          setTimeout(() => menu.remove(), 120);
        });
        menu.appendChild(refreshItem);
        document.body.appendChild(menu);
        const rect = menu.getBoundingClientRect();
        let left = e.clientX;
        let top = e.clientY;
        if (left + rect.width > window.innerWidth - 10) left = window.innerWidth - rect.width - 10;
        if (top + rect.height > window.innerHeight - 10) top = window.innerHeight - rect.height - 10;
        menu.style.left = left + 'px';
        menu.style.top = top + 'px';
        setTimeout(() => {
          const close = () => {
            menu.classList.add('hiding');
            setTimeout(() => menu.remove(), 120);
            document.removeEventListener('click', close);
            document.removeEventListener('contextmenu', close);
          };
          document.addEventListener('click', close);
          document.addEventListener('contextmenu', close);
        }, 0);
      });
      panel.appendChild(header);

      if (actions.length === 0) {
        const empty = document.createElement('p');
        empty.className = 'empty-hint';
        empty.textContent = t('还没有下一步行动。可以把待办拖到这里，或在菜单里标为下一步。');
        panel.appendChild(empty);
        container.appendChild(panel);
        return;
      }

      const list = document.createElement('ul');
      list.className = 'next-action-list';
      actions.forEach(note => {
        try {
          const item = createNoteItem(note, projects, true);
          item.classList.add('next-action-home-item');
          // 监听 dragstart：标记这是从下一步面板拖出的
          item.addEventListener('dragstart', (e) => {
            window._draggingFromNextAction = String(note.id);
            dropHandledInsidePanel = false;
          });
          // 监听 dragend：如果没有在面板内被处理，则取消下一步
          item.addEventListener('dragend', (e) => {
            if (window._draggingFromNextAction && !dropHandledInsidePanel) {
              const noteId = window._draggingFromNextAction;
              window._draggingFromNextAction = null;
              const allNotes = loadNotes();
              const n = allNotes.find(x => String(x.id) === String(noteId));
              if (n) {
                if (n.isNextAction) {
                  n.isNextAction = false;
                  delete n.nextActionOrder;
                } else {
                  n.excludeFromNextAction = true;
                }
                saveNotes(allNotes);
                render();
              }
            } else {
              window._draggingFromNextAction = null;
            }
            dropHandledInsidePanel = false;
          });
          const sourceProject = projects.find(p => p.id === note.projectId);
          if (sourceProject) {
            item.style.setProperty('--source-color', sourceProject.color || '#64748B');
            const source = document.createElement('span');
            source.className = 'next-action-source';
            source.innerHTML = `<span class="next-action-source-dot"></span><span>${sourceProject.name}</span>`;
            item.appendChild(source);
          }
          list.appendChild(item);
        } catch (err) {
          console.warn('[下一步] 渲染 note 出错，已跳过:', note, err);
        }
      });
      panel.appendChild(list);
      container.appendChild(panel);
    }

    function groupByDate(notes) {
      const groups = new Map();
      for (const note of notes) {
        if (!groups.has(note.dateKey)) {
          groups.set(note.dateKey, []);
        }
        groups.get(note.dateKey).push(note);
      }
      return groups;
    }

    function showNewProjectDialog() {
      const newProjectBtn = document.querySelector('.sidebar-new-project');
      if (!newProjectBtn) return;
      if (newProjectBtn.querySelector('.add-project-input')) return;

      // 检查是否可以创建新项目（免费版限制共3个项目）
      const projects = loadProjects();
      
      if (projects.length >= FREE_PROJECT_LIMIT) {
        checkProStatus().then(isPro => {
          if (!isPro) {
            showPaywall();
            return;
          }
          createProjectInput(newProjectBtn);
        }).catch(() => {
          showPaywall();
        });
        return;
      }

      createProjectInput(newProjectBtn);
    }

    function createProjectInput(newProjectBtn) {
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'add-project-input';
      input.placeholder = t('项目名称');
      newProjectBtn.appendChild(input);
      input.focus();

      let done = false;
      const finish = async (save) => {
        if (done) return;
        done = true;
        if (save && input.value.trim()) {
          const projectId = await addProject(input.value);
          if (projectId) {
            setTimeout(() => {
              const projectItem = projectListEl.querySelector(`[data-project-id="${projectId}"]`);
              if (projectItem) startProjectEdit(projectId, projectItem);
            }, 50);
          }
        }
        input.remove();
      };

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          finish(true);
        } else if (e.key === 'Escape') {
          e.preventDefault();
          finish(false);
        }
      });
      input.addEventListener('blur', () => finish(true));
    }

    async function addProject(name, category, status) {
      const trimmed = name.trim();
      if (!trimmed) return null;
      const projects = loadProjects();
      
      // 免费版限制共3个项目
      if (projects.length >= FREE_PROJECT_LIMIT) {
        const isPro = await checkProStatus();
        if (!isPro) {
          showPaywall();
          return null;
        }
      }
      
      const id = Date.now().toString();
      const usedColors = projects.map(p => p.color);
      let colorIndex = 0;
      for (let i = 0; i < PROJECT_COLORS.length; i++) {
        if (!usedColors.includes(PROJECT_COLORS[i])) {
          colorIndex = i;
          break;
        }
      }
      const cat = category || 'life';
      const st = status || 'in_progress';
      projects.push({
        id: id,
        name: trimmed,
        category: cat,
        status: st,
        priority: 0,
        order: projects.filter(p => p.status === st).length,
        color: PROJECT_COLORS[colorIndex % PROJECT_COLORS.length]
      });
      saveProjects(projects);
      renderProjects();
      // 评分：记录创建项目
      try {
        if (window.__reviewManager && window.__reviewManager.recordProjectCreated) {
          window.__reviewManager.recordProjectCreated();
        }
      } catch(e) {}
      return id;
    }

    function updateProjectName(id, name) {
      const trimmed = name.trim();
      if (!trimmed) return;
      const projects = loadProjects();
      const project = projects.find(p => p.id === id);
      if (project) {
        project.name = trimmed;
        saveProjects(projects);
        render();
      }
    }

    function updateProjectColor(id, color) {
      const projects = loadProjects();
      const project = projects.find(p => p.id === id);
      if (!project) return;
      project.color = color;
      saveProjects(projects);
      render();
      renderProjects();
    }

    async function deleteProject(id) {
      if (!await customConfirm(t('确定要删除这个项目吗？项目里的记录会保留但不再归类。'))) return;
      const projects = loadProjects().filter(p => p.id !== id);
      saveProjects(projects);

      const notes = loadNotes();
      notes.forEach(note => {
        if (note.projectId === id) note.projectId = null;
      });
      saveNotes(notes);

      if (activeFilter === id) {
        activeFilter = 'all';
        localStorage.setItem(GLASS_NEXT_ACTION_FILTER_KEY, activeFilter);
      }

      render();
      renderProjects();
    }

    function setFilter(filter) {
      activeFilter = filter;
      localStorage.setItem(GLASS_NEXT_ACTION_FILTER_KEY, filter);
      if (filter === 'all') {
        input.placeholder = t('先写下来，腾空脑子');
      } else if (filter === ANCHOR_ID) {
        input.placeholder = t('记录到「时间块规划」');
      } else if (filter === CHECKIN_ID) {
        input.placeholder = t('记录到「打卡」');
      } else if (filter === ORPHAN_GOALS_ID) {
        input.placeholder = t('找回未归类里程碑');
      } else {
        input.placeholder = `${t('记录到「')}${getProjectName(filter)}」`;
      }
      render();
      renderProjects();
    }

    function getProjectName(id) {
      const projects = loadProjects();
      const project = projects.find(p => p.id === id);
      return project ? project.name : '';
    }

    function getProjectCount(id) {
      return loadNotes().filter(note => note.projectId === id).length;
    }

    function getOrphanGoals() {
      const projects = loadProjects();
      const projectIds = new Set(projects.map(p => String(p.id)));
      return loadNotes().filter(note =>
        note.type === 'goal' &&
        (!note.projectId || !projectIds.has(String(note.projectId)))
      );
    }

    function renderSpecialProjects() {
      renderProjects();
    }

    function renderProjects() {
      const projects = loadProjects();
      const allNotes = loadNotes(); // 预加载一次，供 getProjectProgress 使用
      projectListEl.innerHTML = '';

      const allItem = document.createElement('li');
      allItem.className = 'project-item no-progress home-entry' + (activeFilter === 'all' ? ' active' : '');
      allItem.innerHTML = `<span class="project-name">主页</span>`;
      allItem.addEventListener('click', (e) => {
        if (e.target.closest('.project-action')) return;
        setFilter('all');
      });
      projectListEl.appendChild(allItem);

      const newProjectBtn = document.createElement('div');
      newProjectBtn.className = 'sidebar-new-project';
      newProjectBtn.innerHTML = `
        <div class="project-category-title" style="margin-top: 18px; cursor: default;">
          <span class="category-name">${t('项目')}</span>
          <button class="new-proj-btn">+</button>
        </div>
      `;
      const newBtn = newProjectBtn.querySelector('.new-proj-btn');
      newBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        showNewProjectDialog();
      });
      projectListEl.appendChild(newProjectBtn);

      const inProgressProjects = projects.filter(p => p.status === 'in_progress');
      const ongoingProjects = projects.filter(p => p.status === 'ongoing');
      const upcomingProjects = projects.filter(p => p.status === 'upcoming');
      const completedProjects = projects.filter(p => p.status === 'completed');

      inProgressProjects.sort((a, b) => {
        if (b.priority !== a.priority) return b.priority - a.priority;
        return (a.order || 0) - (b.order || 0);
      });

      ongoingProjects.sort((a, b) => {
        if (b.priority !== a.priority) return b.priority - a.priority;
        return (a.order || 0) - (b.order || 0);
      });

      upcomingProjects.sort((a, b) => {
        if (b.priority !== a.priority) return b.priority - a.priority;
        return (a.order || 0) - (b.order || 0);
      });

      completedProjects.sort((a, b) => {
        return (a.order || 0) - (b.order || 0);
      });

      const categories = [
        { key: 'in_progress', name: t('正在进行'), projects: inProgressProjects, alwaysShow: true },
        { key: 'ongoing', name: t('持续进行'), projects: ongoingProjects, alwaysShow: true },
        { key: 'upcoming', name: t('即将开始'), projects: upcomingProjects, alwaysShow: true },
        { key: 'completed', name: t('已归档'), projects: completedProjects, alwaysShow: true }
      ];

      const collapsedState = loadCategoryCollapsedState();

      categories.forEach(cat => {
        if (!cat.alwaysShow && cat.projects.length === 0) return;

        const catWrapper = document.createElement('div');
        catWrapper.className = 'project-category-wrapper';
        catWrapper.dataset.category = cat.key;
        projectListEl.appendChild(catWrapper);

        const catTitle = document.createElement('div');
        catTitle.className = 'project-category-title category-section-title';
        catTitle.dataset.category = cat.key;
        const isCollapsed = collapsedState[cat.key];
        catTitle.innerHTML = `
          <span class="category-arrow ${isCollapsed ? '' : 'expanded'}"></span>
          <span class="category-name">${cat.name}</span>
          <span class="category-count">${cat.projects.length}</span>
        `;
        catTitle.addEventListener('click', () => {
          toggleCategoryCollapse(cat.key);
        });
        // 右键分组标题：直接在该分组新建项目

    function getProjectProgress(projectId, notesCache) {
      const notes = notesCache || loadNotes();
      const projectNotes = notes.filter(n => n.projectId === projectId);
      const goals = projectNotes.filter(n => n.type === 'goal');

      if (goals.length > 0) {
        // 有里程碑：每个里程碑权重相等，里程碑外的待办算成一个虚拟里程碑，取平均进度
        // 循环待办按 已完成次数/总次数 计入
        let totalProgress = 0;
        let groupCount = 0;
        goals.forEach(goal => {
          const goalTodos = projectNotes.filter(n => n.type === 'todo' && String(n.parentGoalId) === String(goal.id));
          if (goalTodos.length > 0) {
            const gDone = goalTodos.reduce((s, t) => s + getTodoDoneCount(t), 0);
            const gTotal = goalTodos.reduce((s, t) => s + getTodoTotalCount(t), 0);
            totalProgress += gTotal > 0 ? gDone / gTotal : 0;
            groupCount++;
          }
        });
        // 里程碑外的待办（不属于任何里程碑的）算成一个虚拟里程碑
        const ungroupedTodos = projectNotes.filter(n => n.type === 'todo' && !n.parentGoalId);
        if (ungroupedTodos.length > 0) {
          const uDone = ungroupedTodos.reduce((s, t) => s + getTodoDoneCount(t), 0);
          const uTotal = ungroupedTodos.reduce((s, t) => s + getTodoTotalCount(t), 0);
          totalProgress += uTotal > 0 ? uDone / uTotal : 0;
          groupCount++;
        }
        if (groupCount === 0) return 0;
        return totalProgress / groupCount;
      } else {
        // 没有里程碑：按待办完成数量计算（循环待办按 已完成次数/总次数 计入）
        const todos = projectNotes.filter(n => n.type === 'todo');
        if (todos.length === 0) return 0;
        const done = todos.reduce((s, t) => s + getTodoDoneCount(t), 0);
        const total = todos.reduce((s, t) => s + getTodoTotalCount(t), 0);
        return total > 0 ? done / total : 0;
      }
    }

    function addProjectInCategory(statusKey, catGroup) {
      // 如果分组是折叠的，先展开

      // 避免重复打开

      input.style.marginBottom = '4px';
      catGroup.insertBefore(input, catGroup.firstChild);
      input.focus();

      let done = false;
      const finish = async (save) => {
        if (done) return;
        done = true;
        if (save && input.value.trim()) {
          await addProject(input.value, 'life', statusKey);
        } else {
          input.remove();

          e.preventDefault();
          finish(false);
        }
      });
      input.addEventListener('blur', () => finish(true));
    }

    function hexToHsv(hex) {
      const r = parseInt(hex.slice(1,3), 16) / 255;
      const g = parseInt(hex.slice(3,5), 16) / 255;
      const b = parseInt(hex.slice(5,7), 16) / 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      const d = max - min;
      const s = max === 0 ? 0 : d / max;
      const v = max;
      let h = 0;
      if (d !== 0) {
        if (max === r) h = ((g - b) / d) % 6;
        else if (max === g) h = (b - r) / d + 2;
        else h = (r - g) / d + 4;
        h *= 60;
        if (h < 0) h += 360;
      }
      return { h, s, v };
    }

    function hsvToHex(h, s, v) {
      const c = v * s;
      const x = c * (1 - Math.abs((h / 60) % 2 - 1));
      const m = v - c;
      let r, g, b;
      if (h < 60) { r = c; g = x; b = 0; }
      else if (h < 120) { r = x; g = c; b = 0; }
      else if (h < 180) { r = 0; g = c; b = x; }
      else if (h < 240) { r = 0; g = x; b = c; }
      else if (h < 300) { r = x; g = 0; b = c; }
      else { r = c; g = 0; b = x; }
      const toHex = n => Math.round((n + m) * 255).toString(16).padStart(2, '0');
      return '#' + toHex(r) + toHex(g) + toHex(b);
    }

    function showColorPickerPanel(projectId, initialColor, x, y) {
      document.querySelectorAll('.color-picker-panel').forEach(p => p.remove());
      const hsv = hexToHsv(initialColor);
      let curH = hsv.h, curS = hsv.s, curV = hsv.v;

      const panel = document.createElement('div');
      panel.className = 'color-picker-panel';
      panel.innerHTML = `
        <div class="color-picker-spectrum">
          <div class="color-picker-cursor"></div>
        </div>
        <div class="color-picker-hue-bar">
          <div class="color-picker-hue-thumb"></div>
        </div>
        <div class="color-picker-hex-row">
          <div class="color-picker-preview"></div>
          <input type="text" class="color-picker-hex-input" value="${initialColor.toUpperCase()}" maxlength="7">
        </div>
        <div class="color-picker-actions">
          <button class="skeleton-btn" data-action="cancel">取消</button>
          <button class="skeleton-btn primary" data-action="confirm">确定</button>
        </div>
      `;
      document.body.appendChild(panel);

      const spectrum = panel.querySelector('.color-picker-spectrum');
      const cursor = panel.querySelector('.color-picker-cursor');
      const hueBar = panel.querySelector('.color-picker-hue-bar');
      const hueThumb = panel.querySelector('.color-picker-hue-thumb');
      const preview = panel.querySelector('.color-picker-preview');
      const hexInput = panel.querySelector('.color-picker-hex-input');

      function updateUI() {
        spectrum.style.setProperty('--hue', curH);
        spectrum.style.background = `linear-gradient(to bottom, transparent, #000), linear-gradient(to right, #fff, hsl(${curH}, 100%, 50%))`;
        cursor.style.left = (curS * 100) + '%';
        cursor.style.top = ((1 - curV) * 100) + '%';
        hueThumb.style.left = (curH / 360 * 100) + '%';
        const hex = hsvToHex(curH, curS, curV);
        preview.style.background = hex;
        preview.style.setProperty('--project-color', hex);
        if (document.activeElement !== hexInput) hexInput.value = hex.toUpperCase();
      }

      function position() {
        const rect = panel.getBoundingClientRect();
        let left = x, top = y;
        if (left + rect.width > window.innerWidth - 8) left = window.innerWidth - rect.width - 8;
        if (top + rect.height > window.innerHeight - 8) top = y - rect.height - 40;
        panel.style.left = left + 'px';
        panel.style.top = top + 'px';
      }

      updateUI();
      position();

      let dragging = null;

      spectrum.addEventListener('mousedown', (e) => {
        e.preventDefault(); e.stopPropagation();
        dragging = 'sv';
        handleSV(e);
      });
      hueBar.addEventListener('mousedown', (e) => {
        e.preventDefault(); e.stopPropagation();
        dragging = 'hue';
        handleHue(e);
      });

      function handleSV(e) {
        const rect = spectrum.getBoundingClientRect();
        const px = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        const py = Math.max(0, Math.min(1, (e.clientY - rect.top) / rect.height));
        curS = px; curV = 1 - py;
        updateUI();
      }
      function handleHue(e) {
        const rect = hueBar.getBoundingClientRect();
        const px = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        curH = px * 360;
        updateUI();
      }

      document.addEventListener('mousemove', (e) => {
        if (dragging === 'sv') handleSV(e);
        else if (dragging === 'hue') handleHue(e);
      });
      document.addEventListener('mouseup', () => { dragging = null; });

      hexInput.addEventListener('input', (e) => {
        e.stopPropagation();
        const val = e.target.value.trim();
        if (/^#[0-9A-Fa-f]{6}$/.test(val)) {
          const h = hexToHsv(val);
          curH = h.h; curS = h.s; curV = h.v;
          updateUI();
        }
      });
      hexInput.addEventListener('click', (e) => e.stopPropagation());
      hexInput.addEventListener('keydown', (e) => { e.stopPropagation(); });

      panel.addEventListener('click', (e) => e.stopPropagation());
      panel.addEventListener('mousedown', (e) => e.stopPropagation());

      panel.querySelector('[data-action="cancel"]').addEventListener('click', (e) => {
        e.stopPropagation();
        panel.remove();
      });
      panel.querySelector('[data-action="confirm"]').addEventListener('click', (e) => {
        e.stopPropagation();
        const hex = hsvToHex(curH, curS, curV);
        updateProjectColor(projectId, hex);
        panel.remove();
        hideProjectContextMenu();
      });
    }
