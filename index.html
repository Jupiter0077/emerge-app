    function render() {
      // 清理可能残留在 body 上的菜单（从上一次 render 的 note-item 移出的）
      document.querySelectorAll('body > .note-menu').forEach(m => m.remove());
      document.querySelectorAll('body > .idea-tooltip').forEach(t => t.remove());
      document.querySelectorAll('body > .attached-idea-menu').forEach(m => m.remove());
      todayDateEl.textContent = formatTodayHeader();

      // 时间块规划页隐藏主输入栏（该页不放输入框）
      const inputWrapEl = document.querySelector('.input-wrap');
      if (inputWrapEl) inputWrapEl.style.display = (activeFilter === ANCHOR_ID) ? 'none' : '';

      let notes = loadNotes();
      // 启动时清理空待办和空子待办（排除正在编辑的待办）
      let _needsClean = false;
      notes.forEach(note => {
        if (note.type === 'todo' && (!note.text || !note.text.trim()) && String(note.id) !== String(editingNoteId)) {
          note._empty = true;
          _needsClean = true;
        }
        if (note.subTodos) {
          const before = note.subTodos.length;
          note.subTodos = note.subTodos.filter(s => s.text && s.text.trim());
          if (note.subTodos.length !== before) _needsClean = true;
          if (note.subTodos.length === 0) delete note.subTodos;
        }
      });
      if (_needsClean) {
        notes = notes.filter(n => !n._empty);
        saveNotes(notes);
      }
      const projects = loadProjects();

      container.innerHTML = '';
      container.ondragover = null;
      container.ondrop = null;
      if (pendingDraftContainer) {
        pendingDraftContainer.innerHTML = '';
      }

      // 时间骨架特殊视图
      if (activeFilter === ANCHOR_ID) {
        renderSkeletonEditor();
        renderIdeaPanel(null);
        return;
      }

      // 打卡特殊视图
      if (activeFilter === CHECKIN_ID) {
        const checkinNotes = notes.filter(note => note.projectId === CHECKIN_ID);
        if (checkinNotes.length === 0) {
          container.innerHTML = '<p class="empty-hint">还没有打卡记录</p>';
          return;
        }
        const typeSections = [
          { type: 'todo', title: t('待办') },
          { type: 'goal', title: t('里程碑') },
          { type: 'idea', title: t('想法') },
        ];
        for (const section of typeSections) {
          const sectionNotes = checkinNotes.filter(n => n.type === section.type);
          if (sectionNotes.length === 0) continue;
          const sec = document.createElement('section');
          sec.className = 'type-section';
          const label = document.createElement('div');
          label.className = 'type-section-title';
          label.textContent = section.title;
          sec.appendChild(label);
          const list = document.createElement('ul');
          list.className = 'note-list';
          for (const note of sectionNotes) {
            try {
              const item = createNoteItem(note, projects, true);
              list.appendChild(item);
            } catch (err) {
              console.warn('[打卡视图] 渲染 note 出错，已跳过:', note, err);
            }
          }
          sec.appendChild(list);
          container.appendChild(sec);
        }
        return;
      }

      // 找回未归类里程碑
      if (activeFilter === ORPHAN_GOALS_ID) {
        const orphanGoals = getOrphanGoals().sort((a, b) => b.timestamp - a.timestamp);
        const allGoals = notes
          .filter(note => note.type === 'goal')
          .sort((a, b) => b.timestamp - a.timestamp);

        const section = document.createElement('section');
        section.className = 'type-section';

        const label = document.createElement('div');
        label.className = 'type-section-title';
        label.textContent = t('未归类里程碑');
        section.appendChild(label);

        const hint = document.createElement('p');
        hint.className = 'empty-hint';
        hint.textContent = orphanGoals.length > 0
          ? t('把里程碑拖到左侧项目，或用三点菜单移动到项目，就能恢复到项目页。')
          : t('暂时没检测到未归类里程碑。下面列出全部里程碑，方便你核对。');
        section.appendChild(hint);

        const list = document.createElement('ul');
        list.className = 'note-list';
        const goalsToShow = orphanGoals.length > 0 ? orphanGoals : allGoals;
        if (goalsToShow.length === 0) {
          const empty = document.createElement('p');
          empty.className = 'empty-hint';
          empty.textContent = '没有找到任何里程碑记录';
          section.appendChild(empty);
        }
        goalsToShow.forEach(note => {
          try {
            const item = createNoteItem(note, projects, false);
            list.appendChild(item);
          } catch (err) {
            console.warn('[未归类里程碑] 渲染 note 出错，已跳过:', note, err);
          }
        });

        section.appendChild(list);
        container.appendChild(section);
        return;
      }

      if (activeFilter === 'all') {
        const filteredNotes = notes.filter(note => {
          // 循环执行日志只在日历显示，不进记录流
          if (note.type === 'todo-log') return false;
          // 主页记录流只显示未归类记录；拖到项目后就进入项目页
          if (note.projectId) {
            return false;
          }
          if (note.type === 'todo' && note.completed && note.scheduledDate) {
            return false;
          }
          // 未来安排的未完成待办：日期未到时隐藏，到期/过期后自动重新出现在列表
          if (note.type === 'todo' && !note.completed && note.scheduledDate) {
            const todayKey = toDateKey(new Date());
            if (note.scheduledDate > todayKey) {
              return false;
            }
          }
          // 已标记为"下一步行动"的待办只在下一步面板中显示，不在记录流重复显示
          if (note.type === 'todo' && note.isNextAction) {
            return false;
          }
          return true;
        });

        const homeNotesToRender = filteredNotes
          .slice()
          .sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0))
          .slice(0, HOME_RECORD_RENDER_LIMIT);
        const hiddenHomeRecordCount = Math.max(0, filteredNotes.length - homeNotesToRender.length);

        if (filteredNotes.length === 0) {
          const empty = document.createElement('p');
          empty.className = 'empty-hint';
          empty.textContent = t('还没有记录');
          container.appendChild(empty);
        } else {
          const groups = groupByDate(homeNotesToRender);
          const sortedKeys = [...groups.keys()].sort((a, b) => b.localeCompare(a));

          for (const dateKey of sortedKeys) {
            const dayNotes = groups.get(dateKey);
            dayNotes.sort((a, b) => {
              const aOrder = a.order != null ? a.order : (a.timestamp || 0);
              const bOrder = b.order != null ? b.order : (b.timestamp || 0);
              return bOrder - aOrder;
            });

            const section = document.createElement('section');
            section.className = 'day-group home-record-section';

            const label = document.createElement('div');
            label.className = 'day-label';
            label.textContent = formatDayLabel(dateKey);
            section.appendChild(label);

            const list = document.createElement('ul');
            list.className = 'note-list reorder-list';

            list.addEventListener('dragover', (e) => {
              const draggingItem = list.querySelector('.note-item.dragging');
              if (!draggingItem) return;
              e.preventDefault();
              const afterElement = getDragAfterElement(list, e.clientY);
              if (afterElement == null) {
                list.appendChild(draggingItem);
              } else {
                list.insertBefore(draggingItem, afterElement);
              }
            });

            list.addEventListener('drop', (e) => {
              const draggingItem = list.querySelector('.note-item.dragging');
              if (!draggingItem) return;
              e.preventDefault();
              e.stopPropagation();
              const items = Array.from(list.querySelectorAll('.note-item'));
              const notes = loadNotes();
              const itemIds = items.map(el => String(el.dataset.noteId));
              const baseOrder = Date.now();
              itemIds.forEach((id, idx) => {
                const n = notes.find(nn => String(nn.id) === String(id));
                if (n) {
                  n.order = baseOrder + (itemIds.length - idx) * 1000;
                }
              });
              saveNotes(notes);
              render();
            });

            for (const note of dayNotes) {
              try {
                const item = createNoteItem(note, projects, false);
                item.classList.add('home-record-item');
                // 记录流：将复选框移入文字内部，紧跟最后一个字（在三点菜单之前）
                const cb = item.querySelector('.todo-checkbox');
                const nt = item.querySelector('.note-text');
                if (cb && nt) {
                  const actions = nt.querySelector('.note-actions');
                  if (actions) nt.insertBefore(cb, actions);
                  else nt.appendChild(cb);
                }
                list.appendChild(item);
              } catch (err) {
                console.warn('[主页记录] 渲染 note 出错，已跳过:', note, err);
              }
            }

            section.appendChild(list);
            container.appendChild(section);
          }

          if (hiddenHomeRecordCount > 0) {
            const moreHint = document.createElement('p');
            moreHint.className = 'empty-hint';
            moreHint.textContent = `首页先显示最近 ${HOME_RECORD_RENDER_LIMIT} 条记录，另有 ${hiddenHomeRecordCount} 条旧记录已收起；完整内容仍可在导出数据或项目页中查看。`;
            container.appendChild(moreHint);
          }
        }
        try {
          renderNextActionHome(notes, projects);
        } catch (err) {
          console.error('[render] renderNextActionHome 出错:', err);
        }
        scheduleStableWeekPanelRender();
        try {
          renderIdeaPanel(null);
        } catch (err) {
          console.error('[render] renderIdeaPanel 出错:', err);
        }
        return;
      } else {
        const projectNotes = notes.filter(note => note.projectId === activeFilter);
        container.ondragover = (e) => {
          if (e.dataTransfer.types.includes('text/x-sub-todo-id')) {
            e.preventDefault();
          }
        };
        container.ondrop = (e) => {
          if (!e.dataTransfer.types.includes('text/x-sub-todo-id')) return;
          if (e.target.closest('.note-item, .sub-todo-item, .goal-section, .note-list, .completed-todo-group')) return;
          e.preventDefault();
          const subTodoId = e.dataTransfer.getData('text/x-sub-todo-id');
          const subParentId = e.dataTransfer.getData('text/x-sub-parent-id');
          if (subTodoId && subParentId) {
            promoteSubTodoToTodo(subParentId, subTodoId, activeFilter, null);
          }
        };
        if (projectNotes.length === 0) {
          container.innerHTML = '<p class="empty-hint">还没有记录</p>';
          return;
        }

        // 找出所有里程碑
        const goals = projectNotes.filter(n => n.type === 'goal');
        goals.sort((a, b) => {
          if (a.order != null && b.order != null) return b.order - a.order;
          if (a.order != null) return -1;
          if (b.order != null) return 1;
          // 没有手动排序时，按添加时间从早到晚排
          const aTime = a.timestamp || 0;
          const bTime = b.timestamp || 0;
          return aTime - bTime;
        });

        // 拆分已完成和未完成的里程碑
        const completedGoals = [];
        const uncompletedGoals = [];
        goals.forEach((goal, idx) => {
          const goalTodos = projectNotes.filter(n => n.type === 'todo' && String(n.parentGoalId) === String(goal.id));
          if (isGoalAllTodosCompleted(goalTodos)) {
            completedGoals.push({ goal, originalIndex: idx });
          } else {
            uncompletedGoals.push({ goal, originalIndex: idx });
          }
        });

        // 找出所有想法
        const ideas = projectNotes.filter(n => n.type === 'idea');
        ideas.sort((a, b) => b.timestamp - a.timestamp);

        // 找出不属于任何里程碑的待办
        const ungroupedTodos = projectNotes.filter(n => n.type === 'todo' && !n.parentGoalId);
        const completedUngroupedTodos = ungroupedTodos.filter(t => t.completed).sort(sortCompletedTodosByScheduledTime);
        const activeUngroupedTodos = ungroupedTodos.filter(t => !t.completed).sort(sortTodosByCreatedAsc);

        // 找出其他（无类型）
        const untypedNotes = projectNotes.filter(n => (!n.type || (n.type !== 'goal' && n.type !== 'idea' && n.type !== 'todo')) && n.type !== 'todo-log');
        untypedNotes.sort((a, b) => b.timestamp - a.timestamp);

        // 未分组的待办放在项目页最上方
        if (ungroupedTodos.length > 0) {
          const sec = document.createElement('section');
          sec.className = 'type-section ungrouped-todos';

          const list = document.createElement('ul');
          list.className = 'note-list reorder-list';
          list.dataset.sectionType = 'todo';

          // 支持接收想法拖放和跨里程碑待办拖放
          sec.addEventListener('dragover', (e) => {
            if (e.dataTransfer.types.includes('text/x-sub-todo-id')) {
              e.preventDefault();
              sec.classList.add('idea-drag-over');
              return;
            }
            if (!e.dataTransfer.types.includes('text/x-note-id') && !e.dataTransfer.types.includes('text/x-sub-todo-id')) return;
            e.preventDefault();
            // 使用全局变量判断拖拽类型（dragover期间getData不可靠）
            if (_draggedNoteType === 'idea') {
              sec.classList.add('idea-drag-over');
              return;
            }
            // 跨区域拖入待办/子待办：显示占位符
            if (_draggedNoteType === 'todo' || _draggedNoteType === 'sub-todo') {
              const draggingItem = list.querySelector('.note-item.dragging');
              if (!draggingItem) {
                const afterElement = getDragAfterElement(list, e.clientY, '.note-item:not(.dragging)');
                _showMilestonePlaceholder(list, afterElement);
              }
            }
          });
          sec.addEventListener('dragleave', (e) => {
            if (!sec.contains(e.relatedTarget)) {
              sec.classList.remove('idea-drag-over');
              _removeMilestonePlaceholder();
            }
          });
          sec.addEventListener('drop', (e) => {
            e.preventDefault();
            sec.classList.remove('idea-drag-over');
            _removeMilestonePlaceholder(true);
            const subTodoId = e.dataTransfer.getData('text/x-sub-todo-id');
            const subParentId = e.dataTransfer.getData('text/x-sub-parent-id');
            if (subTodoId && subParentId) {
              promoteSubTodoToTodo(subParentId, subTodoId, activeFilter, null);
              return;
            }
            const noteId = e.dataTransfer.getData('text/x-note-id') || e.dataTransfer.getData('text/plain');
            if (noteId) {
              const notes = loadNotes();
              const note = notes.find(n => String(n.id) === String(noteId));
              if (note && note.type === 'idea') {
                // 想法转换为待办
                note.type = 'todo';
                delete note.parentGoalId;
                saveNotes(notes);
                render();
              } else if (note && note.type === 'todo' && note.parentGoalId) {
                // 跨里程碑拖入：移出里程碑
                delete note.parentGoalId;
                note.projectId = activeFilter;
                saveNotes(notes);
                render();
              }
            }
          });

          list.addEventListener('dragover', (e) => {
            e.preventDefault();
            if (e.dataTransfer.types.includes('text/x-sub-todo-id')) {
              list.classList.add('subtodo-promote-target');
              const afterElement = getDragAfterElement(list, e.clientY, '.note-item:not(.dragging)');
              _showMilestonePlaceholder(list, afterElement);
              return;
            }
            const draggingItem = list.querySelector('.note-item.dragging');
            if (!draggingItem) {
              // 跨区域拖入：显示占位符
              if (_draggedNoteType === 'todo' || _draggedNoteType === 'sub-todo') {
                const afterElement = getDragAfterElement(list, e.clientY, '.note-item:not(.dragging)');
                _showMilestonePlaceholder(list, afterElement);
              }
              return;
            }
            // 内部排序：清除占位符
            _removeMilestonePlaceholder(true);
            const afterElement = getDragAfterElement(list, e.clientY);
            if (afterElement == null) {
              list.appendChild(draggingItem);
            } else {
              list.insertBefore(draggingItem, afterElement);
            }
          });
          list.addEventListener('dragleave', (e) => {
            if (!list.contains(e.relatedTarget)) {
              list.classList.remove('subtodo-promote-target');
            }
          });

          list.addEventListener('drop', (e) => {
            e.preventDefault();
            list.classList.remove('subtodo-promote-target');
            _removeMilestonePlaceholder(true);
            const subTodoId = e.dataTransfer.getData('text/x-sub-todo-id');
            const subParentId = e.dataTransfer.getData('text/x-sub-parent-id');
            if (subTodoId && subParentId) {
              e.stopPropagation();
              promoteSubTodoToTodo(subParentId, subTodoId, activeFilter, null);
              return;
            }
            const draggingItem = list.querySelector('.note-item.dragging');
            if (!draggingItem) return; // 跨区域拖放：不阻止冒泡，交给上层 drop 处理
            e.stopPropagation();
            const draggedId = draggingItem.dataset.noteId;
            const items = Array.from(list.querySelectorAll('.note-item'));
            const newIndex = items.findIndex(el => el.dataset.noteId === draggedId);

            const notes = loadNotes();
            const sectionNoteIds = items.map(el => String(el.dataset.noteId));
            const baseOrder = Date.now();
            sectionNoteIds.forEach((id, idx) => {
              const n = notes.find(nn => String(nn.id) === String(id));
              if (n) {
                n.order = baseOrder + idx * 1000;
                delete n.parentGoalId;
              }
            });
            saveNotes(notes);
            render();
          });

          const completedGroup = renderCompletedTodoGroup(completedUngroupedTodos, projects, 'project-' + activeFilter + '-ungrouped');
          if (completedGroup) sec.appendChild(completedGroup);

          activeUngroupedTodos.forEach(note => {
            try {
              const item = createNoteItem(note, projects, true);
              list.appendChild(item);
            } catch (err) {
              console.warn('[项目视图未分组] 渲染 note 出错，已跳过:', note, err);
            }
          });

          if (activeUngroupedTodos.length > 0) {
            sec.appendChild(list);
          }
          container.appendChild(sec);
        }

        // 已完成里程碑徽章集邮
        if (completedGoals.length > 0) {
          const badgeCollection = document.createElement('div');
          badgeCollection.className = 'milestone-badge-collection';
          const badgeRow = document.createElement('div');
          badgeRow.className = 'badge-row';
          badgeCollection.appendChild(badgeRow);
          const projectColor = getProjectColor(activeFilter);

          completedGoals.forEach(({ goal }, stampIdx) => {
            const badge = document.createElement('div');
            badge.className = 'milestone-stamp';
            badge.dataset.goalId = goal.id;
            badge.style.setProperty('--badge-color', projectColor);
            badge.innerHTML = `
              <span class="stamp-number">M${stampIdx + 1}</span>
              <span class="stamp-title"></span>
            `;
            badge.querySelector('.stamp-title').textContent = goal.text;

            const panel = document.createElement('div');
            panel.className = 'milestone-stamp-panel';
            panel.dataset.goalId = goal.id;
            const panelContent = document.createElement('div');
            panelContent.className = 'milestone-stamp-panel-content';
            const goalTodos = projectNotes.filter(n => n.type === 'todo' && String(n.parentGoalId) === String(goal.id));
            const completedGoalTodos = goalTodos.filter(t => t.completed).sort(sortCompletedTodosByScheduledTime);
            if (completedGoalTodos.length > 0) {
              const list = document.createElement('ul');
              list.className = 'note-list stamp-todo-list';
              completedGoalTodos.forEach(todo => {
                const item = createNoteItem(todo, projects, true);
                list.appendChild(item);
              });
              panelContent.appendChild(list);
            }
            const addTodoBtn = document.createElement('button');
            addTodoBtn.className = 'stamp-add-todo';
            addTodoBtn.textContent = '+ 添加待办';
            addTodoBtn.addEventListener('click', (e) => {
              e.stopPropagation();
              addTodoToGoal(goal.id);
            });
            panelContent.appendChild(addTodoBtn);
            panel.appendChild(panelContent);

            let stampClickTimer = null;
            badge.addEventListener('click', (e) => {
              e.stopPropagation();
              if (stampClickTimer) {
                clearTimeout(stampClickTimer);
                stampClickTimer = null;
                if (badge.classList.contains('full-expanded')) {
                  badge.classList.remove('full-expanded', 'title-expanded');
                  panel.classList.remove('show');
                } else {
                  badgeRow.querySelectorAll('.milestone-stamp').forEach(b => b.classList.remove('full-expanded', 'title-expanded'));
                  badgeCollection.querySelectorAll('.milestone-stamp-panel').forEach(p => p.classList.remove('show'));
                  badge.classList.add('full-expanded', 'title-expanded');
                  panel.classList.add('show');
                }
                return;
              }
              stampClickTimer = setTimeout(() => {
                stampClickTimer = null;
                if (badge.classList.contains('full-expanded')) {
                  badge.classList.remove('full-expanded', 'title-expanded');
                  panel.classList.remove('show');
                } else if (badge.classList.contains('title-expanded')) {
                  badge.classList.remove('title-expanded');
                } else {
                  badgeRow.querySelectorAll('.milestone-stamp.title-expanded:not(.full-expanded)').forEach(b => b.classList.remove('title-expanded'));
                  badge.classList.add('title-expanded');
                }
              }, 250);
            });

            badgeRow.appendChild(badge);
            badgeCollection.appendChild(panel);
          });

          container.appendChild(badgeCollection);
        }

        // 里程碑容器（支持排序）
        if (uncompletedGoals.length > 0) {
          const goalContainer = document.createElement('div');
          goalContainer.className = 'milestone-container';

          goalContainer.addEventListener('dragover', (e) => {
            e.preventDefault();
            const dragging = goalContainer.querySelector('.goal-section.dragging');
            if (!dragging) return;
            const sections = Array.from(goalContainer.querySelectorAll('.goal-section'));
            const afterEl = getDragAfterElement(goalContainer, e.clientY, '.goal-section');
            if (afterEl == null) {
              goalContainer.appendChild(dragging);
            } else {
              goalContainer.insertBefore(dragging, afterEl);
            }
            // 更新序号显示
            updateMilestoneNumbers(goalContainer);
          });

          goalContainer.addEventListener('drop', (e) => {
            e.preventDefault();
            const dragging = goalContainer.querySelector('.goal-section.dragging');
            if (!dragging) return;
            const draggedId = dragging.dataset.goalId;
            const sections = Array.from(goalContainer.querySelectorAll('.goal-section'));

            const notes = loadNotes();
            const allGoals = notes.filter(n => n.type === 'goal' && String(n.projectId) === String(activeFilter));
            const goalIds = sections.map(s => String(s.dataset.goalId));
            const minOrder = Math.min(...allGoals.map(g => g.order != null ? g.order : (g.timestamp || 0)));
            goalIds.forEach((id, idx) => {
              const n = notes.find(nn => String(nn.id) === String(id));
              if (n) {
                n.order = minOrder + (goalIds.length - idx) * 100;
              }
            });
            saveNotes(notes);
            render();
          });

          uncompletedGoals.forEach(({ goal }, index) => {
            const goalTodos = projectNotes.filter(n => n.type === 'todo' && String(n.parentGoalId) === String(goal.id));
            const sortByOrder = (a, b) => {
              const aVal = a.order != null ? a.order : (a.timestamp || 0);
              const bVal = b.order != null ? b.order : (b.timestamp || 0);
              return aVal - bVal;
            };
            const completedGoalTodos = goalTodos.filter(t => t.completed).sort(sortCompletedTodosByScheduledTime);
            const activeGoalTodos = goalTodos.filter(t => !t.completed).sort(sortByOrder);

            const sec = document.createElement('section');
            sec.className = 'goal-section type-section' + (goal.isCurrentGoal ? ' current-goal' : '');
            sec.dataset.goalId = goal.id;
            sec.dataset.milestoneIndex = completedGoals.length + index;

            // 每个里程碑都设置项目色变量（用于进度条颜色等）
            const pc = getProjectColor(activeFilter);
            sec.style.setProperty('--goal-project-color', pc);

            // 读取折叠状态
            const goalCollapsedKey = 'goal-collapsed-' + goal.id;
            const isGoalCollapsed = localStorage.getItem(goalCollapsedKey) === '1';
            if (isGoalCollapsed) {
              sec.classList.add('collapsed');
            }

            // 里程碑序号标签
            const milestoneBadge = document.createElement('div');
            milestoneBadge.className = 'milestone-badge';
            milestoneBadge.textContent = `M${completedGoals.length + index + 1}`;
            sec.appendChild(milestoneBadge);

            // 里程碑内容容器（标题+待办列表）
            const goalContent = document.createElement('div');
            goalContent.className = 'goal-content';

            // 里程碑标题行（可拖拽接收待办）
            const goalHeader = document.createElement('div');
            goalHeader.className = 'goal-header';
            goalHeader.dataset.goalId = goal.id;

            const goalItem = createNoteItem(goal, projects, true);
            goalItem.classList.add('goal-item');

            // 里程碑标题使用项目颜色（!important 覆盖深色模式的全局颜色）
            const projectColor = getProjectColor(activeFilter);
            const goalText = goalItem.querySelector('.note-text');
            if (goalText) {
              goalText.style.setProperty('color', projectColor, 'important');
              goalText.style.setProperty('font-weight', '600', 'important');
            }

            // 整个里程碑卡片可拖拽（编辑里程碑标题/待办/子待办时禁用，以便鼠标拖选复制文本）
            const isEditingInMilestone =
              String(editingNoteId) === String(goal.id) ||
              goalTodos.some(t =>
                String(t.id) === String(editingNoteId) ||
                String(t.id) === String(editingSubTodoParentId)
              );
            sec.draggable = !isEditingInMilestone;
            sec.addEventListener('dragstart', (e) => {
              // 如果拖动的是待办等子元素（非里程碑标题），不拦截，让子元素自己的 dragstart 数据生效
              const noteItem = e.target.closest('.note-item');
              if (noteItem && !noteItem.classList.contains('goal-item')) {
                return;
              }
              // 如果正在操作按钮/菜单/输入框，不触发拖拽
              if (e.target.closest('.note-action') || e.target.closest('.note-menu') || e.target.closest('.note-edit-input') || e.target.closest('input') || e.target.closest('button')) {
                e.preventDefault();
                return;
              }
              e.dataTransfer.setData('text/x-goal-id', String(goal.id));
              e.dataTransfer.setData('text/x-note-id', String(goal.id));
              e.dataTransfer.setData('text/plain', String(goal.id));
              sec.classList.add('dragging');
            });
            sec.addEventListener('dragend', () => {
              sec.classList.remove('dragging');
              goalContainer.querySelectorAll('.goal-section').forEach(s => s.classList.remove('drag-over'));
            });

            // 点击标题切换折叠 / 双击标题添加待办（排除操作按钮和菜单）
            let goalHeaderClickTimer = null;
            goalHeader.addEventListener('click', (e) => {
              if (e.target.closest('.note-action') || e.target.closest('.note-menu') || e.target.closest('.note-edit-input')) return;
              if (goalHeaderClickTimer) {
                clearTimeout(goalHeaderClickTimer);
                goalHeaderClickTimer = null;
                return;
              }
              goalHeaderClickTimer = setTimeout(() => {
                goalHeaderClickTimer = null;
                const nextCollapsed = !sec.classList.contains('collapsed');
                const animTargets = [sec.querySelector('.goal-todo-list'), sec.querySelector('.completed-todo-group')].filter(el => el);

                if (nextCollapsed) {
                  animTargets.forEach(el => {
                    el.style.height = el.scrollHeight + 'px';
                    el.offsetHeight;
                  });
                  requestAnimationFrame(() => {
                    sec.classList.add('collapsed');
                    animTargets.forEach(el => {
                      el.style.height = '0';
                      el.style.opacity = '0';
                    });
                  });
                  setTimeout(() => {
                    animTargets.forEach(el => {
                      el.style.height = '';
                      el.style.opacity = '';
                    });
                  }, 240);
                } else {
                  sec.classList.remove('collapsed');
                  animTargets.forEach(el => {
                    el.style.height = '0';
                    el.style.opacity = '0';
                    el.offsetHeight;
                  });
                  requestAnimationFrame(() => {
                    animTargets.forEach(el => {
                      el.style.height = el.scrollHeight + 'px';
                      el.style.opacity = '1';
                    });
                  });
                  setTimeout(() => {
                    animTargets.forEach(el => {
                      el.style.height = '';
                      el.style.opacity = '';
                    });

                }
                localStorage.setItem(goalCollapsedKey, nextCollapsed ? '1' : '0');
              }, 180);
            });
            // 双击标题添加待办
            goalHeader.addEventListener('dblclick', (e) => {
              if (e.target.closest('.note-action') || e.target.closest('.note-menu') || e.target.closest('.note-edit-input')) return;

                clearTimeout(goalHeaderClickTimer);
                goalHeaderClickTimer = null;
              }
              addTodoToGoal(goal.id);

            goalHeader.appendChild(goalItem);

            // 里程碑进度条（循环待办按 已完成次数/总次数 计入）
            const totalTodos = goalTodos.reduce((s, t) => s + getTodoTotalCount(t), 0);
            const completedTodos = goalTodos.reduce((s, t) => s + getTodoDoneCount(t), 0);
            const progressPercent = totalTodos > 0 ? Math.round((completedTodos / totalTodos) * 100) : 0;

            const progressWrap = document.createElement('div');
            progressWrap.className = 'milestone-progress-wrap';

            const progressBar = document.createElement('div');
            progressBar.className = 'milestone-progress-bar';
            const progressFill = document.createElement('div');
            progressFill.className = 'milestone-progress-fill';
            progressFill.style.width = progressPercent + '%';
            progressBar.appendChild(progressFill);

            const progressText = document.createElement('span');
            progressText.className = 'milestone-progress-text';
            progressText.textContent = `${completedTodos}/${totalTodos}`;

            progressWrap.appendChild(progressBar);
            progressWrap.appendChild(progressText);
            goalHeader.appendChild(progressWrap);

            goalContent.appendChild(goalHeader);

            // 里程碑下的待办列表
            if (goalTodos.length > 0) {

              if (completedGroup) goalContent.appendChild(completedGroup);

              const todoList = document.createElement('ul');
              todoList.className = 'note-list goal-todo-list reorder-list';
              todoList.dataset.goalId = goal.id;

              todoList.addEventListener('dragover', (e) => {
                e.preventDefault();
                if (e.dataTransfer.types.includes('text/x-sub-todo-id')) {
                  todoList.classList.add('subtodo-promote-target');
                  const afterElement = getDragAfterElement(todoList, e.clientY, '.note-item:not(.dragging)');
                  _showMilestonePlaceholder(todoList, afterElement);
                  return;
                }
                const draggingItem = todoList.querySelector('.note-item.dragging');
                if (!draggingItem) {
                  // 跨里程碑拖入：显示占位符，其他待办腾出位置
                  if (_draggedNoteType === 'todo' || _draggedNoteType === 'sub-todo') {
                    const afterElement = getDragAfterElement(todoList, e.clientY, '.note-item:not(.dragging)');
                    _showMilestonePlaceholder(todoList, afterElement);
                  }
                  return;
                }
                // 内部排序：清除占位符
                _removeMilestonePlaceholder(true);
                const afterElement = getDragAfterElement(todoList, e.clientY);
                if (afterElement == null) {
                  todoList.appendChild(draggingItem);
                } else {
                  todoList.insertBefore(draggingItem, afterElement);
                }
              });
              todoList.addEventListener('dragleave', (e) => {
                if (!todoList.contains(e.relatedTarget)) {
                  todoList.classList.remove('subtodo-promote-target');
                }
              });

              todoList.addEventListener('drop', (e) => {
                e.preventDefault();
                todoList.classList.remove('subtodo-promote-target');
                _removeMilestonePlaceholder(true);
                const subTodoId = e.dataTransfer.getData('text/x-sub-todo-id');
                const subParentId = e.dataTransfer.getData('text/x-sub-parent-id');
                if (subTodoId && subParentId) {
                  e.stopPropagation();
                  promoteSubTodoToTodo(subParentId, subTodoId, activeFilter, goal.id);
                  return;
                }
                const draggingItem = todoList.querySelector('.note-item.dragging');
                if (!draggingItem) {
                  // 跨列表拖入待办：根据精确位置插入
                  const noteId = e.dataTransfer.getData('text/x-note-id') || e.dataTransfer.getData('text/plain');
                  const isGoal = e.dataTransfer.types.includes('text/x-goal-id');
                  if (noteId && !isGoal && _draggedNoteType === 'todo') {
                    e.stopPropagation();
                    const notes = loadNotes();
                    const note = notes.find(n => String(n.id) === String(noteId));
                    if (note && note.type === 'todo') {
                      const listItems = Array.from(todoList.querySelectorAll('.note-item'));
                      const afterElement = getDragAfterElement(todoList, e.clientY, '.note-item:not(.dragging)');
                      let insertIndex;
                      if (afterElement == null) {
                        insertIndex = listItems.length;
                      } else {
                        insertIndex = listItems.findIndex(el => el === afterElement);
                        if (insertIndex < 0) insertIndex = listItems.length;
                      }
                      const beforeNote = insertIndex > 0 ? notes.find(n => String(n.id) === String(listItems[insertIndex - 1].dataset.noteId)) : null;
                      const afterNote = insertIndex < listItems.length ? notes.find(n => String(n.id) === String(listItems[insertIndex].dataset.noteId)) : null;
                      let newOrder;
                      if (beforeNote && afterNote) {
                        newOrder = ((beforeNote.order || 0) + (afterNote.order || 0)) / 2;
                      } else if (beforeNote) {
                        newOrder = (beforeNote.order || 0) + 1000;
                      } else if (afterNote) {
                        newOrder = (afterNote.order || 0) / 2;
                      } else {
                        newOrder = 1000;
                      }
                      note.parentGoalId = goal.id;
                      note.projectId = activeFilter;
                      note.order = newOrder;
                      saveNotes(notes);
                      render();
                      _flashMilestoneReceived(goal.id);
                    }
                  }
                  return;
                }
                e.stopPropagation();
                const draggedId = draggingItem.dataset.noteId;
                const items = Array.from(todoList.querySelectorAll('.note-item'));
                const newIndex = items.findIndex(el => el.dataset.noteId === draggedId);

                const notes = loadNotes();
                const todoIds = items.map(el => String(el.dataset.noteId));
                const baseOrder = Date.now();
                todoIds.forEach((id, idx) => {
                  const n = notes.find(nn => String(nn.id) === String(id));
                  if (n) {
                    n.order = baseOrder + idx * 1000;

                    n.type = 'todo';

                saveNotes(notes);
                render();

              const hasManualNext = activeGoalTodos.some(t => t.isNextAction && !t.completed);

                item.classList.add('goal-todo-item');
                if (goal.isCurrentGoal && !todo.completed) {
                  if (todo.isNextAction) {
                    item.classList.add('manual-next-action');

                    item.classList.add('default-next-action');

              });

            } else {

              const dropHint = document.createElement('div');
              dropHint.className = 'goal-drop-hint';
              const hintText = document.createElement('span');
              hintText.textContent = '拖待办到此处';
              dropHint.appendChild(hintText);
              const addTodoBtn = document.createElement('button');
              addTodoBtn.className = 'goal-add-todo-btn';
              addTodoBtn.textContent = '+ 添加待办';
              addTodoBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                addTodoToGoal(goal.id);
              });
              dropHint.appendChild(addTodoBtn);
              dropHint.addEventListener('dragover', (e) => {
                if (e.dataTransfer.types.includes('text/x-sub-todo-id')) {
                  e.preventDefault();
                  dropHint.classList.add('subtodo-promote-target');
                }
              });
              dropHint.addEventListener('dragleave', () => {
                dropHint.classList.remove('subtodo-promote-target');
              });
              dropHint.addEventListener('drop', (e) => {
                e.preventDefault();
                dropHint.classList.remove('subtodo-promote-target');

                const subParentId = e.dataTransfer.getData('text/x-sub-parent-id');

                  promoteSubTodoToTodo(subParentId, subTodoId, activeFilter, goal.id);

              });

            // 里程碑区域整体支持拖放待办和想法
            sec.addEventListener('dragover', (e) => {

              if (_draggedNoteType === 'idea') {
                sec.classList.add('idea-drag-over');
                return;
              }
              // 跨里程碑拖入待办/子待办：显示占位符，其他待办腾出位置
              if (_draggedNoteType === 'todo' || _draggedNoteType === 'sub-todo') {
                const todoList = sec.querySelector('.goal-todo-list');
                if (todoList) {
                  const draggingItem = todoList.querySelector('.note-item.dragging');
                  if (!draggingItem) {
                    const afterElement = getDragAfterElement(todoList, e.clientY, '.note-item:not(.dragging)');
                    _showMilestonePlaceholder(todoList, afterElement);
                  }
                }
              }
            });
            sec.addEventListener('dragleave', (e) => {
              if (!sec.contains(e.relatedTarget)) {
                sec.classList.remove('drag-over');
                sec.classList.remove('idea-drag-over');
                _removeMilestonePlaceholder();
              }
            });
            sec.addEventListener('drop', (e) => {
              e.preventDefault();
              sec.classList.remove('drag-over');
              sec.classList.remove('idea-drag-over');
              _removeMilestonePlaceholder(true);
              // 备注想法拖入里程碑
              var attachedIdeaData = e.dataTransfer.getData('text/x-attached-idea');
              if (attachedIdeaData) {
                try {
                  var parsed = JSON.parse(attachedIdeaData);
                  if (parsed.type === 'attachedIdea' && String(parsed.noteId) !== String(goal.id)) {
                    moveAttachedIdea(parsed.noteId, parsed.ideaId, goal.id);
                    return;
                  }
                } catch(_) {}
              }
              const draftId = e.dataTransfer.getData('text/x-pending-draft-id');
              if (draftId) {
                attachPendingDraftToNote(draftId, goal.id);
                return;
              }
              const subTodoId = e.dataTransfer.getData('text/x-sub-todo-id');
              const subParentId = e.dataTransfer.getData('text/x-sub-parent-id');
              if (subTodoId && subParentId) {
                promoteSubTodoToTodo(subParentId, subTodoId, activeFilter, goal.id);
                return;
              }
              const noteId = e.dataTransfer.getData('text/x-note-id') || e.dataTransfer.getData('text/plain');
              const isGoal = e.dataTransfer.types.includes('text/x-goal-id');
              if (noteId && !isGoal) {
                const notes = loadNotes();
                const note = notes.find(n => String(n.id) === String(noteId));
                if (note) {
                  if (note.type === 'todo') {
                    note.parentGoalId = goal.id;
                    note.projectId = activeFilter;
                    const tl = sec.querySelector('.goal-todo-list');
                    const listItems = tl ? Array.from(tl.querySelectorAll('.note-item:not(.dragging)')) : [];
                    const afterElement = tl ? getDragAfterElement(tl, e.clientY, '.note-item:not(.dragging)') : null;
                    let insertIndex;
                    if (afterElement == null) {
                      insertIndex = listItems.length;
                    } else {
                      insertIndex = listItems.findIndex(el => el === afterElement);
                      if (insertIndex < 0) insertIndex = listItems.length;
                    }
                    const beforeNote = insertIndex > 0 ? notes.find(n => String(n.id) === String(listItems[insertIndex - 1].dataset.noteId)) : null;
                    const afterNote = insertIndex < listItems.length ? notes.find(n => String(n.id) === String(listItems[insertIndex].dataset.noteId)) : null;
                    let newOrder;
                    if (beforeNote && afterNote) {
                      newOrder = ((beforeNote.order || 0) + (afterNote.order || 0)) / 2;
                    } else if (beforeNote) {
                      newOrder = (beforeNote.order || 0) + 1000;
                    } else if (afterNote) {
                      newOrder = (afterNote.order || 0) / 2;
                    } else {
                      newOrder = 1000;
                    }
                    note.order = newOrder;
                    saveNotes(notes);
                    render();
                    _flashMilestoneReceived(goal.id);
                  } else if (note.type === 'idea') {
                    // 想法作为备注附加到里程碑
                    attachIdeaAsNote(goal.id, noteId);
                    render();
                    _flashMilestoneReceived(goal.id);
                  }
                }
              }
            });

            sec.appendChild(goalContent);

            goalContainer.appendChild(sec);
          });

          container.appendChild(goalContainer);
        }

        // 添加里程碑按钮
        const addMilestoneBtn = document.createElement('button');
        addMilestoneBtn.className = 'add-milestone-btn';
        addMilestoneBtn.textContent = '+ 新里程碑';
        addMilestoneBtn.addEventListener('click', () => {
          const input = document.createElement('input');
          input.type = 'text';
          input.className = 'add-milestone-input';
          input.placeholder = '输入里程碑名称...';
          addMilestoneBtn.replaceWith(input);
          input.focus();

          let done = false;
          const finish = (save) => {
            if (done) return;
            done = true;
            if (save && input.value.trim()) {
              addMilestone(input.value.trim());
            } else {
              render();
            }
          };

          input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
              e.preventDefault();
              finish(true);
            } else if (e.key === 'Escape') {
              e.preventDefault();
              finish(false);
            }
          });
          input.addEventListener('blur', () => finish(true));
        });
        container.appendChild(addMilestoneBtn);

        // 想法（移到右侧面板，不在这里显示）

        // 其他
        if (untypedNotes.length > 0) {
          const sec = document.createElement('section');
          sec.className = 'type-section';

          const label = document.createElement('div');
          label.className = 'type-section-title';
          label.textContent = t('其他');
          sec.appendChild(label);

          const list = document.createElement('ul');
          list.className = 'note-list';

          untypedNotes.forEach(note => {
            try {
              const item = createNoteItem(note, projects, true);
              list.appendChild(item);
            } catch (err) {
              console.warn('[项目视图未分类] 渲染 note 出错，已跳过:', note, err);
            }
          });

          sec.appendChild(list);
          container.appendChild(sec);
        }
      }

      scheduleStableWeekPanelRender();

      // 渲染想法侧边面板（只在项目视图显示）
      const isProjectView = activeFilter !== 'all' && activeFilter !== ANCHOR_ID && activeFilter !== CHECKIN_ID;
      if (isProjectView) {
        const projectNotes = loadNotes().filter(n => n.projectId === activeFilter);
        const ideas = projectNotes.filter(n => n.type === 'idea');
        renderIdeaPanel(ideas);
      } else {
        renderIdeaPanel(null); // 隐藏面板
      }
      _translateDOM(container);
    }

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        if (!input.value.trim()) return;

          addNoteWithType(input.value.trim(), 'idea');
          input.value = '';
          return;

        showTypeSelector();

        e.preventDefault();
        hideTypeSelector();
      }
    });

    // 类型选择器按钮点击
    typeSelector.querySelectorAll('.type-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const type = btn.dataset.type;
        const text = input.value.trim();
        if (text) {
          addNoteWithType(text, type);
        }
        hideTypeSelector();
        input.value = '';

    document.addEventListener('click', (e) => {

      if (!e.target.closest('.sub-todo-item') && !e.target.closest('.note-context-menu') && !e.target.closest('.note-menu')) {

    function addNoteWithType(text, type) {
      const trimmed = text.trim();
      if (!trimmed) return;

      const projectId = activeFilter !== 'all' ? activeFilter : null;

      // 免费版待办数量限制检查
      if (type === 'todo') {
        const check = canAddTodo(projectId);
        if (!check.canAdd) {
          checkProStatus().then(isPro => {
            if (!isPro) {
              showPaywall();
            } else {
              doAddNoteWithType(trimmed, type, projectId);
            }
          }).catch(() => {
            showPaywall();
          });
          return;
        }
      }

      doAddNoteWithType(trimmed, type, projectId);
    }

    function doAddNoteWithType(trimmed, type, projectId) {
      const now = new Date();
      const notes = loadNotes();
      const newNote = {
        id: Date.now(),
        text: trimmed,
        type: type || null,
        completed: false,
        projectId: projectId,
        dateKey: toDateKey(now),
        time: formatTime(now),
        timestamp: now.getTime(),
      };
      if (type === 'todo') {
        newNote.order = Date.now();
        newNote.completed = false;
      }
      notes.unshift(newNote);
      saveNotes(notes);
      render();
      renderProjects();
    }

      input.type = 'text';
      input.className = 'add-project-input';
      input.placeholder = t('项目名称');
      addProjectBtn.style.display = 'none';
      addProjectBtn.parentNode.insertBefore(input, addProjectBtn);
      input.focus();

      let done = false;
      const finish = async (save) => {
        if (done) return;
        done = true;
        if (save && input.value.trim()) {
          const projectId = await addProject(input.value);
          if (projectId) {
            setTimeout(() => {
              const projectItem = projectListEl.querySelector(`[data-project-id="${projectId}"]`);
              if (projectItem) startProjectEdit(projectId, projectItem);
            }, 50);
          }
        }
        input.remove();
        addProjectBtn.style.display = 'block';
      };

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          finish(true);
        } else if (e.key === 'Escape') {
          e.preventDefault();
          finish(false);
        }
      });
      input.addEventListener('blur', () => finish(true));
    });

              if (!p.classList.contains('show') && p.parentElement === document.body) {

              }

        });

      }
      if (editingNoteId && !e.target.closest('.note-edit-input') && !e.target.closest('.note-item')) {
        const editInput = document.querySelector(`[data-edit-id="${editingNoteId}"]`);
        if (editInput) {
          const note = loadNotes().find(n => String(n.id) === String(editingNoteId));
          if (note && note.type === 'todo') {
            updateNote(editingNoteId, editInput.value, false);
          } else {
            editingNoteId = null;
            render();
          }
        } else {
          editingNoteId = null;
          render();

    function downloadJsonBackup(reason) {
      const data = {
        notes: loadNotes(),
        projects: loadProjects(),
        moods: JSON.parse(localStorage.getItem(MOOD_KEY) || '{}'),
        skeletonTemplates: JSON.parse(localStorage.getItem(SKELETON_KEY) || '[]'),
        exportedAt: new Date().toISOString(),
        reason: reason || 'manual-backup'

    async function importDataFromMenu() {
      let content;
      if (typeof window.__TAURI__ !== 'undefined' && window.__TAURI__.core) {
        try {
          content = await window.__TAURI__.core.invoke('import_json_file');
        } catch (e) {
          if (e !== 'cancelled') showAlertModal('导入失败：' + e);
          return;
        }
      } else {
        // 浏览器环境：用文件选择器读取 JSON 备份
        content = await new Promise((resolve) => {
          const picker = document.createElement('input');
          picker.type = 'file';
          picker.accept = '.json,application/json';
          picker.addEventListener('change', () => {
            const file = picker.files && picker.files[0];
            if (!file) { resolve(null); return; }
            const reader = new FileReader();
            reader.onload = () => resolve(String(reader.result));
            reader.onerror = () => resolve(null);
            reader.readAsText(file);
          });
          picker.click();
        });
        if (!content) return; // 用户取消选择
      }
      try {
        const data = JSON.parse(content);
        if (!data.notes || !data.projects) throw new Error(t('文件格式不对'));

        const choice = await showChoiceModal(
          t('选择导入方式：\n\n1 = 覆盖当前数据（用导入文件替换现有记录和项目）\n2 = 合并补充（只添加现有数据里没有的记录和项目）\n\n取消或留空 = 不导入'),
          [
            { label: t('覆盖'), value: '1', primary: false },
            { label: t('合并'), value: '2', primary: true },
            { label: t('取消'), value: null, primary: false }
          ]
        );
        if (!choice) return;

        rememberUndoSnapshot();

        if (choice === '1') {
          saveNotes(data.notes);
          saveProjects(data.projects);
          if (data.moods) localStorage.setItem(MOOD_KEY, JSON.stringify(data.moods));
          if (data.skeletonTemplates) localStorage.setItem(SKELETON_KEY, JSON.stringify(data.skeletonTemplates));
          if (data.skeletonCurrentTemplate !== undefined) localStorage.setItem(SKELETON_TEMPLATE_KEY, data.skeletonCurrentTemplate);
          if (data.skeletonCategories) localStorage.setItem(SKELETON_CATEGORIES_KEY, JSON.stringify(data.skeletonCategories));
          if (data.trash) saveTrash(data.trash);
          await showAlertModal(`导入完成：已覆盖为 ${data.notes.length} 条记录，${data.projects.length} 个项目。`);
        } else if (choice === '2') {
          const existingNotes = loadNotes();
          const existingProjects = loadProjects();
          const existingNoteIds = new Set(existingNotes.map(n => String(n.id)));
          const existingProjectIds = new Set(existingProjects.map(p => String(p.id)));
          const newNotes = data.notes.filter(n => !existingNoteIds.has(String(n.id)));
          const newProjects = data.projects.filter(p => !existingProjectIds.has(String(p.id)));
          saveNotes([...existingNotes, ...newNotes]);
          saveProjects([...existingProjects, ...newProjects]);
          if (data.moods) localStorage.setItem(MOOD_KEY, JSON.stringify(data.moods));
          if (data.skeletonTemplates) localStorage.setItem(SKELETON_KEY, JSON.stringify(data.skeletonTemplates));
          if (data.skeletonCurrentTemplate !== undefined) localStorage.setItem(SKELETON_TEMPLATE_KEY, data.skeletonCurrentTemplate);
          if (data.skeletonCategories) localStorage.setItem(SKELETON_CATEGORIES_KEY, JSON.stringify(data.skeletonCategories));
          const newBlocks = data.skeletonTemplates
            ? data.skeletonTemplates.reduce((sum, t) => {
                const existing = skeletonTemplates.find(et => et.id === t.id);
                const existingIds = new Set((existing?.blocks || []).map(b => b.id));
                return sum + t.blocks.filter(b => !existingIds.has(b.id)).length;
              }, 0)
            : 0;
          if (newNotes.length === 0 && newProjects.length === 0 && newBlocks === 0) {
            await showAlertModal('导入的数据和现有数据完全重复，没有新内容可导入。');
          } else {
            const parts = [];
            if (newNotes.length > 0) parts.push(`${newNotes.length} 条记录`);
            if (newProjects.length > 0) parts.push(`${newProjects.length} 个项目`);
            if (newBlocks > 0) parts.push(`${newBlocks} 个时间块`);
            await showAlertModal(`导入成功！新增 ${parts.join('、')}。`);
          }

        // 刷新内存变量（skeletonTemplates 等全局变量不会自动读取 localStorage）
        skeletonTemplates = loadSkeletonTemplates();
        skeletonCategories = loadSkeletonCategories();
        currentSkeletonTemplate = localStorage.getItem(SKELETON_TEMPLATE_KEY) || 'workday';

        activeFilter = 'all';
        localStorage.setItem(GLASS_NEXT_ACTION_FILTER_KEY, 'all');
        if (typeof input !== 'undefined') input.placeholder = '先写下来，腾空脑子';
        render();
        renderProjects();
        renderWeekView(true);
      } catch (err) {
        showAlertModal('导入失败：' + err.message);
      }
    }

        nextNotes = nextNotes.filter(note => {

    function getTodayMorningRange() {
      const now = new Date();
      const start = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0, 0).getTime();
      const noon = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 12, 0, 0, 0).getTime();
      return { start, end: noon };
    }

    function diagnoseNotesForRepair(notes, projects) {
      const projectIds = new Set(projects.map(p => String(p.id)));
      const { start, end } = getTodayMorningRange();
      const todayMorningNotes = [];
      const invalidNotes = [];
      const invalidCalendarNotes = [];
      const orphanProjectNotes = [];
      const malformedSubTodoNotes = [];

      notes.forEach(note => {
        const ts = Number(note.timestamp || note.id || 0);
        if (ts >= start && ts < end) {
          todayMorningNotes.push(note);
        }
        if (!note || note.id == null || typeof note.text !== 'string') {
          invalidNotes.push(note);
        }
        if (note && note.scheduledDate && !isValidDateKey(note.scheduledDate)) {
          invalidCalendarNotes.push(note);
        } else if (note && note.scheduledTime && !isValidTimeKey(note.scheduledTime)) {
          invalidCalendarNotes.push(note);
        }
        if (note && note.projectId && !projectIds.has(String(note.projectId)) && note.projectId !== ANCHOR_ID && note.projectId !== CHECKIN_ID) {
          orphanProjectNotes.push(note);
        }
        if (note && note.subTodos != null && !Array.isArray(note.subTodos)) {
          malformedSubTodoNotes.push(note);
        }
      });

      return {
        todayMorningNotes,
        invalidNotes,
        invalidCalendarNotes,
        orphanProjectNotes,
        malformedSubTodoNotes
      };
    }

    function repairNotesStructure(notes, projects) {
      const projectIds = new Set(projects.map(p => String(p.id)));
      let changed = 0;
      const repaired = notes
        .filter(note => note && note.id != null && typeof note.text === 'string')
        .map(note => {
          const next = { ...note };
          if (!['todo', 'idea', 'goal', null, undefined].includes(next.type)) {
            next.type = null;
            changed++;
          }
          if (next.scheduledDate && !isValidDateKey(next.scheduledDate)) {
            delete next.scheduledDate;
            delete next.scheduledTime;
            changed++;
          }
          if (next.scheduledTime && !isValidTimeKey(next.scheduledTime)) {
            delete next.scheduledTime;
            changed++;
          }
          if (next.projectId && !projectIds.has(String(next.projectId)) && next.projectId !== ANCHOR_ID && next.projectId !== CHECKIN_ID) {
            next.projectId = null;
            changed++;
          }
          if (next.subTodos != null && !Array.isArray(next.subTodos)) {
            next.subTodos = [];
            changed++;
          }
          if (!Number.isFinite(Number(next.timestamp))) {
            next.timestamp = Number(next.id) || Date.now();
            changed++;
          }
          if (!next.dateKey || !isValidDateKey(next.dateKey)) {
            next.dateKey = toDateKey(new Date(next.timestamp || Date.now()));
            changed++;
          }
          if (!next.time || !isValidTimeKey(next.time)) {
            next.time = formatTime(new Date(next.timestamp || Date.now()));
            changed++;
          }
          return next;
        });
      const removed = notes.length - repaired.length;
      return { repaired, changed, removed };
    }

    function prefersSystemDark() {
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    }

    function getBrightnessMode() {
      const saved = localStorage.getItem('darkMode');
      if (saved === 'dark' || saved === 'light' || saved === 'system') return saved;
      if (saved === 'true') return 'dark';
      if (saved === 'false') return 'light';
      return 'system';
    }

    function applyBrightnessMode() {
      const mode = getBrightnessMode();
      const isDark = mode === 'system' ? prefersSystemDark() : mode === 'dark';
      document.body.classList.toggle('dark-mode', isDark);
      updateAppearanceMenuState();
      renderProjects();
    }

    function setBrightnessMode(mode) {
      localStorage.setItem('darkMode', mode);

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function highlightMatch(text, query) {
      if (!query) return escapeHtml(text);
      const escaped = escapeHtml(text);
      const regex = new RegExp('(' + query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
      return escaped.replace(regex, '<mark>$1</mark>');
    }

    function formatDateBadge(dateKey) {
      const d = new Date(dateKey + 'T00:00:00');
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const diff = Math.round((d - today) / 86400000);
      const m = d.getMonth() + 1;
      const day = d.getDate();
      if (diff === 0) return '今天';
      if (diff === -1) return '昨天';
      if (diff === 1) return '明天';
      return m + '月' + day + '日';
    }

    function getGoalName(goalId) {
